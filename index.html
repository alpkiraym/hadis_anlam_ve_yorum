<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccb;
  --green:#1f5a45; --green-2:#2f7a5f; --green-soft:#e4efe8; --gold:#b08a3e; --gold-soft:#f4ead3;
  --red:#a8432f; --red-soft:#f6e1db; --radius:14px; --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:Amiri,"Traditional Arabic","Scheherazade New","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{padding-bottom:34px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:rgba(247,243,234,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.15rem;font-weight:700;color:var(--green);background:none;border:0;padding:0}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.crumb .brand{min-width:0}.crumb .bt{overflow:hidden;text-overflow:ellipsis}
.ga{display:grid;text-decoration:none;border-radius:8px}
.ga .mark,.brand .pmark{width:30px;height:30px;border-radius:8px;background:var(--green);color:#f4c430;display:grid;place-items:center;flex:none}
.ga:hover .mark{background:var(--green-2)}
.csep{color:var(--line);font-size:1.3rem;line-height:1;margin:0 1px}
.brand .pmark{background:var(--gold-soft);color:var(--green);border:1px solid #e6d6ae}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted)}
.ghost:hover{border-color:var(--green-2);color:var(--green)}
.iconbtn{padding:6px 10px;display:inline-grid;place-items:center}
h1,h2,h3{font-family:var(--serif);line-height:1.25;margin:0}
h1{font-size:1.7rem;color:var(--green)}
h2{font-size:1.3rem}
.lead{color:var(--muted);margin:6px 0 0}
.hero{padding:28px 0 8px}
.hero .arn{font-family:var(--ar);font-size:1.5rem;color:var(--gold);margin-top:2px;text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--green)}
.stat span{font-size:.8rem;color:var(--muted)}
.section-title{margin:26px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--green-2)}
.mode .ico{font-size:1.4rem;width:40px;height:40px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;margin-bottom:10px}
.mode h3{font-size:1.08rem;margin-bottom:4px}
.mode p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.bar{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
.progress{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green-2);transition:width .3s}
.count{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;background:var(--gold-soft);color:#7a5c1e;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q{font-family:var(--serif);font-size:1.25rem;margin:4px 0 18px}
.q.long{font-family:var(--sans);font-size:1.02rem;line-height:1.6;background:var(--paper);border-radius:12px;padding:12px 14px}
.q em{font-style:normal;color:var(--green);font-weight:700}
.q small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-bottom:6px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--green-2)}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--paper);font-size:.93rem;display:none}
.explain.show{display:block}
.explain b{color:var(--green)}
.explain .src{display:block;color:var(--muted);font-size:.82rem;margin-top:6px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--green);color:#fff;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center;padding:30px 20px}
.big{font-family:var(--serif);font-size:3rem;color:var(--green);line-height:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0 0 2px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.93rem;min-height:52px;transition:all .15s}
.tile.sel{border-color:var(--gold);background:var(--gold-soft)}
.tile.done{border-color:var(--green-soft);background:var(--green-soft);color:var(--green);opacity:.75}
.tile.wrong{animation:shake .3s;border-color:var(--red);background:var(--red-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{perspective:1200px;min-height:280px;cursor:pointer;margin-top:4px}
.flash-in{position:relative;min-height:280px;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);background:#fbf7ec}
.face .t{font-family:var(--serif);font-size:1.5rem;color:var(--green)}
.face .s{color:var(--ink);font-size:.98rem;margin-top:10px;max-width:560px;line-height:1.6}
.face .hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.answer{display:none;margin-top:6px;border-top:1px dashed var(--line);padding-top:14px}
.answer.show{display:block}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1rem}
.search:focus{outline:none;border-color:var(--green-2)}
.list{margin-top:12px;display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:block}
button.row:hover{border-color:var(--green-2)}
.row .e{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--green)}
.row .n{font-size:.93rem;margin-top:3px;line-height:1.55}
.row .w{font-size:.76rem;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.meter{display:grid;grid-template-columns:minmax(120px,240px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .progress{height:10px}
.select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.9rem;max-width:100%}
.rowctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kaynak{margin:28px auto 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
.foot{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.sig{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 12px calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;letter-spacing:.02em;color:var(--muted)}
.sig b{color:var(--green);font-weight:600}
.sig i{font-style:normal;opacity:.5}
.study-cta{display:flex;gap:14px;align-items:center;background:var(--green);color:#fff;border:0;border-radius:var(--radius);padding:18px;text-align:left;width:100%;box-shadow:var(--shadow);margin-bottom:12px}
.study-cta:hover{background:var(--green-2)}
.study-cta .ico{font-size:1.5rem;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.study-cta h3{font-size:1.15rem;margin-bottom:2px;color:#fff}
.study-cta p{margin:0;opacity:.85;font-size:.9rem}
.ulist{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.unit:hover{border-color:var(--green-2)}
.unit .st{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.unit.done .st{background:var(--green-2);border-color:var(--green-2);color:#fff}
.unit.next .st{border-color:var(--gold);color:var(--gold)}
.unit .ut{flex:1}.unit .ut b{display:block;font-weight:600}.unit .ut small{color:var(--muted)}
.intro{font-size:1.02rem;margin:10px 0 14px}
.tipbox{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.tipbox b.lb{color:#7a5c1e;display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
details.oq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
details.oq summary{cursor:pointer;font-weight:600}
.sticky-go{position:sticky;bottom:40px;display:flex;justify-content:center;margin-top:20px}
.sticky-go .btn{box-shadow:0 6px 20px rgba(31,90,69,.3);padding:11px 20px;font-size:.95rem}
.backlink{background:none;border:0;color:var(--green);font-weight:600;padding:14px 0 0;font-size:.95rem}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.toc button:hover{border-color:var(--green-2);color:var(--green)}
.lesson section.ls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;scroll-margin-top:70px}
.lesson h3{font-family:var(--serif);font-size:1.12rem;color:var(--ink);display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;line-height:1.35}
.lesson h3 .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--green-soft);color:var(--green);font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.lesson h4{font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
.lesson p{margin:0 0 8px;font-size:.98rem;line-height:1.65}
.lesson p.li{padding-left:16px;position:relative}.lesson p.li:before{content:"•";position:absolute;left:3px;color:var(--gold);font-weight:700}
.lesson p.num{padding-left:24px;position:relative}.lesson p.num .nn{position:absolute;left:0;color:var(--green);font-weight:700}
.lesson b{color:var(--green)}
.def{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--green-soft);margin:8px 0}
.def dt{font-family:var(--serif);font-weight:700;color:var(--green)}
.def dd{margin:0;line-height:1.6}
.ar{font-family:var(--ar);font-size:1.18em;line-height:1.9;direction:rtl;unicode-bidi:isolate;color:#5b3f86}
.ar.blk{display:block;text-align:right;margin:4px 0}
.ayet{display:block;font-family:var(--ar);font-size:1.3rem;line-height:2.1;direction:rtl;text-align:right;color:#5b3f86;margin:4px 0 2px}
.sov{position:fixed;inset:0;z-index:90;background:rgba(20,25,20,.35);display:none}
.sov.open{display:block}
.sbox{background:var(--paper);max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.sbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);color:var(--muted)}
.sbar input{flex:1;border:0;background:transparent;font-size:1.05rem;padding:8px 2px;color:var(--ink);outline:none;min-width:0}
.sres{overflow:auto;padding:4px 14px 80px;flex:1}
.sgrp{margin:16px 0 6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.sitem:hover{border-color:var(--green-2)}
.sitem .t{font-weight:600}.sitem .w{font-size:.78rem;color:var(--green);font-weight:600;margin-bottom:2px}
.sitem .x{font-size:.88rem;color:var(--muted);margin-top:3px}
mark{background:#f6df9b;color:inherit;border-radius:3px;padding:0 1px}
.flash-target{animation:ft 2.2s ease}
@keyframes ft{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0 14px}
.how summary{cursor:pointer;font-weight:700;color:var(--green);font-family:var(--serif);font-size:1.05rem}
.how .steps{margin:10px 0 6px;padding-left:22px;display:grid;gap:8px;font-size:.94rem}
.how .steps li::marker{color:var(--gold);font-weight:700}
.hownote{margin:6px 0 2px;color:var(--muted);font-size:.86rem}
.exq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.exq .qq{font-family:var(--serif);font-size:1.05rem;font-weight:700;display:flex;gap:10px}
.exq .qq .no{flex:none;width:26px;height:26px;border-radius:8px;background:var(--gold-soft);color:#7a5c1e;font-family:var(--sans);font-size:.8rem;display:grid;place-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--green-soft);color:var(--green);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600}
.oralbody{max-height:none}
.snote{font-size:.86rem;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.lesson h3 .rep{margin-left:auto;flex:none;margin-top:2px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exq .qq .rep{margin-left:auto;flex:none}
.hide{display:none!important}

/* ---------- Hadis Anlam ve Yorum: öğretici görünüm ---------- */
.lesson h5{font-family:var(--sans);font-size:.92rem;color:var(--green);margin:12px 0 6px}
.box{border-radius:10px;padding:11px 14px;margin:10px 0;font-size:.95rem;line-height:1.6;border-left:4px solid}
.box b.lb{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.box.bn{background:var(--gold-soft);border-color:var(--gold)}.box.bn b.lb{color:#7a5c1e}
.box.bk{background:var(--red-soft);border-color:var(--red)}.box.bk b.lb{color:var(--red)}
.box.bo{background:#fff;border:1px dashed var(--green-2);border-left:4px solid var(--green-2)}.box.bo b.lb{color:var(--green-2)}
.box.bs{background:#eef1f6;border-color:#4a6283}.box.bs b.lb{color:#4a6283}
.box.bs .sq{font-weight:600;margin:0 0 6px!important}.box.bs .sa{margin:0!important}.box.bs .sa b{color:#4a6283}
.arb{background:#f8f5fb;border-radius:10px;padding:8px 14px;margin:8px 0}
.arb .ayet{margin:2px 0}
.arb .meal{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;line-height:1.5}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.5}
.tbl th,.tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{background:var(--green);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.02em;white-space:nowrap}
.tbl thead th b{color:#fff}
.tbl tbody th{font-weight:600;color:var(--green);background:#fbf8f1;min-width:110px}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:#fcfaf5}
.tbl .ar{font-size:1.05em;line-height:1.8}
.tbl.cmp thead th:first-child{background:var(--green-2)}
.stp{list-style:none;counter-reset:st;margin:10px 0;padding:0 0 0 4px}
.stp li{counter-increment:st;position:relative;padding:0 0 12px 36px;font-size:.95rem;line-height:1.6}
.stp li:before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.stp li:after{content:"";position:absolute;left:11px;top:26px;bottom:2px;border-left:2px solid var(--gold-soft)}
.stp li:last-child{padding-bottom:2px}.stp li:last-child:after{display:none}
details.ht{background:var(--green-soft);border:1px solid #cfe0d6;border-radius:var(--radius);margin:16px 0 10px;padding:0}
details.ht summary{cursor:pointer;padding:13px 16px;font-family:var(--serif);font-weight:700;color:var(--green);font-size:1.08rem;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.ht summary::-webkit-details-marker{display:none}
details.ht summary small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.82rem;width:100%;margin-left:36px;margin-top:-6px}

<script>
/* Kullanım: düğme → <button class="rep" data-k="benzersiz-anahtar" data-yer="Ünite 3 · Bölüm" data-bas="Kayıt başlığı">⚑ Bildir</button>
   Programda önceden tanımlanır: window.BLD_APP = 'Program adı'; window.BLD_PREFIX = 'kayıt ön eki';
   İsteğe bağlı: "Bildirimlerim" düğmesinin konacağı yer → window.BLD_SLOT = 'css seçici' */
(function () {
  const APP = window.BLD_APP || 'Program', MAIL = 'alpkiraymehmet@gmail.com';
  const KEY = (window.BLD_PREFIX || 'bld_') + 'reports';
  const TYPES = ['Bilgi yanlış', 'Eksik ya da karışık anlatım', 'Soru, şık veya cevap hatalı', 'Arapça metin bozuk', 'Yazım hatası', 'Diğer'];
  const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const getL = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
  const setL = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch (e) {} sync(); };
  const modal = document.getElementById('bldModal'), box = document.getElementById('bldBox');
  let lbtn = null;
  function slot() {
    if (lbtn || !window.BLD_SLOT) return;
    const s = document.querySelector(window.BLD_SLOT); if (!s) return;
    lbtn = document.createElement('button'); lbtn.type = 'button'; lbtn.className = 'bld-lbtn'; lbtn.title = 'Listeye eklediğin hata bildirimleri';
    lbtn.onclick = openList; s.appendChild(lbtn);
  }
  function sync() { slot(); if (lbtn) { const n = getL().length; lbtn.classList.toggle('has', n > 0); lbtn.innerHTML = `⚑<span class="bld-lg"> Bildirimlerim</span> (${n})`; } mark(); }
  function mark() { const l = getL(); document.querySelectorAll('.rep[data-k]').forEach(b => b.classList.toggle('on', l.some(x => x.k === b.dataset.k))); }
  const TR = {'ç': 'c', 'ğ': 'g', 'ı': 'i', 'ö': 'o', 'ş': 's', 'ü': 'u', 'â': 'a', 'î': 'i', 'û': 'u', 'Ç': 'C', 'Ğ': 'G', 'İ': 'I', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U', 'Â': 'A', 'Î': 'I', 'Û': 'U'};
  const ascii = t => String(t).normalize('NFC').replace(/[çğıöşüâîûÇĞİÖŞÜÂÎÛ]/g, c => TR[c]).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\x20-\x7E\n]/g, '');
  const plain = t => String(t).replace(/[“”«»]/g, '"').replace(/[‘’ʿʾ]/g, "'").replace(/[·—–…]/g, '-').replace(/\s{2,}/g, ' ').trim();
  const body1 = r => `Program: ${APP}\nYer: ${r.yer}\nKayit: ${r.bas}\nKayit no: ${r.k}\nHata turu: ${r.type}\nNot: ${r.note || '-'}\nSayfa: ${r.url}`;
  const subj = r => `[${APP} Hata] ${r.k}`;
  const mailto = (su, bo) => `mailto:${MAIL}?subject=${encodeURIComponent(ascii(plain(su)))}&body=${encodeURIComponent(ascii(bo.split('\n').map(plain).join('\n'))).replace(/%0A/g, '%0D%0A')}`;
  const gmail = (su, bo) => `https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(bo)}`;
  function copy(t, msg) {
    const done = () => { msg.textContent = `Kopyalandı. Yeni bir e-posta aç, alıcıya ${MAIL} yaz ve metni mesajın içine yapıştır.`; };
    const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.'; } ta.remove(); };
    try { if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(t).then(done, fb); else fb(); } catch (e) { fb(); }
  }
  let pushed = false;
  function open(html) {
    box.innerHTML = html;
    if (!modal.classList.contains('open')) { try { history.pushState(Object.assign({}, history.state, {bld: 1}), ''); pushed = true; } catch (e) { pushed = false; } }
    modal.classList.add('open'); const f = box.querySelector('textarea,input,button'); f && f.focus();
  }
  let closing = false;
  function close() { if (!modal.classList.contains('open')) return; modal.classList.remove('open'); if (pushed) { pushed = false; closing = true; try { history.back(); } catch (e) { closing = false; } } }
  // Telefonda geri hareketi önce pencereyi kapatsın, programın kendi gezinmesine geçmesin
  window.addEventListener('popstate', e => {
    if (closing) { closing = false; e.stopImmediatePropagation(); return; }
    if (modal.classList.contains('open') || pushed || (history.state && history.state.bld)) {
      const wasOpen = modal.classList.contains('open');
      modal.classList.remove('open'); pushed = false; e.stopImmediatePropagation();
      if (!wasOpen && history.state && history.state.bld) { try { history.back(); } catch (er) {} }
    }
  }, true);
  modal.addEventListener('click', e => { if (e.target === modal || e.target.closest('[data-x=close]')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });
  function report(b) {
    const r = {k: b.dataset.k, yer: b.dataset.yer || '', bas: b.dataset.bas || '', url: location.href};
    open(`<h3 id="bldTitle">Hata bildir</h3><div class="bld-loc">${E(r.yer)}</div><div class="bld-q">${E(r.bas)}</div>
      ${TYPES.map((t, i) => `<label><input type="radio" name="bldt" value="${i}" ${i === 0 ? 'checked' : ''}> ${E(t)}</label>`).join('')}
      <textarea id="bldNote" placeholder="Not (isteğe bağlı): doğrusu ne olmalı, kaynağı nedir…"></textarea>
      <div class="bld-btns"><button class="pri" data-a="mail">E-posta ile gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="add">Listeye ekle</button><button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div>
      <div class="bld-hint">“E-posta ile gönder” bilgisayarındaki/telefonundaki e-posta uygulamasını açar. Açılmazsa “Gmail'de aç”ı ya da “Metni kopyala”yı kullan. Adres: ${MAIL}. Birden çok hata bulacaksan “Listeye ekle” deyip sonra üstteki “Bildirimlerim” ile hepsini tek e-postada gönderebilirsin.</div>`);
    const get = () => Object.assign({}, r, {type: TYPES[+box.querySelector('input[name=bldt]:checked').value], note: box.querySelector('#bldNote').value.trim()});
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    q('mail').onclick = () => { const x = get(); try { navigator.clipboard && navigator.clipboard.writeText(body1(x)).catch(() => {}); } catch (e) {} location.href = mailto(subj(x), body1(x)); msg.textContent = 'E-posta uygulaman açılıyor… Metin ayrıca panoya kopyalandı: mesaj boş ya da bozuk görünürse içini silip yapıştırabilirsin.'; };
    q('gmail').onclick = function () { const x = get(); this.href = gmail(subj(x), body1(x)); };
    q('copy').onclick = () => copy(body1(get()), msg);
    q('add').onclick = () => { const l = getL(); l.push(get()); setL(l); msg.textContent = `Listeye eklendi (${l.length}). Üstteki “Bildirimlerim” ile topluca gönderebilirsin.`; };
  }
  function openList() {
    const l = getL(), su = `[${APP} Hata] Toplu bildirim (${l.length} hata)`, bo = l.map((r, i) => `--- ${i + 1} ---\n${body1(r)}`).join('\n\n');
    open(`<h3 id="bldTitle">Bildirimlerim (${l.length})</h3>
      ${l.length ? `<ul class="bld-list">${l.map((r, i) => `<li><div><b>${E(r.bas.slice(0, 90))}</b><br><small>${E(r.yer)} · ${E(r.type)}${r.note ? ' — ' + E(r.note) : ''}</small></div><button data-del="${i}" title="Listeden çıkar">✕</button></li>`).join('')}</ul>` : '<p>Liste boş.</p>'}
      <div class="bld-btns">${l.length ? `<button class="pri" data-a="mail">Hepsini e-postayla gönder</button><a data-a="gmail" href="#" target="_blank" rel="noopener">Gmail'de aç</a><button data-a="copy">Metni kopyala</button><button data-a="clear">Listeyi temizle</button>` : ''}<button data-x="close">Kapat</button></div>
      <div class="bld-msg" id="bldMsg" aria-live="polite"></div><div class="bld-hint">Gönderdikten sonra “Listeyi temizle” diyebilirsin. Liste yalnızca bu tarayıcıda saklanır.</div>`);
    const msg = box.querySelector('#bldMsg'), q = a => box.querySelector(`[data-a=${a}]`);
    box.querySelectorAll('[data-del]').forEach(x => x.onclick = () => { const L = getL(); L.splice(+x.dataset.del, 1); setL(L); openList(); });
    if (!l.length) return;
    q('mail').onclick = () => { const u = mailto(su, bo); if (u.length > 1900) msg.textContent = `Liste uzun; e-posta uygulaması metni kesebilir. Kesilirse “Gmail'de aç” veya “Metni kopyala”yı kullan.`; location.href = u; };
    q('gmail').href = gmail(su, bo);
    q('copy').onclick = () => copy(bo, msg);
    q('clear').onclick = () => { setL([]); openList(); };
  }
  document.addEventListener('click', e => { const b = e.target.closest('.rep[data-k]'); if (!b) return; e.preventDefault(); e.stopPropagation(); report(b); }, true);
  new MutationObserver(() => { if (!lbtn) slot(); mark(); }).observe(document.body, {childList: true, subtree: true});
  window.bldButton = (k, yer, bas, txt) => `<button type="button" class="rep" data-k="${E(k)}" data-yer="${E(yer)}" data-bas="${E(String(bas).slice(0, 400))}" title="Bu kayıttaki bir hatayı bildir">${txt || '⚑ Bildir'}</button>`;
  window.bldOpenList = openList;
  sync();
})();
</script>

    }).join('') + '<p class="gab-note">Diğer dersler hazırlanıyor; hazır oldukça bu listeye eklenecek.</p>';
  }
  function seri(){
    var g=rd('ga_gunler',[]); if(!g.length) return 0;
    var set={}; g.forEach(function(x){ set[x]=1; });
    var d=new Date(), n=0; if(!set[gun(d)]) d.setDate(d.getDate()-1);

    return n;
  }
  function karne(){

      var_=true; var d=o.d||0, y=o.y||0; D+=d; Y+=y; K+=o.kart||0;

    }).join('');
    // Kur'ân Meali (ders listesinde değil): üst başlık + alt satırlar (Kelime testi, İ'râb testi)
    var ml=all.meal;
    function mlSatir(o, ad, sinif, u){
      var md=o.d||0, my=o.y||0, mb=Math.round((o.bitti||0)*100), mq=md+my?Math.round(md/(md+my)*100):null, mc=mq===null?'e':(mq>=75?'':(mq>=50?'o':'z'));
      return '<button class="gab-kr'+sinif+'" type="button" data-u="'+esc(u)+'"><span class="nm"><b>'+esc(ad)+'</b><small>'+esc(o.etiket||'')+'</small></span><span class="n">%'+mb+'</span><span class="n gab-g '+mc+'">'+(mq===null?'—':'%'+mq)+'</span><span class="gab-bar"><i style="width:'+mb+'%"></i></span></button>';
    }
    if(ml){ var_=true; D+=ml.d||0; Y+=ml.y||0; K+=ml.kart||0;
      if(ml.alt && ml.alt.length){
        rows+=mlSatir({d:ml.d,y:ml.y,bitti:ml.bitti,etiket:''}, 'Kur\'ân Meali', '', (ml.yer&&ml.yer.url)||'/meal/');
        ml.alt.forEach(function(a){ rows+=mlSatir(a, a.ad, ' gab-alt', a.url||'/meal/'); });
      } else rows+=mlSatir(ml, 'Kur\'ân Meali', '', (ml.yer&&ml.yer.url)||'/meal/#/test');
    }
    var S=D+Y, P=S?Math.round(D/S*100):null, sr=seri();
    return '<div class="gab-st"><div><b>'+S+'</b><span>soru çözüldü</span></div><div><b>'+(P===null?'—':'%'+P)+'</b><span>doğru</span></div><div><b>'+K+'</b><span>kart biliniyor</span></div></div>'
      + (sr>1 ? '<div class="gab-streak">🔥 '+sr+' gündür aralıksız çalışıyorsunuz</div>' : (sr===1 ? '<div class="gab-streak">🔥 Bugün çalıştınız. Yarın da gelirseniz seri başlar.</div>' : ''))
      + '<div class="gab-k"><div class="gab-kr gab-kh"><span>Ders</span><span class="n">Bitti</span><span class="n">Doğru</span></div>'+rows+'</div>'
      + '<p class="gab-note">'+(var_?'Bir derse dokunursanız kaldığınız yere gidersiniz. ':'')+'İlerlemeniz yalnızca bu cihazda, bu tarayıcıda saklanır.</p>'
      + '<a class="gab-mail" href="mailto:'+MAIL+'?subject='+encodeURIComponent('[Giray Akademi] Öneri / soru')+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>İletişim · öneri ve soru gönderin</a>';
  }

<script>
const UNITELER = [{"t":"Hadiste Metin Tenkidi: Kavram ve Tarih Metoduyla Mukayese","intro":"Metin tenkidi kavramı, tarihçinin dış ve iç tenkidi ile hadisçinin isnad ve metin tenkidi arasındaki fark, iki ilmin tenkid merhaleleri, metinle ilgili sıhhat şartları, muâraza sistemi ve mevzuluk alâmetleri.","s":[{"h":"Kavram Olarak Metin Tenkidi","b":[{"k":"p","x":"Metin Tenkidi kavramının hadis ilminde bir ıstılah olarak kullanılması son dönemlerde ortaya çıkmıştır."},{"k":"p","x":"Hadis metinlerinin tenkidi, düşünce ve uygulama olarak müslümanların yabancısı değildir. Fakat bu olguyu bu kavramla / ıstılahla ifade etmemişler, farklı terimler kullanmışlardır. Muâraza, ihtilâf, teâruz, işkâl vs. gibi klasik kavramlar metin tenkidi ameliyesine tam tamına tetabuk etmese de referans teşkil ederler. Metin tenkidi deyimi hadis ilmi ve şarkiyatçıların ve modern tarihçilerin terminolojisinden geçmiştir."},{"k":"p","x":"Tarih ilminde metin tenkidi sadece tarihî belgenin tenkidine münhasır değildir. Tarihçilerin dış tenkid dediği şey tam olarak isnâd tenkidine, iç tenkid dedikleri şey de tam olarak metin tenkidine tekabül etmez. Dolayısıyla tarihçinin metin tenkidi ile kastettiği, hadisçinin metin tenkidi ile kastettiğinden farklıdır. Konunun açıklığa kavuşması için tarihçilerin tenkid terminolojisini ve yöntemlerini incelemek zarurîdir."},{"k":"h","x":"Modern tarihçilikte iki tenkid metodu"},{"k":"p","x":"Tarihî olayları gerçeğe uygun şekilde tesbit için modern tarihçilikte iki çeşit tenkid metodu kullanılmaktadır."},{"k":"d","t":"Dış tenkid (en-nakdu’l-hâricî, critique externe)","x":"Yani kaynak kritiği. Kaynak malzemenin orijinal mi yoksa sahte mi olduğunu tesbit için yapılan işlemlerdir."},{"k":"d","t":"İç tenkid (en-nakdu’l-bâtınî, critique interne)","x":"Yani muhtevânın tenkidi. İç tenkid de ikiye ayrılır: olumlu (pozitif) ve olumsuz (negatif) tenkid."},{"k":"li","x":"a) **Olumlu (îcâbî, pozitif) tenkid.** Târihî kaynağı anlamak ve tahlil etmek için yapılan işlemlerdir."},{"k":"li","x":"b) **Olumsuz (selbî, negatif) tenkid.** Bu tenkid de iki merhalede yapılır:"},{"k":"li","x":"ı) Müellifin veya haberi nakledenin tenkidi: Yani dürüstlüğünün tesbiti."},{"k":"li","x":"ıı) Haberi bize aktaranın aklî dengesinin ve duyu organlarının sağlam olup olmadığının, olayı tam ve hatasız müşâhede etmesine imkân sağlayacak çevre şartlarının bulunup bulunmadığının tesbiti gerekmektedir."},{"k":"p","x":"Kısaca tarihçi, yargılama esnasında bütün delilleri ve karineleri titiz bir şekilde inceleyen ve değerlendiren bir hâkim gibi olmalıdır. Buraya kadar anlatılanlarda görüldüğü üzere, hadisteki isnâd ve rical tenkidi negatif iç tenkid’e tekabül etmektedir. Dolayısıyla tarihteki dış tenkidi hadisteki isnâd tenkidiyle tarihteki iç tenkidi hadisteki metnin tenkidiyle özdeşleştirmek doğru değildir."},{"k":"tbl","r":[["Tarihçinin tenkidi","Neyi inceler?","Hadisteki karşılığı"],["**Dış tenkid** (kaynak kritiği)","Kaynak malzeme orijinal mi, sahte mi?","Tam olarak isnâd tenkidi değildir"],["**Olumlu iç tenkid**","Kaynağı anlamak ve tahlil etmek","—"],["**Olumsuz iç tenkid**","Nakledenin dürüstlüğü; aklî dengesi, duyuları ve çevre şartları","Hadisteki isnâd ve rical tenkidi buna tekabül eder"]]},{"k":"dikkat","x":"Tarihteki dış tenkidi hadisteki isnâd tenkidiyle, tarihteki iç tenkidi hadisteki metnin tenkidiyle özdeşleştirmek doğru değildir."}]},{"h":"Hadislerde Metin Tenkidi Yapılmadığı İddiaları","b":[{"k":"p","x":"Bazı müsteşrikler ve müslüman müellifler, hadis ilminde sadece cerh-ta’dîl yönünden sened tenkidi yapıldığı, metin tenkidine önem verilmediği iddiasını ileri sürmektedirler."},{"k":"li","x":"**Caetani**, hadisçilerin metin hakkında her türlü tenkidden müctenib (uzak) davrandıklarını söyler."},{"k":"li","x":"**İbn Haldun** (808/1405) da müslümanların tenkidci zihniyetten uzaklaştıkları için hataya düştüklerinden, günümüzden yedi asır önce şikâyette bulunmaktadır."},{"k":"li","x":"Bazı son devir müslüman müellifler de aynı iddiayı ileri sürmektedirler. Mesela **Zakir Kâdirî Ugan** bunlardandır."}]},{"h":"Tarihin Tenkid Metodu ile Hadisin Tenkid Metodunun Mukayesesi","b":[{"k":"p","x":"Modern tarih tenkidciliği ile hadis tenkidciliği kendi içlerinde müstakil birer sistemdirler."},{"k":"p","x":"Hadis ilmi islâm tarihinin ilk yıllarından itibaren kendi tenkid sistemini kurup olgunlaştırdığından, tenkid süzgecinden geçirilmiş malzeme ile birlikte, tenkid için gerekli bilgi ve verileri de günümüze ulaştırmıştır. Tarih ilminin durumu ise böyle değildir. Tenkidcilik için gerekli verilerden mahrumdur. Bu yüzden tarihçinin genellikle metin tenkidinden başka yapabileceği bir şey yoktur. Bunların çoğu da kesin bilgilere dayanmaktan ziyade, ictihâdî ve istidlâlî tenkidler olacaktır."},{"k":"p","x":"Şimdi her iki ilmin tenkid merhalelerini ayrı ayrı karşılaştıralım:"},{"k":"h","x":"1. Kaynakların Toplanması"},{"k":"p","x":"Tarihçilikte ilk plânda bütün kaynakların derlenmesi gelir. Bu genel prensip olmakla birlikte, tarihçilerde bir kaynağın mümkün olduğu ölçüde değişik bütün varyantlarını toplama tatbikatına yaygın bir şekilde rastlamıyoruz. Hadisçilerde ise bir hadisin bütün varyantlarını toplama geleneği çok yaygındır. Hadis kitaplarının çoğunun kaybolmasına rağmen, bir hadisin değişik hadis kitaplarında çok miktarda varyantlarına rastlamamız bunun en açık delilidir."},{"k":"h","x":"2. Kaynağın Sıhhatinin Tesbiti"},{"k":"p","x":"Tarihçi ve hadisçinin yapacağı ikinci iş, eldeki malzemenin sıhhatini tesbit etmektir. Hadisçiler bu konuda daha titiz ölçüler koymuşlardır. Haberi, nakledenler zincirindeki kişiler tek tek güvenilir ve hafızası sağlam, sened kesintisiz olmadıkça kabul etmezler."},{"k":"p","x":"Tarih ilminde bu tür tenkidlerden geçmiş hazır malzeme bulmak çok zordur."},{"k":"h","x":"3. Kaynağın Anlaşılması"},{"k":"p","x":"Hadisçiler metinlerde geçen ğarib (nâdir kullanılan) kelimeler, lâfızların gramer ve edebî yönden tahlilleri, isimlerin okunuş incelikleri vs. gibi müstakil ilim dalları tesis edip bu alanlarda kütüphaneler dolusu eserler yazmışlardır. Ayrıca şerh geleneği ile bu klasik malûmatı kolay kullanılır şekle sokarak nesilden nesile aktarmışlardır."},{"k":"p","x":"Tarihçinin ise böyle tahlil edilmiş ve çözülmüş, yazıldığı devrin anlayışına göre yorumlanmış vesika metinleri elde etme şansı hemen hemen yok gibidir."},{"k":"h","x":"4. Menfî Metin Tenkidi"},{"k":"p","x":"Hadisçiler sadece kaynağın sıhhatini tesbitle kalmamışlar, bugünkü iç tenkid metotlarını, gerektiği yerlerde en mükemmel şekilde kullanmışlardır. Tarihçinin metin tenkidine önem vermesi ise, belgenin mevsûkiyetini tesbit için yeterli malûmat bulamadığındandır."},{"k":"tbl","r":[["Merhale","Tarihçi","Hadisçi"],["**1. Kaynakların toplanması**","Bütün kaynaklar derlenir; bir kaynağın bütün varyantlarını toplamaya yaygın olarak rastlanmaz","Bir hadisin bütün varyantlarını toplama geleneği çok yaygındır"],["**2. Sıhhatin tesbiti**","Bu tür tenkidlerden geçmiş hazır malzeme bulmak çok zordur","Râviler tek tek güvenilir ve hafızası sağlam, sened kesintisiz olmadıkça kabul edilmez"],["**3. Kaynağın anlaşılması**","Tahlil edilmiş, yorumlanmış vesika elde etme şansı yok gibidir","Garib kelimeler, gramer, isimlerin okunuşu için müstakil ilimler; şerh geleneği"],["**4. Menfî metin tenkidi**","Belgenin mevsûkiyetini tesbit için yeterli malûmat bulamadığından metin tenkidine önem verir","İç tenkid metotlarını gerektiği yerlerde en mükemmel şekilde kullanmışlardır"]]}]},{"h":"Hadiste Metin Tenkidi Tatbikatı","b":[{"k":"p","x":"Hadisçilerin metin tenkidine önem vermedikleri iddiaları temelde iki sebepten kaynaklanmaktadır:"},{"k":"n","n":1,"x":"Hadis tenkid sisteminin sathî bir nazarla incelenmesi"},{"k":"n","n":2,"x":"İslâmî ilimler taksimatının katı sınırlar içerisinde mütâlâa edilmesi"}]},{"h":"Hadisin Metniyle İlgili Sıhhat Şartları","b":[{"k":"p","x":"Bir hadisin sahîh olabilmesi için dört şart aranır:"},{"k":"n","n":1,"x":"Râvîlerin adalet ve zabt sahibi olması"},{"k":"n","n":2,"x":"Senedin muttasıl olması"},{"k":"n","n":3,"x":"Şazz olmaması, yani sika râvîlerin rivâyetlerine muhalif olmaması"},{"k":"n","n":4,"x":"İlletli olmaması"},{"k":"p","x":"Hadis ilk bakışta kusursuz gibi görünürken, sadece hadis mütehassıslarının anlayabileceği gizli kusurlar taşıyabilir. Böyle hadislere muallel (illetli) denir. Bu illetler senedde de olabilir, metinde de. Aynı şekilde şazzlık da hem sened hem metin için söz konusudur. Şu hâlde sahîh hadisin şartlarından ilk ikisi, birinci plânda dış tenkidi ilgilendirirken, son ikisi hadisin şazz ve illetli olmaması kaydıyla iç tenkidi ilgilendirmektedir."},{"k":"d","t":"Muallel (illetli) hadis","x":"İlk bakışta kusursuz gibi görünürken, sadece hadis mütehassıslarının anlayabileceği gizli kusurlar taşıyan hadis. Bu illetler senedde de olabilir, metinde de."},{"k":"tbl","r":[["Sahîh hadisin şartı","Birinci plânda ilgilendirdiği tenkid"],["1. Râvîlerin adalet ve zabt sahibi olması","Dış tenkid"],["2. Senedin muttasıl olması","Dış tenkid"],["3. Şazz olmaması","İç tenkid"],["4. İlletli olmaması","İç tenkid"]]}]},{"h":"Metin Yönünden Hadis Taksimatı","b":[{"k":"p","x":"Hadisçiler hadis çeşitlerinin taksimatını yaparlarken, sened ve metni ayrı ayrı nazarı itibara almışlardır. Hadis çeşitleri metin veya seneddeki bazı özellik ve farklardan ortaya çıkmıştır. Bu taksimatta metin esas alındığında şu hadisler yer alır: Mütevâtir, maklûb, müdrec, musahhaf, nâsih, mensûh, müteşâbih, şazz, mahfuz, münker, muzdarib, muallel..."},{"k":"d","t":"Mütevâtir hadis","x":"Yalan üzerinde birleşmeleri aklen mümkün olmayacak sayıda râvî tarafından nakledilen hadislerdir."},{"k":"d","t":"Maklûb","x":"Sened veya metinde takdim te’hir yapılan hadis."},{"k":"d","t":"Müdrec","x":"Sonradan ilâveler yapılmış hadis."},{"k":"d","t":"Musahhaf","x":"Üzerinde tahrifat yapılmış hadis."},{"k":"p","x":"Bu üç terimde (maklûb, müdrec, musahhaf) cerh ve ta’dîl kriterleri değil, sened veya metin üzerinde yapılan değişiklikler ve bunların tesbiti söz konusudur. Hadisin farklı tariklerinin mukayesesi ile tesbit edilen bu değişikliklerin tesbiti, hadisin orijinal metnini ortaya koymayı hedefleyen bir metin tenkidi ameliyesidir. Sadece bu konularda yazılan eserler dahi muhaddislerin metin tenkidine önem vermedikleri iddiasını redde kâfidir."},{"k":"d","t":"Müteşâbih hadis","x":"Zahirî manasına hamledildiğinde islâm’ın genel esaslarıyla çeliştiği için te’vîl edilen hadislerdir."},{"k":"h","x":"Şazz, Münker, Mahfuz ve Muzdarib"},{"k":"p","x":"Aralarında aykırılık olan hadislerden, her iki tarafın râvîleri de sika olmakla birlikte bir tarafın râvîsi birden çok, karşı taraftaki hadisin râvîsi tek ise; râvîsi birden çok olana mahfuz, râvîsi tek kalan hadise şazz denir. Bu durumda mahfuz hadis tercih edilip, şazz hadis reddedilir. Tek kalan râvî sika değilse, bu râvînin rivâyetine münker denir ve münker rivâyetin reddedileceği açıktır. Aralarında muhalefet olan hadislerden hiçbirini tercih imkânı olmazsa, böyle hadislere muzdarib hadis denir."},{"k":"d","t":"Mahfuz","x":"Aralarında aykırılık olan ve iki tarafın râvîleri de sika olan hadislerden râvîsi birden çok olanı. Tercih edilir."},{"k":"d","t":"Şazz","x":"Aralarında aykırılık olan ve iki tarafın râvîleri de sika olan hadislerden râvîsi tek kalanı. Reddedilir."},{"k":"d","t":"Münker","x":"Tek kalan râvî sika değilse bu râvînin rivâyeti. Reddedileceği açıktır."},{"k":"d","t":"Muzdarib","x":"Aralarında muhalefet olan hadislerden hiçbirini tercih imkânı olmayan hadis."},{"k":"tbl","r":[["Durum","Adı","Hükmü"],["İki taraf da sika; râvîsi birden çok olan","**Mahfuz**","Tercih edilir"],["İki taraf da sika; râvîsi tek kalan","**Şazz**","Reddedilir"],["Tek kalan râvî sika değil","**Münker**","Reddedileceği açıktır"],["Hiçbirini tercih imkânı yok","**Muzdarib**","—"]]}]},{"h":"Muâraza Sistemi","b":[{"k":"d","t":"Muâraza (mukâbele)","x":"Hadisin farklı tariklerinin birbiriyle mukayesesine hadis ilminde muâraza veya mukâbele ismi verilir."},{"k":"p","x":"Hz. Âişe gibi bazı münekkid sahâbilerin de, nakledilen herhangi bir hadisi diğer hadislerle veya Hz. Peygamber’in tatbikatlarıyla mukayese ettikleri bilinmektedir. Fakat yaygın olarak kullanılması tabiûn döneminde başlar."},{"k":"p","x":"Muâraza işlemi değişik şekillerde yapılmıştır:"},{"k":"n","n":1,"x":"Sahâbilerin veya râvîlerin rivâyetlerini birbirleriyle mukayese etmek."},{"k":"n","n":2,"x":"Bir muhaddisin veya râvînin rivâyetlerini değişik zamanlarda yeniden dinlemek suretiyle, önceki rivâyetlerinden farklı olarak rivâyette bulunup bulunmadığını kontrol etmek. Bundan maksad râvînin zabtını kontrol etmektir."},{"k":"n","n":3,"x":"Bir hadis şeyhinin müteaddid talebelerinin rivâyetlerini mukayese ederek yapılan kontrol: Bundan gaye, hem hocanın rivâyetlerini kontrol, hem de talebelerden hata yapan varsa bunu tesbit etmektir."},{"k":"n","n":4,"x":"Bir muhaddisin veya râvînin hadislerini başkalarının rivâyetleriyle mukayese etmek."},{"k":"n","n":5,"x":"Ders esnasında hocaya hadislerinin başkaları tarafından nakledilen farklı rivâyetlerini sorarak bu farklılık konusunda hocanın bilgisini almak."},{"k":"n","n":6,"x":"Kitabın hafızadan veya kitabın kitaptan kontrolü."}]},{"h":"Hadislerin Mevzuluk Alâmetleri","b":[{"k":"p","x":"Hadisçiler, hadis metinlerindeki bazı karinelere bakarak mevzu olduklarına hükmedilebileceğini ifade etmişlerdir. Mesela **İbn Salâh** (643/1245) “Hadisin mevzu olduğu râvî ve mervîdeki (hadis metnindeki) birtakım karinelerle bilinebilir. Birçok uzun hadis vardır ki, lafızlarında ve manalarındaki bozukluklar mevzu olduklarına delâlet eder” der."},{"k":"p","x":"**İbnu’l-Kayyim**, aşağıdaki özellikleri taşıyan hadislerin mevzu olacağını belirtmiştir:"},{"k":"n","n":1,"x":"Rasûlullah’ın (s) söylemesi mümkün olmayan mantıksız ifadeler taşıması: “Kim ‘lâ ilahe illallah’ derse, Allah bu kelimeden 70 bin dili olan bir kuş yaratır...” şeklindeki rivâyet gibi."},{"k":"n","n":2,"x":"Rivâyetin tecrübe ve müşâhedeye aykırılığı: “Patlıcan ne için yenirse ona fayda verir.” gibi."},{"k":"n","n":3,"x":"İfadelerinin çirkin veya gülünç olması"},{"k":"n","n":4,"x":"Sarîh sünnete aykırılığı"},{"k":"n","n":5,"x":"Rasûlullah’ın (s) pek çok kişinin huzurunda yapmış olduğu bir şeyin bir kişi tarafından nakledilmesi"},{"k":"n","n":6,"x":"Hadisin, bizatihi bâtıl olması"},{"k":"n","n":7,"x":"Bir peygamber kelâmına benzememesi."},{"k":"n","n":8,"x":"Tabiblerin veya mutasavvıfların ifade tarzlarına benzemesi: “Balık yeme vücudu zayıflatır.” gibi."},{"k":"n","n":9,"x":"Kur’ân’ın sarih hükümlerine aykırı olması."},{"k":"n","n":10,"x":"Hadisin manasında veya lafzında bozukluk olması."}]}],"ht":[{"s":0,"x":"Metin tenkidi ıstılahı hadis ilminde son dönemlerde ortaya çıkmıştır; klasik dönemde muâraza, ihtilâf, teâruz, işkâl gibi terimler kullanılmıştır."},{"s":0,"x":"Tarihçilikte iki tenkid: dış tenkid (kaynak kritiği) ve iç tenkid (muhtevânın tenkidi; olumlu ve olumsuz)."},{"s":0,"x":"Hadisteki isnâd ve rical tenkidi, tarihteki negatif iç tenkide tekabül eder."},{"s":1,"x":"Hadisçilerin metin tenkidi yapmadığını ileri sürenler: Caetani, İbn Haldun (şikâyet), Zakir Kâdirî Ugan."},{"s":2,"x":"Hadis ilmi tenkid süzgecinden geçmiş malzemeyle birlikte tenkid için gerekli verileri de ulaştırmıştır; tarih ilmi bu verilerden mahrumdur."},{"s":2,"x":"Tenkid merhaleleri: 1. kaynakların toplanması · 2. sıhhatin tesbiti · 3. kaynağın anlaşılması · 4. menfî metin tenkidi."},{"s":2,"x":"Tarihçinin metin tenkidine önem vermesi, belgenin mevsûkiyetini tesbit için yeterli malûmat bulamamasındandır."},{"s":3,"x":"Metin tenkidi yapılmadığı iddiasının iki sebebi: hadis tenkid sistemine sathî bakış ve İslâmî ilimler taksimatını katı sınırlarla mütâlâa etmek."},{"s":4,"x":"Sahîh hadisin dört şartı: râvîlerin adalet ve zabtı, senedin ittisali, şazz olmaması, illetli olmaması."},{"s":4,"x":"İlk iki şart birinci plânda dış tenkidi; şazz ve illetli olmama şartları iç tenkidi ilgilendirir."},{"s":5,"x":"Maklûb: takdim te’hir · müdrec: sonradan ilâve · musahhaf: tahrifat. Bu üçünde cerh-ta’dîl değil, metindeki değişikliğin tesbiti söz konusudur."},{"s":5,"x":"Müteşâbih: zahirî manası İslâm’ın genel esaslarıyla çeliştiği için te’vîl edilen hadis."},{"s":5,"x":"Sika râviler arasında: çok râvîli mahfuz (tercih), tek râvîli şazz (red); tek râvî sika değilse münker; tercih imkânı yoksa muzdarib."},{"s":6,"x":"Muâraza (mukâbele): hadisin farklı tariklerini birbiriyle mukayese etmek; Hz. Âişe gibi münekkid sahâbîlerde görülür, yaygınlaşması tabiûn döneminde."},{"s":6,"x":"Muârazanın altı şekli: sahâbî/râvî rivâyetlerini karşılaştırma, râviyi değişik zamanlarda yeniden dinleme (zabt kontrolü), şeyhin talebelerini karşılaştırma, başkalarının rivâyetleriyle karşılaştırma, hocaya farklı rivâyetleri sorma, kitabın hafızadan ya da kitaptan kontrolü."},{"s":7,"x":"İbn Salâh: hadisin mevzu olduğu râvî ve mervîdeki (metindeki) karinelerle bilinebilir."},{"s":7,"x":"İbnu’l-Kayyim’e göre mevzuluk alâmetlerinden bazıları: mantıksız ifade, tecrübe ve müşâhedeye aykırılık, çirkin/gülünç ifade, sarîh sünnete ve Kur’ân’a aykırılık, peygamber kelâmına benzememe, tabib ve mutasavvıf üslûbu."}]},{"t":"Metin Tenkidi Ölçütleri","intro":"Tearuz sebebiyle metin tenkidi: Kur’ân’a, başka hadislere, icmâa, dinin genel esaslarına, kıyasa, akla, müşâhede ve ilme, tarihî gerçeklere aykırı hadisler; umûm-u belvâ, râvinin kendi rivâyetine tutumu, üslûp incelemesi ve metin tenkidi muhalifleri.","s":[{"h":"5. Tearuz (Çatışma, Aykırılık) Sebebiyle Metin Tenkidi","b":[{"k":"d","t":"Tearuz","x":"İki şer’î delilin muktezasının birbiriyle çelişmesidir."},{"k":"p","x":"Cumhur; cem’, tercih, nesh gibi herhangi bir usûlle çözümlenmesi mümkün olan çelişkilere de teâruz ismi verirken, bazı âlimler sadece giderilmesi imkânsız çelişkileri teâruz sayarlar."},{"k":"p","x":"Şer’î deliller arasında hakîkî (çözümlenmesi imkânsız) teâruz bulunup bulunmadığı konusunda üç görüş vardır:"},{"k":"n","n":1,"x":"Naklî olsun, aklî olsun dinî deliller arasında gerçek çatışma yoktur. Görülen çatışmalar zahiridir;"},{"k":"n","n":2,"x":"Adı geçen deliller arasında teâruz bulunabilir;"},{"k":"n","n":3,"x":"Kat’î deliller arasında teâruz olmaz, zannî deliller arasında olabilir."},{"k":"p","x":"Âlimlerin çoğunluğu birinci görüşü benimserler."},{"k":"h","x":"Hanefîlerde iç inkıtâ ve dış inkıtâ"},{"k":"p","x":"Hanefî usûlcüler, adı geçen kriterlerle çatışan hadislerdeki kusuru seneddeki ınkıtâ’a benzeterek, iç inkıta’: inkıta’u’l-bâtın ismini vermişlerdir. Seneddeki kesikliğe ise dış ınkıta’ derler."},{"k":"d","t":"İç inkıtâ (inkıtâu’l-bâtın)","x":"Hanefî usûlcülerin, tenkid kriterleriyle çatışan hadislerdeki kusuru seneddeki ınkıtâ’a benzeterek verdikleri isim."},{"k":"d","t":"Dış inkıtâ","x":"Hanefîlerde seneddeki kesiklik."},{"k":"p","x":"Bu terimlerin, iç ve dış tenkid terimlerine son derece benzemesi dikkat çekicidir. Hanefîler iç inkıtâ’ı ikiye ayırırlar:"},{"k":"n","n":1,"x":"Râvîdeki kusurlar;"},{"k":"n","n":2,"x":"Hadisin dinî asıllara muarız olması. Bu da dört türlü olur:"},{"k":"li","x":"a) Hadisin Kur’ân’a muarız olması;"},{"k":"li","x":"b) Hadisin ma’rûf sünnete muarız olması;"},{"k":"li","x":"c) Umûm-u belvâ’daki bir hadisin şazz olarak nakledilmesi (yani çok geniş kitleleri ilgilendiren bir konuda sadece tek rivâyetin bulunması.)"},{"k":"li","x":"d) Hadisin ihtiva ettiği hüküm konusunda sahabe arasında da ihtilâf çıkmış olmasına rağmen, hadisi delili olarak kullanmamış olmaları."},{"k":"tbl","r":[["Hanefîlerde","İçeriği"],["**Dış inkıtâ**","Seneddeki kesiklik"],["**İç inkıtâ: 1**","Râvîdeki kusurlar"],["**İç inkıtâ: 2**","Hadisin dinî asıllara muarız olması: Kur’ân’a; ma’rûf sünnete; umûm-u belvâda şazz nakil; sahabenin ihtilâf ettiği konuda hadisi delil olarak kullanmamış olması"]]}]},{"h":"a) Kur’ân’ın Sarih Hükümlerine Muhalif Hadisler ve Hadisin Kur’ân’a Arzı","b":[{"k":"p","x":"Hadisin Kur’ân’la münâsebetinin şu üç şekilde olduğu âlimler arasında genellikle kabul görür."},{"k":"n","n":1,"x":"Kur’ân’da nass bulunan konularda hadis o nassı destekler."},{"k":"n","n":2,"x":"Kur’ân’da mücmel olarak belirtilen hususları açıklar (tebyîn)."},{"k":"n","n":3,"x":"Kur’ân’da bulunmayan konularda müstakil hüküm koyar."},{"k":"p","x":"Sünnetin ilk iki görevi konusunda âlimler arasında ihtilâf yoktur. Üçüncü görevine ve dolayısıyla teşrî gücünün nereden kaynaklandığına dair ise değişik görüşler mevcuttur."},{"k":"p","x":"Sünnetin müstakil teşrî kaynağı olması şu delillerden birine dayandırılır:"},{"k":"li","x":"a) Kur’ân’da Rasûlullah’a itaatin farz kılınmış olması;"},{"k":"li","x":"b) Sünnetin koyduğu hükümlerin aslının Kur’ân’da mevcut olması;"},{"k":"li","x":"c) Hz. Peygamber’in Allah’ın Elçisi oluşu;"},{"k":"li","x":"d) Bütün sünnetlerin Hz. Peygamber’in (s) kalbine Allah tarafından ilkâ edilmesi."},{"k":"p","x":"Bunlardan hangisi kabul edilirse edilsin, genel olarak Rasûlullah’ın (s) sünnetine uymanın farz olması gerçeği değişmeyecektir."},{"k":"p","x":"Hadisler Kur’ân’a gerçek manada muarız olmayacağına göre dışardan teâruz var görünüyorsa yapılacak iki şey vardır:"},{"k":"n","n":1,"x":"Tearuzu gidermek;"},{"k":"n","n":2,"x":"Bu mümkün olmuyorsa hadisi reddetmek."},{"k":"p","x":"Tearuz giderilebiliyorsa zaten ortada gerçek çatışma yok demektir. Bu mümkün olmuyorsa, Kur’ân nassı daha kuvvetli ve kat’î olduğundan hadis reddedilecektir. Sünnetin Kur’ân’ın tefsiri olması hasebiyle sünnetin takdim edileceğini savunanlar da mevcuttur. **Cüveynî** (478/1085) bunlardandır."},{"k":"p","x":"Bu noktada sünnetin Kur’ân’ı nesh edip edemeyeceği konusu önem kazanır. Çünkü neshten söz edebilmek için teâruzun gerçek anlamda bulunması lâzımdır. Hanefîler “Haber-i vâhid Kur’ân’ı nesh edemez” derken, aksi görüşte olanlar da mevcuttur."},{"k":"p","x":"Aslında teâruzu giderme usûlleri de tarih ilminin ölçülerine göre metin tenkidi sayılmaktadır."},{"k":"dikkat","x":"Sünneti Kur’ân’a arz, çok hassas ve kritik bir konudur. Hataya müsaittir. Bu yüzden arz metoduna başvururken aşağıdaki hususlara dikkat etmek gerekecektir."},{"k":"p","x":"Arzda Kur’ân’ın tek bir ayeti değil, bütünü nazarı itibara alınmalıdır. Aynı husus hadis için de geçerlidir. Bu, ihâtalı bir Kur’ân ve hadis bilgisini gerektirir. Aksi halde hata ihtimali çok fazladır. Her iki tarafın bütünlük mantığı içerisinde, çatışmanın mevcut olup olmadığına bakılmalıdır. Ayrıca hem Kur’ân hem de hadislerdeki tedricî teşrî prensibine çok dikkat edilmelidir."}]},{"h":"b) Hadisler Arası Tearuz Sebebiyle Metin Tenkidi","b":[{"k":"p","x":"Mütevâtir hadislerin sayısı çok az olmakla birlikte, bunlara muhâlif haber-i vâhidin reddedileceği genelde kabul edilir."},{"k":"p","x":"Müteârız hadisler arasındaki tercih sebepleri dört grup altında toplanabilir:"},{"k":"n","n":1,"x":"**Râvî ile alâkalı tercih sebepleri:** Hadislerden birinin râvîsinin şahsî özellikleri yani yaş, ilim, hafıza, fazilet, adalet gibi yönlerden daha üstün olması halinde o hadis tercih edilir."},{"k":"n","n":2,"x":"**Hadis metni ile ilgili tercih sebepleri:** Lâfızların delâletleri açısından tercih. Mesela muhkem müfessere, işaret nassa, nass zahire, hakikat mecâza, hâss âmma tercih edilir."},{"k":"n","n":3,"x":"**Hüküm yönünden tercih:** Haramlık ifade edenin, diğer şer’î hükümleri ifade edenlere; daha ihtiyatlı olanın, böyle olmayana; kolayın zora, müsbetin menfîye tercihi gibi."},{"k":"n","n":4,"x":"**Hâricî sebeplerle tercih:** Sahâbe fetvâları, âlimlerin görüşleri, Kur’ân, sünnet, kıyâs vs. ile desteklenen hadislerin, böyle olmayanlara tercihi gibi."},{"k":"p","x":"**Cüzekânî** (543/1148), sıhhati kat’î olan hadislere aykırı olan hadislerin bâtıl olduğunu söyler."},{"k":"p","x":"Özellikle Hanefîler, meşhur sünnete muhalif olan hadislerin reddedileceği görüşündedirler. Mütevâtir, müstefîz ve üzerinde icma edilmiş olan sünnetin sübûtunun kat’î olmasından dolayı, Kur’ân’ı neshetmesi ve Kur’ân’a ziyade hüküm getirmesi caizdir. Ayrıca böyle bir sünnete aykırı olan haber-i vahidin reddedileceği gayet tabiîdir. Hanefîler bu yüzden bir şahid ve bir yeminle hüküm vermenin cevazını ifade eden hadisi “Delil davacıya, yemin dâvâlıyadır” meşhur hadisine aykırı bulduklarından dolayı kabul etmezler."},{"k":"p","x":"Mütevâtir hadisin, meşhûr ve âhâda tercihinde bütün âlimler müttefiktirler. Hanefîler meşhûru âhâda tercih ederken, cumhur bu ikisi arasında fark gözetmezler."},{"k":"p","x":"**İbnu’l-Kayyim**, bütün bu gerekçelerle sünnetin reddedilmesine karşı çıkar ve “Hadis mensuh değilse, sahîh olduğu sürece muhâlefet edenler veya amel etmeyenlere itibar edilmeden hadisle amel etmek gerekir” der. Daha sonra Ahmed b. Hanbel’in de aynı görüşte olduğunu, uygulamalarından örnekler vererek gösterir."},{"k":"tbl","r":[["Tercih grubu","Örnek"],["**Râvî ile alâkalı**","Yaş, ilim, hafıza, fazilet, adalet yönünden üstün râvînin hadisi"],["**Hadis metni ile ilgili**","Muhkem müfessere, işaret nassa, nass zahire, hakikat mecâza, hâss âmma"],["**Hüküm yönünden**","Haramlık ifade eden, daha ihtiyatlı olan, kolay olan, müsbet olan"],["**Hâricî sebeplerle**","Sahâbe fetvâları, âlimlerin görüşleri, Kur’ân, sünnet, kıyâs ile desteklenen"]]}]},{"h":"c) İcmâ’a Aykırı Hadisler","b":[{"k":"p","x":"Bir hadisin hükmü ile icmâ’ın çatışması iki ihtimali düşündürür:"},{"k":"n","n":1,"x":"Hadisin sahîh olmaması;"},{"k":"n","n":2,"x":"İcmâ’ın o hadisi nesheden başka bir hadise dayanması."},{"k":"p","x":"İcmâ’ın sünneti nesh edemeyeceğine göre ancak bu iki ihtimal düşünülebilir. Şu hâlde her iki durumda da hadisin reddedilmesi gerekecektir."},{"k":"p","x":"**Şâfiî**, Risâle’sinin müteaddit yerlerinde, “Ümmetin sünnete zıt bir icma’da birleşmelerinin mümkün olmadığını; böyle bir sünnete kesinlikle rastlamadığını, bir sünnetin bütün ümmet tarafından bilinmemesinin mümkün olmadığını” belirtir."},{"k":"p","x":"**Hatîb Bağdâdî** de kabul edilmeyecek haberleri sayarken, “Haberin Kur’ân nasslarına, mütevâtir sünnete aykırı olması veya ümmetin reddinde ittifak etmiş olmalarıdır” demektedir."},{"k":"p","x":"**İbn Kuteybe**, icmâ’ ile çatışma halinde hadisin reddedileceğini, icmâ’ın hadisten daha kuvvetli olduğu gerekçesine bağlar ve bunu şöyle açıklar: “Muhakkak ki bizim nazarımızda hak ve hakikat icmâ’ yoluyla, rivâyetten daha kuvvetli olarak sabit olur. Çünkü hadislere bazan unutma, gaflet, şüphe, te’vîl, nesh gibi hususlar ârız olur. Veya râvî sika olur, hadisi aldığı kişi sika olmaz. Bazan Rasûlullah (s) bir şeyi emrederken hazır bulunan biri, aynı şeyin aksini emrettiğini duymamış olabilir. İcmâ’ bütün bu ârızalardan uzaktır. Bu sebeple imam Mâlik, Rasûlullah’tan (s) bir hadis rivâyet eder, sonra da Medine’deki bu hadise aykırı tatbikatı vurgulamak için ‘Beldemizde ise şu şekilde amel edilmektedir’ derdi. Çünkü onun beldesi Rasûlullah’ın beldesidir...”"},{"k":"h","x":"İbn Kuteybe’nin örnekleri"},{"k":"p","x":"İbn Kuteybe bu kabil hadisler için şu örnekleri vermektedir:"},{"k":"n","n":1,"x":"Rasûlullah (s) Medine’de öğle ikindi, akşam, yatsı namazlarını korku hali olmadığı halde cem’ etmişlerdir."},{"k":"n","n":2,"x":"Rasûlullah (s) zamanında adamın birisi, âzâdlı kölesinden başka varis bırakmadan ölmüş; Hz. Peygamber, adamın mirasını köleye vermiştir."},{"k":"n","n":3,"x":"Berâ naklediyor: “Hz. Peygamber, sabah ve akşam namazlarında kunut okurdu.” Bu hadise rağmen fukahâ akşam namazında kunut okunmayacağında ittifak etmişlerdir."},{"k":"n","n":4,"x":"“Rasûlullah (s) abdest aldı, sarığına meshetti ve sabah namazını kıldı.” Bu hadis üç farklı senedle nakledilmiştir. Halbuki âlimler sarık üzerine meshi kabul etmezler."},{"k":"n","n":5,"x":"“Kim kölesini öldürürse biz de onu öldürürüz” hadisine rağmen, âlimler kölesini öldürene kısas tatbik edilmeyeceğinde ittifak etmişlerdir."},{"k":"p","x":"**Hâkim** (405/1014) de Müstedrek’inde, kabrin üzerine türbe yapılması, kireçle sıvanması ve taş dikilmesini yasaklayan hadislerle ümmetin amel etmediğini belirtir."},{"k":"p","x":"Başta Hanefîler olmak üzere bazı usûlcüler, sahabenin veya hadis imamlarının reddetmiş olmasının, hadisi mevsûkiyetten düşüren bir kusur olduğunu belirtirler. Hanefîlere göre, sahabe bir konuda ihtilâf etmiş, o konuda bir hadis mevcut olduğu halde hiçbirisi hadisle amel etmemişse artık o hadisle amel edilemez. Şayet hadis sahîh olsaydı ya hepsi amel eder ihtilâf çıkmazdı veya bir taraf amel ederdi, derler. İmam Şâfiî de “Bütün insanların muhalefet ettikleri bir sünnet yoktur” demek suretiyle, sahîh bir sünnetin terkinde icmâ’ edilmeyeceğini vurgular."}]},{"h":"d) Dinin Genel ve Kesin Esaslarına Aykırı Hadisler","b":[{"k":"p","x":"Dinin genel esasları denince akla ilk olarak iman esasları gelir. İman esaslarına aykırı hadislerin kabul edilmeyeceği aşikârdır. Mesela: “Allah atı yarattı. Onu koşturup terletti, sonra da onun terinden kendisini yarattı” şeklindeki rivâyeti **İbnu’l-Cevzî** (597/1200) şöyle tenkid ediyor: “Biz, muhaddislerin âdetine uyarak bu hadisi kimin uydurduğunu göstermek için râvîlerini tesbit ettik. Yoksa böyle bir hadisin râvîlerini araştırmaya ne gerek var. Çünkü muhaldir. Sika râvîler, devenin iğne deliğinden geçtiğini haber verseler, sikalarının ne ehemmiyeti kalır. Sen bir hadisi akla ve din prensiplerine aykırı bulursan anla ki o hadis uydurmadır.”"},{"k":"h","x":"Nass ile maslahatın teâruzu"},{"k":"p","x":"Nass, maslahatla teâruz edince ne yapılacağı konusunda **Süleyman b. Abdu’l-Kavî et-Tûfî** (716/1336)’nin görüşü, maslahatın tercih edileceği şeklindedir. Böyle bir mutlak tercih onun dışında başka bir âlimden nakledilmiyor."},{"k":"p","x":"Cumhûrun görüşü ise şöyledir: Nass ve icmâ kat’î ise, kesinlikle nass ve icmâ tercih edilir. Nass ve icmâ’ zannî ise, Hâricî bir tercih unsuruna göre tercih yapılır. Nass ve icmâ’ zannî ise, maslahatın cinsine göre durum değişir. Maslahat mülğâ ise nass ve icmâ’ tercih edilir. Maslahat muteber ise bakılır: Maslahatın gözetileceğini ifade eden nass zannî ise Hâricî bir tercih unsuruna göre tercih yapılır. Nass veya muteber maslahattan biri kuvvetli ise, kuvvetli olan tercih edilir. Maslahat mürsele ise, yani mülğa veya muteber olduğuna delil yoksa bu konuda âlimler ihtilâf etmişlerdir: Şâfiî’ye göre böyle maslahat delil olmaz. Mâlik ve İmam Ahmed’e göre bu maslahatla amel edilir. Şu hâlde Şâfiî’ye göre el-mesâlihu’l-mürsele zannî nassa teâruz edemez. Çünkü delil değildir. El-Mesâlihu’l-mürseleyi delil sayanlara göre ise, zannî nassla teâruzu halinde daha kuvvetli olan tercih edilir."},{"k":"tbl","r":[["Durum","Cumhura göre"],["Nass ve icmâ kat’î","Kesinlikle nass ve icmâ tercih edilir"],["Maslahat mülğâ","Nass ve icmâ tercih edilir"],["Maslahat muteber","Maslahatı gözeten nass zannî ise hâricî bir unsura göre; biri kuvvetli ise kuvvetli olan tercih edilir"],["Maslahat mürsele","Şâfiî: delil olmaz, zannî nassa teâruz edemez · Mâlik ve Ahmed: amel edilir, kuvvetli olan tercih edilir"]]},{"k":"dikkat","x":"Dinî asıllara aykırı görülen bir hadisi redde girişmeden önce, aykırılığın hakikaten mevcut olup olmadığını iyi tesbit etmek gerekir. Diğer bir ifade ile, aykırı görülen bu durumun uzlaştırılmasının mümkün olup olmadığına dikkat edilmelidir."},{"k":"p","x":"Nitekim bazılarınca dinî asıllara aykırı görülen birtakım hadisler, başkaları tarafından te’vîl edilmiştir. Bunların bir kısmına yukarıdaki hadislerden bahsederken temas ettik. Bu meyanda İbnu’l-Kayyim, asıllara aykırı diye reddedilen pek çok hadiste böyle bir aykırılığın söz konusu olmadığını ortaya koymaya çalışmış ve İ’lâmu’l-Muvakkı’în isimli eserinde bu konuya tam seksen sayfa yer ayırmıştır."}]},{"h":"e) Kıyâsa Aykırı Hadisler","b":[{"k":"p","x":"Fıkıhtaki genel kanaate göre kıyâs, hakkında nass olmayan konularda yapılır ve deliller hiyerarşisinde hadis ve icmâ’dan sonra gelir."},{"k":"d","t":"Kıyâs","x":"Fıkıh usûlünde, hakkında nass bulunmayan bir meselenin hükmünü, aralarındaki ortak illet dolayısıyla, hakkında nass bulunan meselenin hükmüne bağlamaktır."},{"k":"p","x":"Hadisin kıyâsla çatışması demek, o konuda hadis var demektir ve bu takdirde zaten kıyâs yapılmaması gerekir. Hadis sahîh olduğunda durum böyledir. Hadis sahîh değilse, zaten kıyâsa teâruz edemez. Şu hâlde kıyâsla sahîh hadis çatıştığında hadisin tercih edilmesinden başka bir şey düşünülemez. Bütün mezheb imamları da hadis bulunduğunda rey ile verdikleri hükümlere itibar edilmemesini istemişlerdir. O halde hadise teâruz edebilecek kıyâstan maksad başka bir şey olmalıdır."},{"k":"p","x":"**Ebû Zehra** bu probleme şöyle açıklık getiriyor: “Cumhurun mezhebine göre, bazan kıyâs nassla çatışabilir. Şöyle ki: İllet geçişli (müteaddî) olup ait bulunduğu konuya inhisar etmez. Diğer konular için de geçerli olur. İlletin bulunduğu her yerde, aslın hükmü fer’a geçer. Böylece illet genel olup kapsadığı bütün fertlere şâmil olur. Dolayısıyla bir kısım nasslar bu kıyâsla çatışabilir.”"},{"k":"p","x":"Başka bir yerde de şöyle der: “Haber-i âhâd bazan birkaç asl ile desteklenen ve illeti de kolaylığı sağlama, güçlüğü giderme gibi, nassların toplamından elde edilen bir kıyâs ile çatışabilir. Bu durumda Mâlikî ve bazı Hanbelîlere göre, kıyâs öne alınarak haber-i âhâd reddedilir ve bu, hadisin Hz. Peygamber’e nisbet bakımından sahîh olmadığını gösterir. Çünkü burada birkaç asl ile desteklenen ve illeti birkaç nasstan çıkarılan kıyâs kat’îlik kazanmış olup, haber-i âhâd ise zannîdir. Eğer kıyâs zannî ise ve onu başka kat’î nasslar desteklemiyorsa, haber-i âhâd öne alınır. Hanefîler de ‘Haber-i âhâd kıyâsa aykırı düşer, fakat onu başka bir kıyâs desteklerse kıyâsa tercih edilir. Eğer haber-i âhâd bütün kıyâs şekillerine aykırı düşerse reddedilir’ derler. İmam Mâlik de haberi âhâd diğer bir kâide ile desteklenirse kabul eder, tek kalırsa terk eder.”"},{"k":"p","x":"Ebû Zehra’nın bu ifadelerinden anlaşıldığına göre, burada kıyâs dendiğinde Kur’ân ve sünnetten çıkarılan genel kaideler anlaşılacaktır."},{"k":"tbl","r":[["Mezhep","Haber-i âhâd kıyâsla çatışınca"],["**Mâlikî ve bazı Hanbelîler**","Birkaç asl ile desteklenen (kat’îlik kazanmış) kıyâs öne alınır, haber-i âhâd reddedilir; kıyâs zannî ise haber-i âhâd öne alınır"],["**Hanefîler**","Haber-i âhâdı başka bir kıyâs desteklerse kıyâsa tercih edilir; bütün kıyâs şekillerine aykırı düşerse reddedilir"],["**İmam Mâlik**","Haber-i âhâd diğer bir kâide ile desteklenirse kabul edilir, tek kalırsa terk edilir"]]}]},{"h":"f) Akla Aykırı Hadisler","b":[{"k":"p","x":"**Berzencî**, usûlcü ve kelâmcıların çoğunluğunun; hadisçilerin, Mu’tezile’nin ve Hanefîlerin akıl ile naklin çatışabileceğini kabul ettiklerini belirtir. Buna delil olarak çatışmayı çözme konusuyla uğraşmış olmalarını gösterir."},{"k":"p","x":"**İbn Teymiyye** (728/1327) ve **Şâtıbî** gibi âlimler aksi görüştedirler. İbn Teymiyye; aklî olsun, sem’î olsun katî iki delilin çatışmasının mümkün olmayacağı görüşünü benimser."},{"k":"h","x":"Şâtıbî’nin delilleri"},{"k":"p","x":"Şâtıbî dinî delillerin aklî hükümlere münafî olmayacağını şöyle delillendirir:"},{"k":"n","n":1,"x":"Şer’î delilleri akıl sahibi olan herkes kabul etmiştir."},{"k":"n","n":2,"x":"Şer’î deliller akla aykırı olsaydı bu, teklîf-i mâ lâ yutak olurdu. Çünkü akıl sahibi insanı, akla aykırı şeyi kabulle yükümlü tutmak, teklîf-i mâ lâ yutâktır. Allah, insanları böyle bir şeyle mükellef tutmaz."},{"k":"n","n":3,"x":"Akıllı kişi mükelleftir, akılsız ise mükellef değildir. Halbuki akla aykırı şer’î delille akılsızı mükellef tutmakta zorluk yoktur. Ama böyle bir delille akıllıyı mükellef tutmakta meşakkat vardır."},{"k":"n","n":4,"x":"Şer’î deliller akla aykırı olsaydı, bunu ilk defa Hz. Peygamber (s) zamanındaki kâfirler inkâr ederdi. Kâfirler Rasûlullah’ın (s) sihirbaz, mecnûn vs. olduğunu söylemişler; fakat getirdiği hükümlerin akla aykırı olduğunu iddia etmemişlerdir."},{"k":"h","x":"Akla aykırı hadisler karşısında ne yapılır"},{"k":"li","x":"Hadislerin bir kısmı âhiret hayatı gibi aklın idrâk edemiyeceği gaybî konulara dairdir. Bu çeşit konularda akıl ve hadisin çatışması mevzubahis olamaz. Hadislerin diğer bir kısmı ise bütün alternatiflerde akla aykırılığı söz konusu olmayacak şekildedir. Hz. Peygamber’in hayat tarzına ve ibadet esaslarına dair hadisler böyledir."},{"k":"li","x":"Akla aykırı gelen hadis mütevâtir ise te’vîl edilmesi gerekir. Hadis âhâd ise yine te’vîl imkânları araştırılır. Te’vîl mümkün değilse haber terk edilir."},{"k":"p","x":"Akla aykırılıkları sebebiyle reddedilen hadislere şu örnekler verilebilir:"},{"k":"n","n":1,"x":"“Allah önce atı yaratmış, sonra onun terinden kendini yaratmıştır.”"},{"k":"n","n":2,"x":"“Nuh’un gemisi Kâ’be’yi yedi defa tavaf edip, Makâm-ı İbrâhîm’in arkasında iki rekât namaz kılmıştır.”"},{"k":"not","x":"Sem’î delillerle teâruzu söz konusu olan akıl, akl-ı selimdir. Değişik sebeplerle insan, aklını yanlış kullanabilir."},{"k":"p","x":"Akla aykırı görülen hadisler ilk planda reddedilme yerine, bir tefsîr veya te’vîli olabileceği ihtimali düşünülmelidir. Nitekim akla (nazar) aykırı olduğu iddia edilen hadislerden pek çoğunu İbn Kuteybe te’vîl etmiş ve akla aykırı olmadıklarını göstermeye çalışmıştır."},{"k":"p","x":"Ayrıca aklın idrâk alanı dışındaki hadisleri akıl kriterine vurmaktan kaçınmak gerekir. Gaybî konulardaki hadisler böyledir. Öte yandan hadisler mecâz, kinâye, işaret, remiz gibi zâhirî manası dışında bir mana ifade edebilirler. Yahut müteşâbih olabilirler."}]},{"h":"g) Müşâhedeye, Tecrübeye ve İlme Aykırı Hadisler","b":[{"k":"p","x":"Müşâhededen maksad, insanların duyu organlarıyla edindikleri bilgilerdir. İslâm düşüncesine göre, sağlam duyu organları bilgi (ilim) vasıtalarındandır. Bir hadis duyularımızla elde ettiğimiz bilgilere aykırı düşüyorsa ne yapılacaktır? Böyle hadislerin de reddedilmesi gerektiği genellikle kabul edilmiştir. Fakat bu noktada duyuların yanılmasının mümkün olduğunu da gözden uzak tutmamak gerekecektir."},{"k":"ornek","x":"Buna birkaç örnek vermek gerekirse: “İnsanların en yalancıları boyacılar ve kuyumculardır.” Halbuki biz bu iki zümre içerisinde çok dürüst kimseler olduğuna şâhid olmaktayız. Diğer bir hadiste “Patlıcan her derde devadır” denilir. Patlıcanın böyle bir özelliğine şâhid olmuyoruz. “Kişi konuşurken aksırsa, bu onun doğru söylediğini gösterir” şeklindeki hadis de böyledir."},{"k":"p","x":"İlim ve tecrübeyi birlikte mütâlâa edebiliriz. Çünkü tecrübeler en önemli ilim aracıdır. Özellikle son yıllarda, ilmî gerçek olarak kabul edilen hususlara aykırı hadislerin reddedilmesi gereği de savunula gelmektedir. İslâmiyet ilmî araştırmaları, tefekkürü ısrarla emreder. Bunu göz önüne alınca hadislerin ilim kriterine vurulması genelde çok isabetli görülür."}]},{"h":"h) Tarihî Gerçeklere Aykırı Hadisler","b":[{"k":"p","x":"Eğer hadis, kesin olarak bilinen tarihî gerçeklere aykırı ise uydurma olduğuna hükmedilir."},{"k":"ornek","x":"Hz. Peygamber’den (s) şöyle bir hadis nakledilir: “Gözümdeki hastalıktan (ramed) Cibril’e şikâyetlendim. Mushafa bakmamı tavsiye etti.” İbnu’l-Cevzî bu hadisi “Hz. Peygamber devrinde mushaf mı vardı ki baksın?” diye tenkid etmektedir."},{"k":"ornek","x":"Başka bir rivâyete göre Hz. Âişe, Peygamberimize, niçin sık sık Hz. Fâtıma’nın boynunu öptüğünü sormuş; “Mi’râcda Cibril bana çok hoş kokulu bir cennet meyvesi ikram etti. Onu yedim. Hatice, Fâtıma’ya o esnada hâmile kaldı. İşte o meyvenin kokusunu özledikçe Fâtıma’nın boynunu öpüyorum” demiştir. Bu hadis tarihî gerçeklere şu yönlerden aykırıdır: Hz. Fâtıma peygamberliğin gelmesinden beş yıl önce doğmuş, mi’râc ise hicretten bir yıl önce vuku bulmuştur. Öte yandan mi’râc esnasında Hz. Hatice vefat etmişti. Bu habere göre, Hz. Fâtıma’nın Peygamberimizin vefatında on veya on bir yaşında olması gerekir. Halbuki Peygamberimizin irtihalinde onun daha yaşlı olduğu bilinmektedir."}]},{"h":"6. Çok Sayıda Kişinin Bilmesi Gereken Konularda (Umûm-u Belvâ) Tek Kişinin Rivâyette Bulunması","b":[{"k":"p","x":"Herkesi ilgilendiren konulardaki haberlerin bir iki kişiye münhasır kalmayıp geniş kitleler tarafından bilinmesi esastır. Bunun aksi, haberin uydurma olduğunu gösterir. Tarih ilminde de diğer kaynakların habersiz olmamaları icab eden büyük hadiseler hakkında tek kaynağın verdiği habere şüphe ile bakılır."},{"k":"d","t":"Umûm-u belvâ","x":"Çok sayıda kişinin bilmesi gereken, herkesi ilgilendiren konular. Böyle bir konuda tek kişinin rivâyette bulunması haberin uydurma olduğunu gösterir."},{"k":"p","x":"Bazı hadisçiler ve Hanefîler bu ölçüye uymayan hadislerin makbul olmadığı görüşündedirler."},{"k":"p","x":"**Hatîb Bağdâdî**, bir haberin doğru olmadığını gösteren ölçüleri sıralarken şöyle der: “Bir ülke ahalisinin devlet reisine toptan isyanı, hacıların muhasara edilip Kâ’be’ye sokulmamaları gibi büyük ve önemli bir olayı (bir kişiden başka) nakleden yoksa bu habere güvenilmez. Çünkü böyle haberlerin yaygınlaşması âdettir.”"},{"k":"p","x":"Bütün bu konular büyük kitleleri ilgilendirmektedir. Hanefîler bu tür rivâyetleri kabul etmemelerinin sebebini şöyle açıklıyorlar: “Herkesi ilgilendiren dinî bir hükmün Hz. Peygamber (s) tarafından, diğer müslümanların muttali olamayacakları şekilde sadece bir kişiye bildirilmesi mümkün değildir. Aynı şekilde böyle bir hükmü müslümanların diğer müslümanlardan gizlemiş olmaları da düşünülemez. Özellikle sahâbenin, hadisleri yaymak hususundaki gayretleri herkesçe malûmdur. Böyle bir konunun ilk nesillerde yaygın olarak bilinip sonradan unutulmuş olması da mümkün değildir. Şu hâlde rivâyet ya nesh edilmiştir, râvînin bundan haberi yoktur veya uydurmadır.”"}]},{"h":"7. Râvînin, Kendi Rivâyetine Karşı Tutumu Sebebiyle Tenkid Edilen Hadisler","b":[{"k":"p","x":"Hanefîler, râvînin hadise karşı şu dört şekilde tavır almasını, hadisi delil olabilme derecesinden düşüren bir kusur kabul ederler."},{"k":"n","n":1,"x":"Râvînin rivâyetini inkâr etmesi"},{"k":"n","n":2,"x":"Râvînin kendi rivâyetinin aksine amel etmesi veya fetvâ vermesi"},{"k":"n","n":3,"x":"Râvînin hadisi yorumlaması veya muhtemel manalarından birisini tercih etmesi"},{"k":"n","n":4,"x":"Râvînin hadisle amel etmemesi (Terku’l-amel bi’l-hadîs)."},{"k":"p","x":"Râvînin hadisle amel etmemesi ile hadisin aksine amel etmesi aynı sonuca götürür."}]},{"h":"8. Hadisin Üslûbunu İnceleyerek Metin Tenkidi","b":[{"k":"p","x":"Muhaddisler, hadislerle çok meşgul olmanın hadisin sahîh olup olmadığını ayırabilme kabiliyeti kazandırdığını ifade ederler. **İbnu’l-Kayyim**, “Sahîh hadisleri, eti kemiği olacak derecede hazmetmiş olanlar, senedine bakmadan hadisin mevzu olduğunu tanıyabilirler” der."},{"k":"p","x":"**İbn Salâh** da hadislerdeki lâfız ve mana bozukluklarından dolayı mevzu olduğunun anlaşılabileceğini belirtir ve “Rasûlullah (s), Arab’ın en fasih ve beliğlerindendi” der."},{"k":"dikkat","x":"Yalnız bazı lâfız ve mana bozukluklarının, râvînin mana ile rivâyeti sonucu doğmuş olabileceği ihtimalini gözden uzak tutmamak gerekir."},{"k":"p","x":"Herhangi bir mevzuat kitabını incelediğimizde, sahîh hadisler ile mevzu hadisler arasındaki üslûb farklılıklarını çok bariz bir şekilde görebiliriz."}]},{"h":"Metin Tenkidi Muhalifleri","b":[{"k":"p","x":"Metin tenkidine şiddetle karşı çıkanlardan biri, **İbnu’l-Kayyim**’dır. O, metin tenkidine hadisin sıhhatini tesbit için değil, mezheb görüşüne aykırı hadisleri reddedebilmek için başvurulduğu şeklinde çok dikkat çekici bir iddiada bulunur. Şöyle diyor: “Bazı kişiler görürsün ki hadisin râvîsi hadise muhâlefet etmiş olmasına rağmen taklid ettikleri imamın görüşüne uyduğu için hadisi delil kabul ederler. Eğer hadis mezheb görüşüne aykırıysa ‘Râvî hadisine muhâlefet ediyor, bu da hadisin sahîh olmadığı veya mensuh olduğuna dair bir bilgisi olduğunu gösteriyor, onun için hadisle amel etmeyiz’ derler. Böylece bir konuda iki zıt tutuma girerek tenâkuza düşerler. Bizim inancımıza göre hadis sahîh olduğu sürece, başka bir hadis tarafından nesh edilmemişse, muhalefet edenlere itibar etmeksizin amel etmemiz farzdır. Muhâlefet edenler kim olursa olsun böyledir.”"},{"k":"p","x":"**Şevkânî** de, hadis akla, kesin nasslara ve icmâ’a aykırı olduğunda te’vîl edilmiyorsa reddedileceğini benimser görünmektedir. Fakat diğer metin tenkidi kriterlerine o da karşı çıkmaktadır."}]},{"h":"Sonuç","b":[{"k":"p","x":"Hadis ve fıkıh literatürünü tarihî seyri içerisinde incelediğimizde, müslüman âlimler arasında metin tenkidi zihniyetinin çok sistemli bir şekilde mevcut olduğunu görüyoruz. Rivâyetlerin, sağlam ve kat’î dinî kaynakların ışığında değerlendirmeye tâbi tutulması, akl-ı selîmin ölçülerine vurulması şeklindeki bu tatbikat ve gelenek, İslâmî ilimlerin klasik dönemlerinde daha fazla hâkimdir. Sonraki dönemlerde bu tenkid zihniyetinin zamanın şartlarına göre ilk devirlerdeki seviyeyi gösteremediğini söylemek hatalı olmasa gerektir. Nakilcilik, derlemecilik ve şerh dönemlerinde de bu tenkidci zihniyet sürdürülebilseydi İslâmî ilimlerin bugün ulaştığı nokta herhalde daha farklı olurdu."}]}],"ht":[{"s":0,"x":"Tearuz: iki şer’î delilin muktezasının çelişmesi. Âlimlerin çoğunluğuna göre dinî deliller arasında gerçek çatışma yoktur, görülen çatışmalar zahiridir."},{"s":0,"x":"Hanefîler metindeki bu kusura iç inkıtâ (inkıtâu’l-bâtın), seneddeki kesikliğe dış inkıtâ derler."},{"s":0,"x":"İç inkıtâ: râvîdeki kusurlar ve hadisin dinî asıllara muarız olması (Kur’ân, ma’rûf sünnet, umûm-u belvâ, sahabenin delil olarak kullanmaması)."},{"s":1,"x":"Hadisin Kur’ân’la münâsebeti: nassı destekler, mücmeli açıklar (tebyîn), Kur’ân’da olmayan konuda müstakil hüküm koyar. İhtilâf yalnızca üçüncüsündedir."},{"s":1,"x":"Kur’ân’a muarız görünen hadiste önce tearuz giderilmeye çalışılır, mümkün değilse Kur’ân daha kuvvetli ve kat’î olduğu için hadis reddedilir. Cüveynî sünnetin takdim edileceği görüşündedir."},{"s":1,"x":"Arzda Kur’ân’ın ve hadisin bütünü dikkate alınır; tedricî teşrî prensibine dikkat edilir."},{"s":2,"x":"Mütevâtire muhâlif haber-i vâhid genelde reddedilir. Cüzekânî: sıhhati kat’î olan hadislere aykırı hadisler bâtıldır."},{"s":2,"x":"Hanefîler meşhur sünnete muhalif hadisi reddeder; bu yüzden “bir şahid ve bir yeminle hüküm” hadisini “Delil davacıya, yemin dâvâlıyadır” hadisine aykırı bulup kabul etmezler."},{"s":2,"x":"Mütevâtirin meşhûr ve âhâda tercihinde ittifak vardır; Hanefîler meşhûru âhâda tercih eder, cumhur fark gözetmez."},{"s":2,"x":"İbnu’l-Kayyim: hadis mensuh değilse ve sahîhse, muhâlefet edenlere itibar edilmeden amel edilir; Ahmed b. Hanbel de bu görüştedir."},{"s":3,"x":"Hadisle icmâın çatışması iki ihtimal düşündürür: hadis sahîh değildir ya da icmâ hadisi nesheden başka bir hadise dayanır. Her iki durumda hadis reddedilir."},{"s":3,"x":"İcmâ sünneti nesh edemez. Şâfiî: ümmetin sünnete zıt bir icmâda birleşmesi mümkün değildir."},{"s":3,"x":"İbn Kuteybe: icmâ hadisten daha kuvvetlidir; hadislere unutma, gaflet, şüphe, te’vîl, nesh gibi hususlar ârız olur, icmâ bunlardan uzaktır."},{"s":3,"x":"Hanefîler: sahabe ihtilâf ettiği konuda mevcut hadisle amel etmemişse o hadisle amel edilemez."},{"s":4,"x":"İman esaslarına aykırı hadisler kabul edilmez. İbnu’l-Cevzî: bir hadisi akla ve din prensiplerine aykırı bulursan anla ki o hadis uydurmadır."},{"s":4,"x":"Tûfî: nass maslahatla teâruz edince maslahat tercih edilir (bu mutlak tercih başka âlimden nakledilmez)."},{"s":4,"x":"Maslahat-ı mürsele: Şâfiî’ye göre delil değildir; Mâlik ve Ahmed’e göre onunla amel edilir."},{"s":4,"x":"Reddetmeden önce aykırılığın gerçekten var olup olmadığı ve uzlaştırma imkânı araştırılır. İbnu’l-Kayyim İ’lâmu’l-Muvakkı’în’de buna seksen sayfa ayırmıştır."},{"s":5,"x":"Kıyâs deliller hiyerarşisinde hadis ve icmâdan sonra gelir; sahîh hadisle kıyâs çatışınca hadis tercih edilir."},{"s":5,"x":"Ebû Zehra: hadise teâruz edebilecek kıyâs, Kur’ân ve sünnetten çıkarılan genel kaidelerdir."},{"s":6,"x":"Berzencî: usûlcü ve kelâmcıların çoğunluğu akıl ile naklin çatışabileceğini kabul eder. İbn Teymiyye ve Şâtıbî: kat’î iki delil çatışmaz."},{"s":6,"x":"Akla aykırı hadis mütevâtir ise te’vîl edilir; âhâd ise te’vîl imkânı araştırılır, mümkün değilse terk edilir."},{"s":6,"x":"Teâruz söz konusu olan akıl akl-ı selimdir; gaybî konular akıl kriterine vurulmaz; mecâz, kinâye, işaret, remiz ihtimali düşünülür."},{"s":7,"x":"Müşâhede: duyu organlarıyla edinilen bilgi. Müşâhedeye aykırı hadisin reddi genellikle kabul edilir; ama duyuların yanılabileceği unutulmamalıdır."},{"s":7,"x":"Tecrübe en önemli ilim a
