ğı yine metnin üzerindedir, ancak öbür ayak, mütercimin metinden anladığı anlamı, okuyucunun ta zihnine ulaştırıncaya kadar açılacaktır. Böylece, bir ayak metinde, öbür ayak ise okurda olacaktır. Mütercim, pergel örneğinde olduğu üzere, metin ile okuyucu arasında anlamı kolay ve doğru bir şekilde ileten bir iletken olmalıdır. İşte günümüz müterciminin asıl görevi burada kendini göstermektedir. Kendi anladığı ve kendi diliyle ifade ettiği bu anlamı okuyucuya nasıl mal edecektir? Okuyucunun ilgisini, bilgisini, seviyesini vb. dikkate alarak metindeki anlamı asıl hedef olan okuyucunun anlayışına güvenle teslim etmelidir."}]},{"h":"Woodhouslee’nin Üç Prensibi","b":[{"k":"p","x":"XVIII. asrın sonunda Edinburgh Üniversitesi’nde tarih profesörü olan Lord Woodhouslee Tercüme Prensipleri Üzerine Deneme adlı nadir eserinde bir tercümenin yapılması ve hakkında hüküm verilmesi için üç temel prensip koyuyordu:"},{"k":"n","n":1,"x":"Bir tercüme, aslındaki fikirleri, tam ve eksiksiz, olduğu gibi vermelidir."},{"k":"n","n":2,"x":"Yazının üslûp ve tarzı, aslınınki ile aynı vasıfta olmalıdır."},{"k":"n","n":3,"x":"Bir tercüme, telif kadar kolay okunabilmelidir."}]},{"h":"Eşdeğerci ve İşlevselci Yaklaşım","b":[{"k":"p","x":"Batı’da 60 ila 70’li yıllara kadar yapılan çevirilerde egemen olan unsur, kısaca “kaynak metne sadakat” diye niteleyebileceğimiz geleneksel “eşdeğerlilik” kavramıydı. Daha sonra ise, “fonksiyonalizm / işlevselcilik” olarak bilinecek yeni bir yaklaşım ortaya konuldu. İşlevselci yaklaşım, çeviri sürecinde, kaynak metinden çok çevirmene ve çeviri metnine ağırlık vermektedir. Bu yüzden, işlevselci yaklaşım, kaynak metni tahrif edebileceği gerekçesiyle ağır eleştirilere maruz kalmıştır. Aslında bu gerekçe doğru değildir; çünkü işlevselci yaklaşımı savunan yazarlardan hiçbiri, yanlış çeviriyi onaylamamaktadır, aksine, doğru çeviriyi bulabilmesi için çevirmene ağır sorumluluklar yüklemektedir."},{"k":"p","x":"Eşdeğerci yaklaşım; yazara sadıktır, kendisi görünmez, kaynak metne yöneliktir, linguistik eşdeğerlilik egemendir, kuralları uygulamakla yetinir. İşlevselci yaklaşımda ise, çevirmen daha görünürdür (aktiftir), okura sadıktır (onu öncelemektedir), erek metne yöneliktir, kabul edilebilir bir iletişim içindedir. Birincisi, okuru ırmaklar içinden geçirmeyi; ikincisi ise, ırmaklardan geçmeyi sağlamak üzere köprüler kurmayı hedefler."},{"k":"p","x":"Netice itibariyle, amaç, kaynak metni erek dile işlevsel olarak, yani okurun anlamasını sağlayacak şekilde çevirmektir. Öncelikle kaynak metni anlamak, sonra da bu metni, okurun anlayabileceği şekilde erek dile aktarmak. İşte bu bağlamda, çevirmene çeviri sürecinde özgürlük tanıdığı ölçüde sorumluluk da yükleyen işlevselci yaklaşımın önemi daha da anlaşılmaktadır. Özellikle çeviri konusundaki işlevselci yaklaşım, günümüzün gereksinimlerine daha iyi yanıt vermesi bakımından büyük bir önem taşımaktadır."},{"k":"tbl","r":[["","Eşdeğerci yaklaşım","İşlevselci yaklaşım"],["**Sadakat**","Yazara sadıktır","Okura sadıktır (onu önceler)"],["**Çevirmen**","Görünmez","Daha görünür (aktif)"],["**Yönelim**","Kaynak metne","Erek metne"],["**Esas**","Linguistik eşdeğerlilik; kuralları uygulamakla yetinir","Kabul edilebilir bir iletişim"],["**Benzetme**","Okuru ırmaklar içinden geçirir","Irmaklardan geçmek için köprüler kurar"]]},{"k":"p","x":"“Bütün bu tavsiyeler bizi şu umumi kanaate götürür: Bir tercüme, kolay ve zevkle okunabilmelidir, kolay ve zevkle okunamıyorsa hiçbir zaman okunmayacaktır. Okunmayacak tercümenin ise, hiç yapılmaması daha iyi olur.”"}]}],"ht":[{"s":0,"x":"Hangi eserlerin çevrileceği iyi tespit edilmelidir; temel kaynakların sağlıklı çevirileri yokken şerhler dahi çevrilmeye başlanmıştır."},{"s":0,"x":"Tayyib Okiç’in işaret ettiği üzere bütün bir kitabı izahsız çevirmenin ciddi riskleri vardır (mezhebe uymayan hadisler, dönemin şartlarında normal olan konular)."},{"s":1,"x":"Garip kelimeler için normal Arapça sözlüklere değil Garibü’l-hadis sözlüklerine, hatta el-Halîl b. Ahmed’in Kitâbü’l-Ayn’ı gibi en eski eserlere başvurulmalıdır."},{"s":1,"x":"Metinde görünmeyen kısımlar diğer rivâyetlerden alınıp parantezle tamamlanmalıdır (hazf, takti’, ihtisar)."},{"s":1,"x":"“en-nasiha” nasihat değil, içten-özden bağlılık ve samimiyettir; “ırz” borçlunun onur ve haysiyetidir."},{"s":2,"x":"Tekid ve istisna kalıpları (“… yoktur ki, şöyle olmasın”) ve şart-cevap cümleleri (“Her kim şöyle yaparsa…”) daha düz ve sade çevrilmelidir."},{"s":2,"x":"“Sizden biriniz” kalıbı yerine doğrudan “Şöyle yapın! Böyle yapmayın!” denebilir; meclisteki birine işaret varsa o üslupla çevrilir."},{"s":2,"x":"«وبطنه معصوب بحجر» Hüzeyl lügatinde aşırı açlıktan kinaye bir deyimdir; deyimler harfî çevrilmez."},{"s":2,"x":"Açıklamalar parantez ya da dipnotla verilir; metne sadık kalıp anlaşılmamaktansa manayı tutturan serbest çeviri yeğdir."},{"s":3,"x":"Pergel örneği: bir ayak metinde, öbür ayak okurda olmalı; mütercim metin ile okuyucu arasında anlamı ileten bir iletkendir."},{"s":4,"x":"Lord Woodhouslee’nin üç prensibi: fikirleri tam ve eksiksiz vermek, üslûbun aslıyla aynı vasıfta olması, telif kadar kolay okunmak."},{"s":5,"x":"Batı’da 60–70’li yıllara kadar “eşdeğerlilik” (kaynak metne sadakat) egemendi; sonra “işlevselcilik” (fonksiyonalizm) ortaya çıktı."},{"s":5,"x":"Eşdeğerci yaklaşım yazara ve kaynak metne, işlevselci yaklaşım okura ve erek metne yöneliktir; birincisi okuru ırmaktan geçirir, ikincisi köprü kurar."},{"s":5,"x":"Kolay ve zevkle okunamayan tercüme hiçbir zaman okunmaz; okunmayacak tercümenin hiç yapılmaması daha iyidir."}]}];
const SORULAR = [{"u":0,"q":"Metin tenkidi kavramının hadis ilminde bir ıstılah olarak kullanılması ne zaman ortaya çıkmıştır?","a":["Son dönemlerde","Sahâbe döneminde","Tâbiûn döneminde","Hadis tasnif döneminde"],"x":"Metin tenkidi kavramının hadis ilminde bir ıstılah olarak kullanılması son dönemlerde ortaya çıkmıştır; klasik dönemde muâraza, ihtilâf, teâruz, işkâl gibi terimler kullanılmıştır."},{"u":0,"q":"Aşağıdakilerden hangisi metin tenkidi ameliyesine referans teşkil eden klasik kavramlardan biri değildir?","a":["Cerh ve ta’dîl","Muâraza","Teâruz","İşkâl"],"x":"Muâraza, ihtilâf, teâruz, işkâl gibi klasik kavramlar metin tenkidi ameliyesine tam tamına tetabuk etmese de referans teşkil eder. Cerh ve ta’dîl sened tenkidiyle ilgilidir."},{"u":0,"q":"Modern tarihçilikte kaynak malzemenin orijinal mi yoksa sahte mi olduğunu tesbit için yapılan işleme ne ad verilir?","a":["Dış tenkid (en-nakdu’l-hâricî)","Olumlu iç tenkid","Olumsuz iç tenkid","Muâraza"],"x":"Dış tenkid (en-nakdu’l-hâricî, critique externe) kaynak kritiğidir; kaynak malzemenin orijinal mi sahte mi olduğunu tesbit eder."},{"u":0,"q":"Hadisteki isnâd ve rical tenkidi, tarihçilerin hangi tenkidine tekabül eder?","a":["Negatif (olumsuz) iç tenkide","Dış tenkide","Pozitif (olumlu) iç tenkide","Hiçbirine tekabül etmez"],"x":"Hadisteki isnâd ve rical tenkidi negatif iç tenkide tekabül eder. Bu yüzden tarihteki dış tenkidi isnâd tenkidiyle, iç tenkidi metin tenkidiyle özdeşleştirmek doğru değildir."},{"u":0,"q":"Hadisçilerin metin hakkında her türlü tenkidden müctenib (uzak) davrandıklarını söyleyen kimdir?","a":["Caetani","İbn Salâh","İbnu’l-Kayyim","Hatîb Bağdâdî"],"x":"Caetani, hadisçilerin metin hakkında her türlü tenkidden müctenib davrandıklarını söyler."},{"u":0,"q":"Tarih ve hadis tenkid merhalelerinin karşılaştırılmasına göre, bir kaynağın bütün varyantlarını toplama geleneği hangisinde çok yaygındır?","a":["Hadisçilerde","Tarihçilerde","Her ikisinde eşit ölçüde","Hiçbirinde"],"x":"Tarihçilerde bir kaynağın bütün varyantlarını toplama tatbikatına yaygın olarak rastlanmaz; hadisçilerde ise bir hadisin bütün varyantlarını toplama geleneği çok yaygındır."},{"u":0,"q":"Tarihçinin metin tenkidine önem vermesinin sebebi nedir?","a":["Belgenin mevsûkiyetini tesbit için yeterli malûmat bulamaması","İsnâd tenkidini gereksiz görmesi","Şerh geleneğine sahip olması","Kaynaklarının çok sayıda varyantı bulunması"],"x":"Tarihçinin metin tenkidine önem vermesi, belgenin mevsûkiyetini tesbit için yeterli malûmat bulamadığındandır."},{"u":0,"q":"Hadisçilerin metin tenkidine önem vermedikleri iddiaları hangi iki sebepten kaynaklanır?","a":["Hadis tenkid sistemine sathî bakış ve İslâmî ilimler taksimatının katı sınırlarla mütâlâası","Râvî sayısının azlığı ve sened kopukluğu","Şerh geleneğinin yokluğu ve garîb kelimelerin çokluğu","Mezhep taassubu ve rivâyet bolluğu"],"x":"İddialar temelde iki sebepten kaynaklanır: hadis tenkid sisteminin sathî bir nazarla incelenmesi ve İslâmî ilimler taksimatının katı sınırlar içerisinde mütâlâa edilmesi."},{"u":0,"q":"Sahîh hadisin şartlarından hangisi birinci plânda iç tenkidi ilgilendirir?","a":["Şazz olmaması","Râvîlerin adalet sahibi olması","Râvîlerin zabt sahibi olması","Senedin muttasıl olması"],"x":"Sahîh hadisin şartlarından ilk ikisi (adalet ve zabt, ittisal) dış tenkidi; şazz ve illetli olmama şartları iç tenkidi ilgilendirir."},{"u":0,"q":"Sened veya metinde takdim te’hir yapılan hadise ne denir?","a":["Maklûb","Müdrec","Musahhaf","Muzdarib"],"x":"Takdim te’hir yapılan hadise maklûb, sonradan ilâve yapılan hadise müdrec, tahrifat yapılmış hadise musahhaf denir."},{"u":0,"q":"Aralarında aykırılık olan, iki tarafın râvîleri de sika olan hadislerden râvîsi tek kalanına ne denir?","a":["Şazz","Mahfuz","Münker","Muzdarib"],"x":"Râvîsi birden çok olana mahfuz, râvîsi tek kalana şazz denir. Mahfuz tercih edilir, şazz reddedilir. Tek kalan râvî sika değilse rivâyete münker denir."},{"u":0,"q":"Aralarında muhalefet olan hadislerden hiçbirini tercih imkânı olmazsa bu hadislere ne ad verilir?","a":["Muzdarib","Münker","Müdrec","Maklûb"],"x":"Aralarında muhalefet olan hadislerden hiçbirini tercih imkânı olmazsa böyle hadislere muzdarib hadis denir."},{"u":0,"q":"Hadisin farklı tariklerinin birbiriyle mukayesesine hadis ilminde ne ad verilir?","a":["Muâraza veya mukâbele","İ’tibâr veya mutâbaa","Tahrîc veya tahkîk","Cem’ ve te’lif"],"x":"Hadisin farklı tariklerinin birbiriyle mukayesesine muâraza veya mukâbele denir. Yaygın olarak kullanılması tabiûn döneminde başlar."},{"u":0,"q":"Bir muhaddisin rivâyetlerini değişik zamanlarda yeniden dinleyip önceki rivâyetlerinden farklı rivâyette bulunup bulunmadığını kontrol etmenin maksadı nedir?","a":["Râvînin zabtını kontrol etmek","Hocanın rivâyetlerini talebelerle karşılaştırmak","Kitabı hafızadan kontrol etmek","Senedin ittisalini tesbit etmek"],"x":"Muâraza şekillerinden biri olan bu yöntemde maksad râvînin zabtını kontrol etmektir."},{"u":0,"q":"İbnu’l-Kayyim’e göre “Balık yeme vücudu zayıflatır” gibi bir rivâyet hangi mevzuluk alâmetine örnektir?","a":["Tabiblerin veya mutasavvıfların ifade tarzlarına benzemesi","Tecrübe ve müşâhedeye aykırılık","Kur’ân’ın sarih hükümlerine aykırılık","Sarîh sünnete aykırılık"],"x":"İbnu’l-Kayyim’in saydığı alâmetlerden biri tabiblerin veya mutasavvıfların ifade tarzlarına benzemesidir; “Balık yeme vücudu zayıflatır” buna örnektir."},{"u":1,"q":"Tearuz nedir?","a":["İki şer’î delilin muktezasının birbiriyle çelişmesi","Bir hadisin farklı tariklerinin karşılaştırılması","Eski bir hükmün yenisiyle değiştirilmesi","Mutlak lafzın mukayyed lafızla açıklanması"],"x":"Tearuz, iki şer’î delilin muktezasının birbiriyle çelişmesidir."},{"u":1,"q":"Şer’î deliller arasında hakîkî teâruz bulunup bulunmadığı konusunda âlimlerin çoğunluğu hangi görüştedir?","a":["Dinî deliller arasında gerçek çatışma yoktur, görülen çatışmalar zahiridir","Deliller arasında gerçek teâruz bulunabilir","Kat’î deliller arasında teâruz olabilir, zannîler arasında olmaz","Yalnız aklî deliller arasında teâruz olur"],"x":"Üç görüş içinde âlimlerin çoğunluğu birinci görüşü, yani naklî ve aklî dinî deliller arasında gerçek çatışma olmadığını, görülen çatışmaların zahirî olduğunu benimser."},{"u":1,"q":"Hanefî usûlcüler tenkid kriterleriyle çatışan hadislerdeki kusura ne ad verirler?","a":["İç inkıtâ (inkıtâu’l-bâtın)","Dış inkıtâ","İllet-i hafiyye","Şuzûz"],"x":"Hanefîler bu kusuru seneddeki ınkıtâa benzeterek iç inkıtâ (inkıtâu’l-bâtın), seneddeki kesikliğe ise dış inkıtâ derler."},{"u":1,"q":"Aşağıdakilerden hangisi Hanefîlere göre hadisin dinî asıllara muarız olmasının türlerinden biri değildir?","a":["Hadisin râvîsinin fakîh olmaması","Hadisin Kur’ân’a muarız olması","Hadisin ma’rûf sünnete muarız olması","Umûm-u belvâdaki bir hadisin şazz olarak nakledilmesi"],"x":"Dört tür: Kur’ân’a muarız olması, ma’rûf sünnete muarız olması, umûm-u belvâda şazz olarak nakledilmesi ve sahabenin ihtilâf ettiği konuda hadisi delil olarak kullanmamış olması."},{"u":1,"q":"Hadisin Kur’ân’la münâsebetinin üç şeklinden hangisinde âlimler arasında ihtilâf vardır?","a":["Kur’ân’da bulunmayan konularda müstakil hüküm koyması","Kur’ân’daki nassı desteklemesi","Kur’ân’da mücmel olan hususları açıklaması","Hiçbirinde ihtilâf yoktur"],"x":"Sünnetin ilk iki görevi (desteklemek ve tebyîn) konusunda ihtilâf yoktur; üçüncü görevi ve teşrî gücünün kaynağı konusunda değişik görüşler vardır."},{"u":1,"q":"Kur’ân’a muarız görünen bir hadiste tearuz giderilemiyorsa ne yapılır?","a":["Kur’ân nassı daha kuvvetli ve kat’î olduğundan hadis reddedilir","Hadis Kur’ân’ı nesheder","Tevakkuf edilir","Her ikisiyle birden amel edilir"],"x":"Tearuz giderilemiyorsa Kur’ân nassı daha kuvvetli ve kat’î olduğundan hadis reddedilir. Cüveynî ise sünnetin takdim edileceği görüşündedir."},{"u":1,"q":"Sünneti Kur’ân’a arz ederken aşağıdakilerden hangisine dikkat edilmelidir?","a":["Kur’ân’ın tek bir ayeti değil bütünü nazarı itibara alınmalıdır","Yalnızca hadisin senedine bakılmalıdır","Tedricî teşrî prensibi göz ardı edilmelidir","Sadece mütevâtir hadisler arz edilmelidir"],"x":"Arzda Kur’ân’ın tek bir ayeti değil bütünü nazarı itibara alınmalı, aynısı hadis için de geçerlidir; ayrıca tedricî teşrî prensibine çok dikkat edilmelidir."},{"u":1,"q":"Hanefîler “bir şahid ve bir yeminle hüküm” hadisini hangi gerekçeyle kabul etmezler?","a":["“Delil davacıya, yemin dâvâlıyadır” meşhur hadisine aykırı buldukları için","Senedinde kopukluk olduğu için","Kur’ân’ın sarih hükmüne aykırı olduğu için","Râvîsi rivâyetini inkâr ettiği için"],"x":"Hanefîler meşhur sünnete muhalif hadisleri reddeder; bu hadisi “Delil davacıya, yemin dâvâlıyadır” meşhur hadisine aykırı bulurlar."},{"u":1,"q":"Hadis–icmâ çatışmasında İbn Kuteybe hadisin reddedilmesini neye dayandırır?","a":["İcmâın hadisten daha kuvvetli olmasına","Hadisin her zaman mensuh olmasına","Kıyâsın hadisten önce gelmesine","Râvînin sika olmamasına"],"x":"İbn Kuteybe’ye göre hak ve hakikat icmâ yoluyla rivâyetten daha kuvvetli olarak sabit olur; hadislere unutma, gaflet, şüphe, te’vîl, nesh gibi hususlar ârız olur."},{"u":1,"q":"Aşağıdakilerden hangisi İbn Kuteybe’nin icmâa aykırı hadislere verdiği örneklerden biridir?","a":["Hz. Peygamber’in sabah ve akşam namazlarında kunut okuması","Garanik hadisi","Kayıp develerin toplanmasının yasaklanması","Hurma aşılama kıssası"],"x":"Berâ’nın naklettiği sabah ve akşam namazında kunut rivâyetine rağmen fukahâ akşam namazında kunut okunmayacağında ittifak etmiştir."},{"u":1,"q":"Nass ile maslahat teâruz edince maslahatın tercih edileceğini söyleyen âlim kimdir?","a":["Tûfî","Şâfiî","Ebû Zehra","Şâtıbî"],"x":"Süleyman b. Abdu’l-Kavî et-Tûfî’nin görüşü maslahatın tercih edileceği şeklindedir; böyle bir mutlak tercih başka bir âlimden nakledilmez."},{"u":1,"q":"Şâfiî’ye göre maslahat-ı mürsele zannî nassa teâruz edebilir mi?","a":["Hayır, çünkü delil değildir","Evet, her durumda tercih edilir","Evet, kat’î ise tercih edilir","Yalnızca icmâ ile desteklenirse"],"x":"Şâfiî’ye göre maslahat-ı mürsele delil olmaz, dolayısıyla zannî nassa teâruz edemez. Mâlik ve Ahmed’e göre bu maslahatla amel edilir."},{"u":1,"q":"Mâlikî ve bazı Hanbelîlere göre birkaç asl ile desteklenen bir kıyâs haber-i âhâdla çatışırsa ne olur?","a":["Kıyâs öne alınır, haber-i âhâd reddedilir","Haber-i âhâd öne alınır","Tevakkuf edilir","İkisi cem’ edilir"],"x":"Birkaç asl ile desteklenen ve illeti birkaç nasstan çıkarılan kıyâs kat’îlik kazanmıştır; haber-i âhâd zannî olduğundan reddedilir."},{"u":1,"q":"Akla aykırı gelen hadis mütevâtir ise ne yapılır?","a":["Te’vîl edilmesi gerekir","Hemen reddedilir","Haber-i âhâd gibi terk edilir","Kıyâsa arz edilir"],"x":"Akla aykırı gelen hadis mütevâtir ise te’vîl edilmesi gerekir; âhâd ise te’vîl imkânı araştırılır, mümkün değilse terk edilir."},{"u":1,"q":"Aşağıdakilerden hangisi Şâtıbî’nin dinî delillerin akla aykırı olmayacağına dair delillerinden biridir?","a":["Şer’î deliller akla aykırı olsaydı bu teklîf-i mâ lâ yutâk olurdu","İcmâ hadisten daha kuvvetlidir","Mütevâtir hadis sayıca çok azdır","Duyular yanılabilir"],"x":"Şâtıbî’nin delillerinden biri: akıl sahibi insanı akla aykırı şeyi kabulle yükümlü tutmak teklîf-i mâ lâ yutâktır; Allah insanları böyle bir şeyle mükellef tutmaz."},{"u":1,"q":"“Gözümdeki hastalıktan Cibril’e şikâyetlendim, mushafa bakmamı tavsiye etti” rivâyeti hangi ölçüte göre tenkid edilmiştir?","a":["Tarihî gerçeklere aykırılık","Akla aykırılık","İcmâa aykırılık","Kıyâsa aykırılık"],"x":"İbnu’l-Cevzî bu rivâyeti “Hz. Peygamber devrinde mushaf mı vardı ki baksın?” diye tenkid eder; kesin bilinen tarihî gerçeklere aykırıdır."},{"u":1,"q":"Umûm-u belvâda tek kişinin rivâyet ettiği bir hadis hakkında Hanefîlerin vardığı sonuç nedir?","a":["Rivâyet ya mensuhtur ya da uydurmadır","Rivâyet her durumda sahîhtir","Rivâyet kıyâsa tercih edilir","Rivâyet icmâyı nesheder"],"x":"Hanefîlere göre herkesi ilgilendiren dinî bir hükmün yalnız bir kişiye bildirilmesi mümkün değildir; rivâyet ya nesh edilmiştir (râvînin haberi yoktur) ya da uydurmadır."},{"u":1,"q":"Aşağıdakilerden hangisi Hanefîlerin hadisi delil olmaktan düşüren râvî tutumlarından biri değildir?","a":["Râvînin hadisi başka râvîlerle mukayese etmesi","Râvînin rivâyetini inkâr etmesi","Râvînin kendi rivâyetinin aksine fetvâ vermesi","Râvînin hadisle amel etmemesi"],"x":"Dört tutum: rivâyetini inkâr, aksine amel veya fetvâ, hadisi yorumlama veya bir manayı tercih, hadisle amel etmeme (terku’l-amel bi’l-hadîs)."},{"u":1,"q":"Metin tenkidine mezheb görüşüne aykırı hadisleri reddetmek için başvurulduğunu iddia ederek karşı çıkan âlim kimdir?","a":["İbnu’l-Kayyim","Şevkânî","İbn Salâh","Hatîb Bağdâdî"],"x":"Metin tenkidine şiddetle karşı çıkanlardan biri İbnu’l-Kayyim’dir; ona göre hadis sahîh olduğu ve nesh edilmediği sürece muhalefet edenlere itibar edilmeden amel farzdır."},{"u":2,"q":"Usul âlimlerinin hemen hepsine göre muhtelifu’l-hadîs kaç gruba ayrılır?","a":["Cem’ ve te’lifi mümkün olanlar ve mümkün olmayanlar","Mütevâtir ve âhâd olanlar","Kavlî, fiilî ve takrîrî olanlar","Nâsih, mensuh ve muhkem olanlar"],"x":"Usul âlimlerinin hemen hepsi ihtilâflı hadislerin cem’ ve telifi mümkün olanlar ve mümkün olmayanlar diye iki grup teşkil ettiğini kabul eder."},{"u":2,"q":"İhtilâfı giderme yolları aslında hangi işlemin uygulama yönlerinden ibarettir?","a":["Te’vîlu muhtelifi’l-hadîs","Cerh ve ta’dîl","Tahrîcu’l-hadîs","Muâraza"],"x":"Cem’i mümkün olan ve olmayan hadislerin teâruzunu gidermeyi sağlayan usuller “te’vilu muhtelifi’l-hadîs” adıyla ifade edilen te’vîl işleminin uygulama yönleridir."},{"u":2,"q":"Hanefîlerin ihtilâfı giderme sistemindeki sıralama hangisidir?","a":["Nesh, tercih, cem’ ve te’lif, tesâkut (NTCT)","Cem’ ve te’lif, tercih, nesh, tevakkuf (CTNT)","Cem’ ve te’lif, nesh, tercih, tevakkuf (CNTT)","Tercih, nesh, cem’ ve te’lif, tevakkuf"],"x":"Hanefîlerin sistemi NTCT’dir: nesh, tercih, cem’ ve te’lif, tasâkut (terk)."},{"u":2,"q":"Hadisçilerin ihtilâfı giderme sistemindeki sıralama hangisidir?","a":["Cem’ ve te’lif, nesh, tercih, tevakkuf (CNTT)","Cem’ ve te’lif, tercih, nesh, tevakkuf (CTNT)","Nesh, tercih, cem’ ve te’lif, tesâkut (NTCT)","Tercih, cem’ ve te’lif, nesh, tevakkuf"],"x":"Hadisçilerin sistemi CNTT’dir: cem’ ve te’lif, nesh, tercih, tevakkuf. Cumhurunki CTNT, Hanefîlerinki NTCT’dir."},{"u":2,"q":"Hanefîlerin ihtilâfı giderme sistemi hangi gerekçeyle tenkit edilmiştir?","a":["Cem’ imkânı varken birinci sırada nesh’ten söz etmenin doğru olmayacağı","Tercihi hiç kullanmadığı","Tevakkufu ilk sıraya koyduğu","Kıyâsı hadise tercih ettiği"],"x":"Hanefî sistemi “hadisin ziyânına mani olmak” prensibine ters düşer; cem’ imkânı varken nesh’ten söz etmenin doğru olmayacağı gerekçesiyle Hanefî olan Leknevî tarafından tenkit edilmiştir."},{"u":2,"q":"Aşağıdakilerden hangisi cem’ ve te’lifin gerçekleşme yollarından biri değildir?","a":["Tevakkuf","Tahsîs","Takyîd","Haml"],"x":"Cem’ ve te’lifin üç yolu fıkıh usûlü metotlarıdır: tahsîs (tahsîsu’l-âmm), takyîd (takyîdu’l-mutlak), haml (hamlu’l-hadîs alâ teaddüdi’l-hâdise)."},{"u":2,"q":"Besmelesiz kesilen hayvan meselesinde Hanefîlerin “Müslüman bismillah desin demesin kestiğini Allah adıyla keser” hadisiyle ayetin tahsisini kabul etmemesinin sebebi nedir?","a":["Âmmın delaletini kat’î kabul etmeleri","Âmmın delaletini zannî kabul etmeleri","Hadisi mensuh saymaları","Ayeti müteşâbih saymaları"],"x":"Bu ihtilaf Hanefîlerin âmmın delaletini kat’î, Şâfiîlerin ise zannî kabul etmelerinden kaynaklanır; Şâfiîler hadisle ayeti tahsis eder."},{"u":2,"q":"Hadisin hadisle tahsisinde hadisin kavlî, fiilî, takrîrî, mütevâtir veya âhâd olmasının neticeye etkisi nedir?","a":["Tesiri yoktur, bunlar yekdiğerini tahsis eder","Yalnız mütevâtir âhâdı tahsis eder","Yalnız kavlî hadis tahsis edebilir","Fiilî hadis kavlîyi tahsis edemez"],"x":"Umûmiyetle hadisin hadisle tahsisinde bu farkların neticeye tesiri yoktur; bunlar yekdiğerini tahsis eder."},{"u":2,"q":"«وأحل لكم ما وراء ذلكم» ayetinin hadisle tahsisi hangi konudadır?","a":["Kadının halası veya teyzesi üzerine nikâh edilemeyeceği","Cizye verenlerle savaşılmaması","Zekât vermeyenlerle harb","Besmelesiz kesilen hayvanın eti"],"x":"Bu ayet, kadının halası veya teyzesi üzerine nikâh edilemeyeceğini bildiren hadisle tahsis edilmiştir (Kur’an’ın hadisle tahsisi)."},{"u":2,"q":"Hz. Ebubekir’in zekâtı namaza kıyas ederek zekât vermeyenlerle harb kararı hangi tahsis türüne örnektir?","a":["Kıyas ve örf ile tahsis","Hadisin hadisle tahsisi","Hadisin Kur’an’la tahsisi","Kur’an’ın hadisle tahsisi"],"x":"Hz. Ebubekir’in zekâtı namaza kıyas ederek verdiği harb kararı kıyas ve örf ile tahsise örnektir."},{"u":2,"q":"Usûlcülerin müttefik olduğu tahsis hangisidir?","a":["Örf-i kavlînin âmmı tahsis etmesi","Örf-i amelînin âmmı tahsis etmesi","Aklın hadisi tahsis etmesi","Maslahatın nassı tahsis etmesi"],"x":"Örf-i kavlînin mutlakı takyîd, âmmı tahsis ettiğinde usûlcüler müttefiktir. Örf-i amelî ile tahsisi Hanefîler ve Mâlikîlerin çoğu yerleşik olmak kaydıyla kabul eder."},{"u":2,"q":"“Su temizdir, hiçbir şey onu kirletmez” hadisi ile iki kulle hadisi arasındaki teâruza göre iki kulleden az suya pislik düşerse hüküm nedir?","a":["Vasfı değişsin değişmesin pislenir","Vasfı değişmedikçe pislenmez","Hiçbir durumda pislenmez","Yalnızca tadı değişirse pislenir"],"x":"Çözüme göre 2 kulle veya fazlası vasfı değişmedikçe kirlenmez; 2 kulleden az su pislik düşünce vasfı değişsin değişmesin pislenir; vasfı pislik sebebiyle değişen su her hâlde pislenir."},{"u":2,"q":"“Her hür ve köle için sadaka-i fıtr veriniz” hadisini “Müslümanlardan” kaydıyla takyid eden ve yalnız müslüman köle için fıtr gerektiğini söyleyen mezhep hangisidir?","a":["Şâfiîler","Hanefîler","Mâlikîler","Zâhirîler"],"x":"Şâfiîlere göre hadis “Müslümanlardan” sıfatıyla takyid edilir. Hanefîler kayıt hükmün sebebinde olduğu için takyid etmez ve tüm köleler için fıtr gerekir derler."},{"u":2,"q":"Müteârız hadislerin farklı vürud şartlarını ortaya koyarak bağdaştırılmasına ne ad verilir?","a":["Haml","Takyîd","Tahsîs","Tercih"],"x":"Haml, müteârız hadislerin farklı vürud şartlarını ortaya koyarak bağdaştırmak, yani hadisleri ait oldukları yere koymaktır."},{"u":2,"q":"Cem’ ve te’lifin amelî neticesi hangi kaidenin uygulamasıdır?","a":["“Amel etmek etmemekten evladır.”","“Nâsih ile amel edilir, mensuh terk edilir.”","“Râcih ile amel edilir, mercûh terk edilir.”","“Şüphe ile yakîn zâil olmaz.”"],"x":"Cem’ ve te’lifin amelî neticesi her hadisi kendine ait yere yerleştirip hepsinden birden istifade etmektir; bu, hadisçilerin “Amel etmek etmemekten evladır” kaidesinin uygulamasıdır."},{"u":3,"q":"Nesh nedir?","a":["Şâri’in eski bir hükmü yenisiyle değiştirmesi","Mutlak lafzın mukayyed lafızla açıklanması","Lafzın kapsamındaki manaların kapsamdan çıkarılması","Müteârız hadislerden birinin meziyetini ortaya koymak"],"x":"Nesh, Şâri’in (kanun koyucunun) eski bir hükmü yenisiyle değiştirmesidir; cem’ ve te’lifin mümkün olmadığı durumda gelir."},{"u":3,"q":"Tahfiften tağlize doğru yapılan nesh hangisidir?","a":["Ukûbet mânâ ve maksadı taşıyan nesh","Ukûbet mânâ ve maksadı taşımayan nesh","Hadisin akıl ile neshi","Delâletu’l-icmâ ile nesh"],"x":"“Yahudilerin zulmü sebebiyle helal kılınmış şeyleri haram kıldık” ayetinde olduğu gibi ukûbet mânâsı taşıyan nesh tahfiften tağlize doğrudur."},{"u":3,"q":"Aşağıdakilerden hangisi neshin gerçekleşme şartlarından biri değildir?","a":["Neshedilen hükmün zamanla kayıtlı olması","Neshin hitap (emir, nehy) ile olması","Neshedilen hükmün şer’î hüküm olması","Cem’ ve te’lifin mümkün olmaması"],"x":"Neshedilen hüküm zaman ile kayıtlı olmamalıdır. Diğer şartlar: hitapla olması, şer’î hüküm olması, nâsihin sonra gelmesi ve cem’-te’lifin mümkün olmaması."},{"u":3,"q":"“Ben sizi kabir ziyaretinden men etmiştim, artık ziyaret edin” hadisi neshi tanıma yollarından hangisine örnektir?","a":["Tasrîhu’n-Nebî","Kavlu’s-Sahâbî","Vürûd tarihinin bilinmesi","Delâletu’l-icmâ"],"x":"Bizzat Rasulullah’ın açıklaması (Tasrîhu’n-Nebî) ile nesh tanınır; kabir ziyareti hadisi buna örnektir."},{"u":3,"q":"Mekke fethindeki “Hacamat yapan ve yaptıranın orucu bozuldu” hadisinin neshi hangi yolla tanınmıştır?","a":["Vürûd tarihlerinin bilinmesi","Tasrîhu’n-Nebî","Kavlu’s-Sahâbî","Delâletu’l-icmâ"],"x":"Bu hadis, veda haccında Rasulullah’ın oruçlu iken kan aldırdığı hadisi ile neshedilmiştir; sonraki öncekini nesheder."},{"u":3,"q":"Dördüncü defa içki içenin öldürüleceği hadisi hangi yolla neshedilmiştir?","a":["Öldürmeme konusunda oluşan icmâ ile","Bizzat Rasulullah’ın açıklamasıyla","Bir sahâbînin açık beyanıyla","Bir ayetin nüzulüyle"],"x":"Ümmetin icmâ etmesi de neshi tanıma yollarındandır (Delâletu’l-icmâ); bu hadis öldürmeme konusundaki icmâ ile neshedilmiştir."},{"u":3,"q":"Sünnetin sünnetle neshinin dört şeklinden hangisi ihtilaflıdır?","a":["Mütevâtir hadisin haber-i vâhid ile neshi","Mütevâtir hadisin mütevâtir hadisle neshi","Haber-i vâhidin haber-i vâhid ile neshi","Haber-i vâhidin mütevâtir hadisle neshi"],"x":"İlk üçü ittifakla caizdir; mütevâtirin haber-i vâhidle neshi ihtilaflıdır. İbn Hazm ve bazı Zâhirîler bunu da caiz görür."},{"u":3,"q":"Nesihte asıl kaide nedir?","a":["Neshedecek nassın neshedilenden daha kuvvetli olması","Neshedilen nassın daha yeni olması","İki nassın aynı ravi tarafından rivâyet edilmesi","Nassların aynı surede bulunması"],"x":"Neshte asıl kaide nâsihin mensuhtan kuvvetli olmasıdır; bu yüzden Kur’an ayetlerinin mütevâtir sünnetle neshedilebileceği görüşü genelde kabul edilmiştir."},{"u":3,"q":"“Hadisin akıl ile neshi” görüşü kime nisbet edilir ve burada “nesh” daha çok hangi anlamdadır?","a":["Mu’tezileden Nazzâm’a; redd manasında","Hanefîlere; tahsis manasında","Zâhirîlere; takyîd manasında","İbn Hazm’a; tercih manasında"],"x":"Mu’tezileden Nazzâm’a nisbet edilen bu görüşte neshin ıstılahî manada kullanıldığını kabul etmek zordur; redd manasında kullanılmış olması daha uygundur."},{"u":3,"q":"Tercih neden kitap ve icmâda söz konusu değildir?","a":["Âyetler birbirini ya tahsis ya nesh eder, icmâda ise teâruz mümkün değildir","Kitap ve icmâ zannî delillerdir","Kitap ve icmâda râvî bulunmaz","Kitap ve icmâ kıyâsla takviye edilemez"],"x":"Tercih takviye imkânı bulunan deliller (haberler ve kıyâs) arasında uygulanır; iki âyetten birinin ötekine tercihi olmaz, âyetler birbirini tahsis veya nesh eder; icmâda teâruz mümkün değildir."},{"u":3,"q":"Râvînin hadisi tahammül şekli bakımından hangi sıralama doğrudur?","a":["Semâ, arza; bu ikisi kitâbe, vicâde ve münâveleye tercih edilir","Arz, semâya; bu ikisi münâveleye tercih edilir","Vicâde, semâya tercih edilir","Münâvele, arza tercih edilir"],"x":"Rivâyette bulûğdan sonrası öncesine; semâ yolu arz yoluna; bu ikisi yoluyla alanın kitâbe, vicâde ve münâvele yoluyla alana tercihi söz konusudur."},{"u":3,"q":"Metin ile ilgili tercih sebeplerine göre aşağıdakilerden hangisi doğrudur?","a":["Medenî hadisler Mekkî hadislere tercih edilir","Mekkî hadisler Medenî hadislere tercih edilir","Manen rivâyet edilen lafzen rivâyet edilene tercih edilir","Mutlak mukayyede tercih edilir"],"x":"Metinle ilgili tercihte lafzen rivâyet manen rivâyete, Medenî Mekkî’ye, hâs âmma, hakikat mecaza, mukayyed mutlaka tercih edilir."},{"u":3,"q":"Hâricî sebeplerle tercihe hangi durumda başvurulur?","a":["İsnad, metin ve delalette denk olan hadisler için","Cem’ ve te’lif mümkün olduğunda","Hadislerden biri mensuh olduğunda","Hadislerden biri mevzu olduğunda"],"x":"Hâricî sebeplerle tercihe isnad, metin ve delalette denk olan hadisler için başvurulur; Kur’an, sünnet, kıyas ve ümmetin ameline muvafık olan tercih edilir."},{"u":3,"q":"Tevakkuf nedir ve pratikte durumu nasıldır?","a":["Müteârız hadislerin hiçbiriyle amel etmeyip tercih delili çıkana kadar beklemek; pratikte hiç yoktur","Nâsih ile amel edip mensuhu terk etmek; pratikte yaygındır","Râcih ile amel edip mercûhu terk etmek; yalnız teoride vardır","İki hadisi birlikte uygulamak; pratikte çok azdır"],"x":"Tevakkuf (tahyir, tesâkut) müteârız hadislerin hiçbiriyle amel etmeyip beklemektir. Sadece teoride vardır; pratikte hiç yoktur, çünkü bu aşamaya gelmeden nesh ve tercih ile iş bitirilir."},{"u":4,"q":"Garanik hadisi neden reddedilmiştir?","a":["Putları inkâr eden ayetlere ters olduğu için","Senedi kopuk olduğu için","İcmâa aykırı olduğu için","Tarihî gerçeklere aykırı olduğu için"],"x":"“Lat ve Uzza’ya ve Menat’a ne dersiniz?…” ayetine ve putları inkâr eden birçok ayete ters olduğu için reddedilmiştir; ayetler putları ayıplarken öven sözler söylenemez."},{"u":4,"q":"“Kadınlarla istişare edin, söylediklerine muhalefet edin” rivâyeti hangi ayete ters olduğu için reddedilmiştir?","a":["Anne-babanın danışarak ve anlaşarak çocuklarını sütten kesmesine dair ayete","Kız çocuğunun hangi suçtan gömüldüğünün sorulacağı ayete","Siyah iplik beyaz iplikten ayrılıncaya kadar yiyip içme ayetine","Gücünüzün yettiği kadar kuvvet hazırlayın ayetine"],"x":"“Ana-baba aralarında danışarak ve anlaşarak çocuklarını sütten kesmek isterlerse ikisine de sorumluluk yoktur” ayetine ters olduğu için reddedilmiştir."},{"u":4,"q":"Yeryüzünde yetişen her bitkide zekât meselesinde yenilen şeylerin hepsinde zekâtı farz kabul edenler kimlerdir?","a":["İbn Arabî ve Ebû Hanîfe","Şâfiî ve Ahmed b. Hanbel","Ebû Yûsuf ve İmam Muhammed","Nevevî ve İbn Hacer"],"x":"Fakihler bunu yenilebilen, kurutulabilen, ölçülebilen ve saklanabilen şeylerle sınırlar; Mâlikî olan İbn Arabî ve Ebû Hanîfe yenilen şeylerin hepsinde zekâtı farz kabul eder."},{"u":4,"q":"“Benim babam da senin baban da cehennemdedir” rivâyeti nasıl değerlendirilmiştir?","a":["Babalar fetret ehli olduğu için kurtulmuştur; amca (Ebû Tâlib) kastedilmiş olabilir","Rivâyet uydurmadır ve tamamen reddedilir","Rivâyet zahirî manasıyla kabul edilir","Rivâyet ayetle neshedilmiştir"],"x":"Sahih görüşe göre babalar fetret ehli olarak kurtulmuştur; Kur’an’da amcanın baba olarak ifade edilmesinden dolayı amca kastedilmiş olabilir. Nevevî: Rasulullah adamı teselli etmiştir."},{"u":4,"q":"Mu’tezile’nin Kur’an’la çeliştiğini söylediği şefaat hadisine verilen cevap nedir?","a":["Kur’an’da yasaklanan şefaat putların şefaatidir; şefaat Allah’ın izniyle ve tevhid ehli içindir","Şefaat hadisi mevzudur","Şefaat yalnız peygamberler içindir","Şefaat dünyada gerçekleşir"],"x":"Kur’an’da yasaklanan şefaat müşriklerin putlarının şefaatidir. Kur’an şefaati iki şartla ortaya koyar: Allah’ın izninden sonra olması ve tevhid ehli için olması."},{"u":4,"q":"Mu’tezile’nin sahih hadisi reddederek ölçüyü kaçırdığı iddia hangisidir?","a":["Günahkâr müslümanların cehennemden sonra cennete giremeyeceği","Kabir azabının olmadığı","Meleklerin görülebileceği","Kader inancının bulunmadığı"],"x":"Mu’tezile’nin yaptığı gibi sahih hadisi reddetmek (günahkâr müslümanların cehennemden sonra cennete giremeyeceğini iddia etmek) ölçüyü kaçırmaktır."},{"u":5,"q":"Aynı konudaki hadisleri birlikte değerlendirmenin gerekçesi nedir?","a":["Tek bir hadisin zahiriyle yetinmek çok defa hataya düşürür","Mütevâtir hadis sayısını artırmak","Senedleri birleştirmek","Hadis kitaplarını sınıflamak"],"x":"Sünnet aynı konudaki hadisler bir araya toplanınca daha doğru anlaşılır; bir konudaki diğer hadislere bakmadan tek bir hadisin zahiriyle yetinmek çok defa hataya düşürür."},{"u":5,"q":"“Elbisesini uzatan kişi” hadisindeki uzatma neyle takyid edilmelidir?","a":["Kibirlilikle","Namaz vaktiyle","Elbisenin rengiyle","Kadınlarla"],"x":"Bazı hadislerde Rasulullah kibirle elbisesini uzatanları kastettiğini belirtmiştir; Nevevî ve İbn Hacer de bu görüştedir. Kasıtsız uzatma tenzihen mekruhtur."},{"u":5,"q":"Kasıtsız elbise uzatmanın hükmü hakkında hangisi daha uygun görülmüştür?","a":["Tenzihen mekruh olması","Haram olması","Farz olması","Tahrîmen mekruh olması"],"x":"Kibir olmaksızın kasıtsız uzatmanın tenzihen mekruh olması daha uygundur."},{"u":5,"q":"“Bu aletin sokulduğu eve Allah mutlaka zillet sokar” hadisinde yasaklanan nedir?","a":["Ziraatle meşgul olup farz olan (cihat gibi) görevi terk etmek","Pulluk (mihras) aletinin kendisi","Ağaç dikmek","Hayvan beslemek"],"x":"Hadis, ekip dikmeyi sadaka sayan hadise terstir; aslında yasaklanan mihras aleti değil, ziraatle meşgul olup farz görevi terk etmektir. Başka görüşe göre yasak düşmana yakın olan içindir."},{"u":5,"q":"Hadisler birlikte değerlendirildiğinde birbirleriyle nasıl bir ilişki içinde olabilir?","a":["Bazısı bazısını destekler, açıklar veya sınırlandırabilir","Hepsi birbirini nesheder","Yalnızca birbirini tekrar eder","Birbirleriyle hiçbir ilişkisi olmaz"],"x":"Hadisler birlikte değerlendirilirse bazısı bazısını destekler, çelişir, açıklar veya sınırlandırabilir."},{"u":6,"q":"“Sizler dünya işlerinizi daha iyi bilirsiniz” hadisi hangi olayla ilgilidir?","a":["Hurma aşılama kıssası","Hendek kazılması","Hayber’in taksimi","Kayıp develer meselesi"],"x":"Rasulullah zanna dayanan bir görüşüne işaret edip aşılama yaptırmamış, sahabe kötü sonuç alınca bu hadisi söylemiştir."},{"u":6,"q":"“Ben müşrikler arasında oturan her müslümandan uzağım” hadisi hangi manadadır?","a":["Öldürüldüğü zaman kanlarından beriyim","Onlarla hiç konuşmayın","Onların namazı kabul değildir","Onlar müslüman sayılmaz"],"x":"Hadis, müşrikler arasında bulunduğu için farkedilmeyip öldürülen müslümanlar üzerine söylenmiştir; “öldürüldüğü zaman kanlarından beriyim” manasındadır."},{"u":6,"q":"Kadının ancak kocası veya mahremiyle yolculuk yapabileceği yasağının gerekçesi nedir?","a":["Issız çöllerde deve ve katırla yapılan yolculukta zarar ve dedikodu endişesi","Kadının mükellef olmaması","Yolculuğun haram olması","Kadının mal sahibi olamaması"],"x":"Gerekçe yolculuğun deve, katır gibi vasıtalarla ıssız çöllerde yapılması ve kadına zarar gelmesi ya da kötü dedikoduların yayılması endişesidir."},{"u":6,"q":"“İmamlar Kureyş’tendir” hadisindeki Kureyşli olma şartı neye dayanır?","a":["Kureyş’teki asabiyet ve üstünlüğe","Kureyş’in Mekke’de yaşamasına","Kureyş’in ziraatle uğraşmasına","Kureyş’in sayıca az olmasına"],"x":"Kureyşli olma şartı onlarda bulunan asabiyet ve üstünlük sebebiyledir; ayrıca ticaretle uğraştıkları için yönetici vasfı vardı."},{"u":6,"q":"Hz. Ömer Irak arazisini fetheden müslümanlar arasında neden paylaştırmamıştır?","a":["Müslümanların maddi durumu artık iyi olduğu için","Arazi az olduğu için","Fetih barışla olduğu için","Rasulullah bunu yasakladığı için"],"x":"Rasulullah Hayber’i fetheden sahabiler arasında paylaştırmış, Hz. Ömer ise müslümanların maddi durumu artık iyi olduğu için Irak arazisini paylaştırmamıştır."},{"u":6,"q":"Kayıp develer konusunda Hz. Osman ne emretmiştir?","a":["Toplatılıp ilan edilmesini, sahibi çıkmazsa satılmasını","Kendi hâline bırakılmasını","Beytülmal’dan bakılmasını","Bulanın sahiplenmesini"],"x":"Hz. Osman kayıp develer çoğalınca toplatılıp ilan edilmesini, sahibi çıkmazsa satılmasını ve sahibi çıkarsa parasının iade edilmesini emretti; Hz. Ali döneminde Beytülmal’dan bakıldı."},{"u":6,"q":"Ribevî mallar hadisindeki ölçek ve tartının örfe bağlı olduğunu söyleyen kimdir?","a":["Ebû Yûsuf","Ebû Hanîfe","İmam Şâfiî","İbn Hacer"],"x":"Ebû Yûsuf ölçek ve tartının örfe bağlı bir husus olduğunu söyler; Ebû Hanîfe’ye göre bu mallarda ebediyyen ölçü ve tartı geçerlidir."},{"u":6,"q":"Zekâtta gümüş için 200 dirhem, altın için 20 miskal nisab belirlenmesi hakkında ne söylenmiştir?","a":["Rasulullah tek bir nisab kastetmiştir; o zaman bir dinar on dirhemdi","İki ayrı nisab ebediyyen geçerlidir","Yalnız gümüş nisabı geçerlidir","Nisab örfe bağlı değildir"],"x":"Rasulullah iki nisab değil tek bir nisab kastetmiştir; o zaman bir dinar on dirhemdi. Gümüşün değerinin aşırı düşmesi arada büyük uçurum meydana getirmiştir."},{"u":6,"q":"Diyet ödemesi Hz. Ömer döneminde kime yüklenmiştir?","a":["Divana","Katilin kendisine","Beytülmal’e","Maktulün akrabalarına"],"x":"Rasulullah döneminde kişiye bakan en yakın erkek akrabalar (âkile) olduğu için ödeme onlara yüklenmişti; Hz. Ömer döneminde divana yüklenmiştir."},{"u":6,"q":"Hadislerde değişken araç ile sabit amacın karıştırılmaması ilkesine göre misvak hadisinde kastedilen nedir?","a":["Dişleri temizlemek; asrımızda diş fırçası ve macun misvağın yerine geçebilir","Yalnızca misvak ağacının kullanılması","Misvakın yalnız namazdan önce kullanılması","Arap yarımadasındaki ağaçların korunması"],"x":"Kastedilen misvakın kendisi değildir; misvak Arap yarımadasında diş temizleme için en kolay ulaşılabilen araçtı. Asrımızda diş fırçası ve macun yerine geçebilir."},{"u":6,"q":"Ru’yet-i hilâl hadisinde amaç ve araç nedir?","a":["Amaç Ramazanın tamamını oruçlu geçirmek, araç hilâlin gözetlenmesidir","Amaç hilâli gözle görmek, araç oruçtur","Amaç bayramı erken yapmak, araç astronomidir","Amaç takvim yapmak, araç hesap bilmektir"],"x":"Amaç Ramazan ayının tamamını oruçlu geçirmek, araç hilâlin gözetlenmesidir; asrımızda vesile astronomi ilmi olmalıdır."},{"u":6,"q":"Sünnete harfiyyen sarılmanın sünnetin ruhuna aykırı düşebileceğine verilen örnek hangisidir?","a":["Fıtr sadakasının nakit olarak verilmesine şiddetle karşı çıkmak","Kayıp develerin toplatılması","Hayber arazisinin taksimi","Hurmaların aşılanması"],"x":"Ebû Hanîfe’nin fıtr sadakasının nakit bedelinin verilmesi görüşüne, Rasulullah’ın belirlediği gıdalara dayanarak şiddetle karşı çıkanlar buna örnektir."},{"u":7,"q":"“Bana en çabuk kavuşacak olanınız kolu en uzun olanınızdır” hadisinde kastedilen nedir?","a":["Hayırda ve iyilikte kolu uzun olan","Fiziken kolu en uzun olan","En uzun yaşayacak olan","En çok yolculuk yapan"],"x":"Hanımlar lafzı gerçek manada anladı, Hz. Âişe ölçmeye başladı; oysa hayırda kolu uzun olan kastedilmişti. İlk vefat eden, elleriyle çalışıp hayırda bulunan Zeynep bint Cahş’tır."},{"u":7,"q":"Siyah iplik ile beyaz iplik ayetini hakiki manasında anlayıp yastığının altına iki ip koyan sahâbî kimdir?","a":["Adiy b. Hâtim","Abdullah İbn Abbas","Abdullah b. Mes’ûd","Berâ"],"x":"Adiy b. Hâtim ayeti hakiki manada anlamış; Rasulullah “Bu ancak gecenin siyahlığının gündüzün beyazlığından ayrılmasıdır” buyurmuştur."},{"u":7,"q":"“Yürüyerek gelirse koşarak gelirim” hadis-i kudsîsinde yürüme ve koşma neyden kinayedir?","a":["Allah’ın kendisine itaat edene sevap vermekte hızlı davranmasından","Mekânda yer değiştirmekten","Kıyamet gününün hızından","Meleklerin inişinden"],"x":"Allah burada kim kendisine itaat ederse ona sevap vermekte hızlı davranacağını ifade ediyor; yürüme ve koşmayı bundan kinaye ediyor."},{"u":7,"q":"“Ölümün cennet ile cehennem arasına konulup kesilmesi” hadisi nasıl açıklanmıştır?","a":["Ölümün artık gelmeyeceğini anlatmak için mecazî bir ifade kullanılmış olabilir","Ölüm somut bir hayvana dönüşür","Hadis uydurmadır","Ölüm yalnız cehennemliklere gelir"],"x":"Ölüm mânâlardan bir mânâ ve arazlardan bir arazdır, soyuttur; burada ölümün artık gelmeyeceğini anlatmak için mecazî ifade kullanılmış olabilir."},{"u":7,"q":"“Demirden bir iğne ile dürtüklenmek helal olmayan bir kadına dokunmaktan hayırlıdır” hadisindeki “dokunma” (lems) neyden kinayedir?","a":["Cinsî birleşmeden","Tokalaşmadan","Bakmaktan","Konuşmaktan"],"x":"İbn Abbas’ın söylediği gibi lems kelimesi Kur’an’daki el-lems ve el-mülâmese ile aynı anlamda olup cinsî birleşmeden kinayedir; hadis mücerret tokalaşmanın haram olduğuna delalet etmez."},{"u":7,"q":"Mecaz kapısının kapanması, yani nassın aslî ve harfî manasında anlaşılması çağdaş kültürle yetişenler için ne sonuç doğurur?","a":["Onlara sünneti, hatta İslâm’ı anlamaktan yüz çevirtir","Onları sünnete daha çok bağlar","Tercüme hatalarını önler","Mecazî yorumlardaki aşırılığı engeller"],"x":"Mecaz kapısının kapanması çağdaş kültürle yetişen kimselere sünneti anlamaktan hatta İslâm’ı anlamaktan yüz çevirtmektir."},{"u":7,"q":"İbn Hazm’a göre “Nil ve Fırat cennettendir” hadisinde nehirler neden cennete izafe edilmiştir?","a":["Bereketli oldukları için","Kaynakları cennette olduğu için","Peygamberler kıyısında yaşadığı için","Kıyamette cennete taşınacakları için"],"x":"İbn Hazm: akıl sahibi bu nehirlerin kaynağının yerden olduğunu bilir; bereketli oldukları için cennete izafe edilmiştir, amaç faziletlerini belirtmektir."},{"u":7,"q":"Sidre ağacı hadisini yalnız Harem bölgesindeki ağaçla sınırlamak hakkında ne söylenmiştir?","a":["Büyük bir hatadır; Ebû Dâvûd gölgelik ağaçların zulmen kesilmesi diye açıklar","Doğru yorumdur","Hadis mevzu olduğu için önemsizdir","Hadis yalnız Medine’yi kapsar"],"x":"Sidre ağacını yalnız Harem bölgesiyle sınırlamak büyük hatadır; Ebû Dâvûd yolcuların ve hayvanların gölgelendiği ağaçların boş yere zulmen kesilmesi diye açıklar."},{"u":7,"q":"Aşağıdakilerden hangisi reddedilen mecazî (bâtınî) yorumlardan biridir?","a":["“Sahurda bereket vardır” hadisindeki sahuru istiğfar olarak yorumlamak","Humma hastalığının çok ateşli olduğunu söylemek","Kolu uzun olanı hayırda kolu uzun diye anlamak","Siyah ve beyaz ipliği gece ve gündüz diye anlamak"],"x":"İbarede ve metnin akışında delil olmadan yapılan bâtınî yorumlar reddedilir; sahuru istiğfar diye yorumlamak körü körüne bir zorlamadır."},{"u":7,"q":"Deccal hadislerinin batı medeniyeti olarak yorumlanması neden reddedilir?","a":["Deccalin tevatür derecesindeki hadislerde sabit vasıflarına ters düştüğü için","Deccal hadisleri mevzu olduğu için","Batı medeniyeti kör olmadığı için","Hadis mecaz içermediği için"],"x":"Bu yorum, diğer hadislerde deccal hakkında sabit olan girip-çıkma, propaganda, bozgunculuk ve tehdit gibi vasıflara ters düşer; bu konuda tevatür derecesinde hadis vardır."},{"u":7,"q":"Kur’an, hadis ve lafızdaki bütün mecazı reddeden âlim kimdir?","a":["İbn Teymiyye","İbn Hazm","İbn Hacer","İmam Nevevî"],"x":"Notta belirtildiği üzere İbn Teymiyye Kur’an, hadis ve lafızdaki bütün mecazı kabul etmemektedir."},{"u":8,"q":"Aşağıdakilerden hangisi sünnetin üzerinde durduğu gaybî konulardan biri değildir?","a":["Hurma aşılama","Kabir sorgusu","Mizan","Sırat"],"x":"Sünnet melekler, cinler, şeytanlar, arş, kürsî, levh-i mahfuz, kabir sorgusu, berzah, kıyamet alametleri, şefaat, mizan, hesap, sırat, cennet ve cehennem gibi gaybî konulara yer vermiştir."},{"u":8,"q":"Cennette süvarinin gölgesinde yüz sene gittiği ağaç hadisi karşısında takınılacak tavır nedir?","a":["Dünya ile âhiret kanunlarının bir olmadığını düşünüp “iman ettik, tasdik ettik” demek","Hadisi akla aykırı bulup reddetmek","Yüz seneyi kesin olarak dünya senesi diye hesaplamak","Hadisi mecaz sayıp yok saymak"],"x":"Hadis Buhârî ve Müslim’in ittifak ettiği bir hadistir; dünya ile Allah katındaki zaman oranını ancak Allah bilir; içten gelerek “iman ettik, tasdik ettik” denir."},{"u":8,"q":"Başarılı bir davetçinin cehennemdeki kâfirin dişi gibi hadisler karşısındaki tavrı nasıl olmalıdır?","a":["Dünya ve âhirete fayda sağlamayacak ve problem doğuracak bilgilerle meşgul olmaz","Bu hadisleri her vaazda ayrıntılı anlatır","Hadisin hakikatini ve nasıl olduğunu araştırır","Hadisi akla aykırı sayıp reddeder"],"x":"Başarılı davetçi bu tür bilgilerle meşgul olmaz; nassın getirdiğine iman edilir, hakikati ve nasıl olduğu sorulmaz, çünkü akıl bunları çoğu zaman almaktan aciz kalır."},{"u":9,"q":"Hadis tercümesi neden çok önemlidir?","a":["Tercüme mânen hadis rivâyeti mesabesindedir; yanlışı Resûl-i Ekrem’e ait olmayan bir sözün O’na nispetine yol açar","Tercümeler yalnız akademik çalışmalar içindir","Tercüme senedin sıhhatini belirler","Tercüme hadisin hükmünü değiştirir"],"x":"Hadis tercümeleri hadisleri öğrenmenin ilk adımıdır; mânen hadis rivâyeti mesabesinde olan tercümenin yanlış olması Resûl-i Ekrem’e ait olmayan bir sözün O’na nispetine yol açar."},{"u":9,"q":"İncelenen hadis tercümelerinde tespit edilen hata oranı nedir?","a":["35 hadiste bir","10 hadiste bir","100 hadiste bir","70 hadiste bir"],"x":"Yaklaşık yetmiş bin hadis tercümesi içinden yaklaşık iki bin tercüme hatası tespit edilmiştir; hata oranı 35 hadiste birdir."},{"u":9,"q":"İncelemeye göre hangi çeviriler daha başarılıdır?","a":["Hadis akademisyenlerinin yaptığı çeviriler","En eski çeviriler","En hızlı yapılan çeviriler","Bütün çeviriler aynı seviyededir"],"x":"Tercüme edilmiş tüm hadis kitaplarının aynı seviyede olduğunu söylemek mümkün değildir; hadis akademisyenlerinin yaptığı çevirilerin daha başarılı olduğu görülmüştür."},{"u":9,"q":"Kelime ve ifadelerin mânaları için başvurulması tavsiye edilen garîbu’l-hadîs eseri hangisidir?","a":["İbnü’l-Esîr’in en-Nihâye fî ğarîbi’l-hadîs’i","İbnu’l-Kayyim’in İ’lâmu’l-Muvakkı’în’i","Hâkim’in Müstedrek’i","Şâfiî’nin Risâle’si"],"x":"Kelime ve ifadelerin mânaları için İbnü’l-Esîr’in en-Nihâye fî ğarîbi’l-hadîs’ine ve basit ta’lik çalışmalarına müracaat edilmesi tavsiye edilir."},{"u":9,"q":"Aşağıdakilerden hangisi doğru tercüme için önerilen dört metoddan biri değildir?","a":["Hadisi en eski tercümeden aynen kopyalamak","Bilinmeyen kelime için garîbu’l-hadîs kaynaklarına müracaat etmek","Hadisin farklı tariklerini mukayese etmek","Hadisin geçtiği bâbın başlığıyla uyumuna dikkat etmek"],"x":"Dört metod: garîbu’l-hadîs kaynakları, farklı tariklerin mukayesesi, bâb başlığıyla uyum, ihtiyaç halinde hadis şerhleri."},{"u":9,"q":"Türkçede doğru tercüme için mukayese kaynağı olarak örnek gösterilen tercüme hangisidir?","a":["Mehmet Sofuoğlu’nun Buhârî tercümesi","A. Davudoğlu’nun Müslim tercümesi","Komisyonun Ebû Dâvûd tercümesi","sunnah.com’daki İngilizce tercüme"],"x":"Türkçede, hatalı bazı çeviriler içermesine rağmen Mehmet Sofuoğlu’nun Buhârî tercümesi gibi kaynaklarla mukayese yapılarak ilk planda fikir sahibi olunabilir."},{"u":10,"q":"Bütün bir kitabı baştan sona çevirmenin ciddi risklerine işaret eden kimdir?","a":["Tayyib Okiç","Lord Woodhouslee","Mehmet Sofuoğlu","Abdullah b. el-Mübarek"],"x":"Merhum Tayyib Okiç’in işaret ettiği üzere bütün bir kitabı yeterli şerh veya izah yapmadan baştan sona çevirmenin ciddi riskleri vardır."},{"u":10,"q":"Hadislerde geçen garip kelimeler için nereye başvurulmalıdır?","a":["Garibü’l-hadis türündeki hadis sözlüklerine","Normal Arapça sözlüklere","Yalnızca Türkçe sözlüklere","İngilizce tercümelere"],"x":"Garip kelimeler için normal Arapça sözlüklere değil, mutlaka Garibü’l-hadis türündeki hadis sözlüklerine, hatta el-Halîl b. Ahmed’in Kitâbü’l-Ayn’ı gibi en eski eserlere başvurulmalıdır."},{"u":10,"q":"«الدين النصيحة» hadisindeki “en-nasiha” nasıl çevrilmelidir?","a":["İçten-özden bağlılık ve samimiyet","Öğüt verme","Doğru söyleme","Uyarı ve korkutma"],"x":"“En-nasiha” kavramının “nasihat” diye çevrilmesi yaygın bir yanılgıdır; Hz. Peygamber’in dilinde “içten-özden bağlılık ve samimiyet” diye çevrilmelidir."},{"u":10,"q":"Borcunu geciktirenin “ırz”ının helal olması ifadesindeki “ırz” ne anlama gelir?","a":["Borçlunun onur ve haysiyeti","Borçlunun malı","Borçlunun ailesi","Borçlunun canı"],"x":"Abdullah b. el-Mübarek’in açıklamasına göre bu, alacaklının borçluya ağır ifadelerle sataşmasına yol vermektir; ırz ile borçlunun onur ve haysiyeti kastedilir."},{"u":10,"q":"«ما من داء إلا في الحبة السوداء شفاء إلا السام» hadisi için hangi çeviri daha sade ve anlaşılır bulunmuştur?","a":["“Çörek otunda ölüm dışında her derde şifa vardır.”","“Hiçbir dert yoktur ki, çörek otunda ona şifa bulunmasın, yalnız ölüm müstesna!”","“Siyah tohumda dertten başka şifa yoktur.”","“Ölüm dahil her derdin şifası çörek otundadır.”"],"x":"Tekid ve istisna kalıplarını “… yoktur ki, şöyle olmasın” şeklinde çevirmek anlamayı zorlaştırır; “Çörek otunda ölüm dışında her derde şifa vardır” daha kısa ve açıktır."},{"u":10,"q":"«وبطنه معصوب بحجر» ifadesi Hüzeyl lügatinde neyden kinaye bir deyimdir?","a":["Aşırı açlıktan","Yaralanmaktan","Yorgunluktan","Hastalıktan"],"x":"Bu ifade Hüzeyl Kabilesi’nin lügatinde bir deyimdir ve aşırı açlıktan kinayedir; deyimler harfî çevrilmemeli, dilimizdeki karşılığı verilmelidir."},{"u":10,"q":"Çeviride mütercimin metinde olmayan bir açıklama vermesi gerekirse nasıl yapmalıdır?","a":["Parantez ya da dipnot düşerek","Açıklamayı metnin içine katarak","Açıklamayı hiç yapmayarak","Arapça metni değiştirerek"],"x":"Metinde olmayan bir mana veya yorum çeviriye katılmamalı; açıklama verilecekse parantez ya da dipnotla verilmelidir, çünkü Arapça bilmeyen okuyucu asıl metinle yorumu ayırt edemez."},{"u":10,"q":"Pergel örneğine göre günümüz müterciminin görevi nedir?","a":["Bir ayak metinde, öbür ayak okurda olacak şekilde anlamı okuyucunun zihnine ulaştırmak","Pergelin bir ayağını metne sabitleyip metnin etrafında dönmek","Yalnız lafzı yansıtmak","Metni kendi yorumuyla değiştirmek"],"x":"Pergelin bir ayağı metnin üzerinde, öbür ayağı okuyucunun zihnine kadar açılmalıdır; mütercim metin ile okuyucu arasında anlamı ileten bir iletkendir."},{"u":10,"q":"Lord Woodhouslee’nin tercüme için koyduğu üç prensipten biri hangisidir?","a":["Bir tercüme telif kadar kolay okunabilmelidir","Tercüme kelimesi kelimesine yapılmalıdır","Tercüme okura değil yazara yönelmelidir","Tercümede üslûp önemli değildir"],"x":"Üç prensip: aslındaki fikirleri tam ve eksiksiz vermek, üslûp ve tarzın aslınınki ile aynı vasıfta olması, telif kadar kolay okunabilmek."},{"u":10,"q":"Eşdeğerci yaklaşımın özelliği hangisidir?","a":["Yazara sadıktır, kaynak metne yöneliktir","Okura sadıktır, erek metne yöneliktir","Çevirmen daha görünürdür","Irmaklardan geçmek için köprüler kurar"],"x":"Eşdeğerci yaklaşım yazara sadıktır, çevirmen görünmez, kaynak metne yöneliktir; işlevselci yaklaşım okura sadık, erek metne yönelik olup köprüler kurar."},{"u":10,"q":"İşlevselci yaklaşıma yöneltilen eleştiri ve buna verilen cevap nedir?","a":["Kaynak metni tahrif edebileceği eleştirilir; oysa savunucuları yanlış çeviriyi onaylamaz, çevirmene ağır sorumluluk yükler","Okuru ihmal ettiği eleştirilir; oysa okura sadıktır","Fazla lafzî olduğu eleştirilir; oysa serbesttir","Çevirmeni görünmez kıldığı eleştirilir; oysa aktiftir"],"x":"İşlevselci yaklaşım kaynak metni tahrif edebileceği gerekçesiyle eleştirilmiştir; bu gerekçe doğru değildir, savunucularından hiçbiri yanlış çeviriyi onaylamaz."}];

<script>
/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[’'ʿʾ‘`"]/g, '').replace(/ı/g, 'i').replace(/[^a-z0-9؀-ۿ ]/g, ' ').replace(/\s+/g, ' ').trim();
const strip = h => String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/\*\*/g, '').replace(/[«»]/g, '').replace(/\[\[|\]\]/g, '');
// Metin biçimi: **kalın**, «Arapça»
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/«([^»]+)»/g, (m, a) => /[؀-ۿ]/.test(a) ? `<span class="ar" dir="rtl" lang="ar">${a}</span>` : `«${a}»`)
    .replace(/\[\[(.+?)\]\]/g, '<span class="ek" title="Ek · onay bekliyor">$1</span>');
}

/* ---------- kalıcı durum (tarayıcıda, ön ek: hay_) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('hay_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hay_' + k, JSON.stringify(v)); } catch (e) {} }
};
let stats = store.get('stats', {});   // anahtar -> {ok, bad}
let boxes = store.get('boxes', {});   // tanım id -> kutu 1..5
let oral  = store.get('oral', {});    // bölüm anahtarı -> 1/0
let uStat = store.get('units', {});   // ünite -> en iyi mini test (0-5)
function record(key, ok) { const s = stats[key] || {ok: 0, bad: 0}; ok ? s.ok++ : s.bad++; stats[key] = s; store.set('stats', stats); ozet(true); }
/* ---------- Giray Akademi özeti (alt çubuk · Karnem) ---------- */
const YAD = {home: 'Ana sayfa', study: 'Üniteler', quiz: 'Test', match: 'Kişi eşleştirme', flash: 'Kavram kartları', oralView: 'Konu tekrarı', review: 'Hızlı tekrar', exam: 'Geçmiş sınav soruları', browse: 'Sözlük', progress: 'İlerlemem'};
function yer() {
  const v = curView, a = curArg;
  if (v === 'unitView') return {ad: (a + 1) + '. ünite', url: '/hadis_anlam_ve_yorum/#unitView-' + a};
  if (v === 'quiz' && a && a.unit !== undefined && a.unit !== null) return {ad: (a.unit + 1) + '. ünite testi', url: '/hadis_anlam_ve_yorum/#unitView-' + a.unit};
  if (v === 'quiz' || v === 'home') return {ad: YAD[v], url: '/hadis_anlam_ve_yorum/'};
  return {ad: YAD[v] || 'Ana sayfa', url: '/hadis_anlam_ve_yorum/#' + v};
}
function ozet(aktif) {
  if (typeof gaOzet !== 'function') return;
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const n = UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;
  gaOzet({bitti: n / UNITELER.length, etiket: n + '/' + UNITELER.length + ' ünite', d: tot.ok, y: tot.bad, kart: Object.values(boxes).filter(b => b >= 4).length, yer: yer(), aktif: !!aktif});
}
function alt(b) { if (typeof gaAltGizle === 'function') gaAltGizle(b); }

/* ---------- veri hazırlığı ---------- */
const TANIM = [], BOLUM = [];
UNITELER.forEach((u, ui) => u.s.forEach((s, si) => {
  BOLUM.push({u: ui, s: si, h: s.h});
  s.b.forEach(b => {
    if (b.k === 'd') TANIM.push({id: TANIM.length, u: ui, s: si, t: b.t, x: b.x});
    // İki sütunlu "… | Tanım/Anlamı" tabloları da kavram kartı olur
    if (b.k === 'tbl' && b.r[0].length === 2 && /^(Tanım|Anlamı)$/.test(b.r[0][1])) b.r.slice(1).forEach(r => TANIM.push({id: TANIM.length, u: ui, s: si, t: r[0].replace(/\*\*/g, '').replace(/^\d+\.\s*/, ''), x: r[1]}));
  });
}));
const ESER = ESER_T;
// Aynı adla birden çok müellife bağlanan eserler (el-Burhân, Mebâhis, Tefsir Usûlü…) ve bir müellifin birden çok eseri tek sorudan fazla üretilmez
const eserSay = {}; ESER.forEach(r => { const k = norm(r.e); (eserSay[k] ||= new Set()).add(norm(r.m)); });
const ESER_Q = ESER.filter(r => eserSay[norm(r.e)].size === 1 && !/[,;]/.test(r.e)).filter((r, i, a) => a.findIndex(x => norm(x.e) === norm(r.e)) === i);
ESER_Q.forEach((r, i) => r.id = i);
const GECME = 4;
const uDone = () => UNITELER.filter((u, i) => (uStat[i] || 0) >= GECME).length;

/* ---------- soru üretici ---------- */
// Havuz öğesi: {key, u, make()}
const maskTerm = (x, t) => {
  let out = x;
  t.replace(/\(.*?\)/g, '').split(/[\s\-–]+/).filter(w => w.length > 3 && !/^(kur'an|kuran|ayet|âyet)$/i.test(w)).forEach(w => {
    out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
  });
  return out;
};
function pickDistinct(cands, n, keyFn, exclude) {
  const seen = new Set(exclude.map(keyFn)), out = [];
  for (const c of cands) { const k = keyFn(c); if (!seen.has(k)) { seen.add(k); out.push(c); if (out.length === n) break; } }
  return out;
}
const nearFirst = (list, u) => [...shuffle(list.filter(x => x.u === u)), ...shuffle(list.filter(x => Math.abs(x.u - u) <= 2 && x.u !== u)), ...shuffle(list.filter(x => Math.abs(x.u - u) > 2))];
function qTanim(d) {
  const tersi = Math.random() < 0.65;
  const fk = x => norm(x.t);
  if (tersi) {   // tanımı göster, kavramı sor
    const metin = maskTerm(d.x, d.t);
    const cands = nearFirst(TANIM.filter(x => x.id !== d.id && !norm(d.x).includes(norm(x.t))), d.u);
    const dis = pickDistinct(cands, 3, fk, [d]);
    return {key: 'd:' + d.id, u: d.u, s: d.s, long: true, soru: `<small>Aşağıdaki tanım hangi kavrama aittir?</small>${fmt(metin)}`, dogru: d.t, sec: shuffle([d.t, ...dis.map(x => x.t)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
  }
  const cands = nearFirst(TANIM.filter(x => x.id !== d.id && norm(x.x) !== norm(d.x)), d.u);
  const dis = pickDistinct(cands, 3, x => norm(x.x).slice(0, 60), [d]);
  const kisalt = x => plain(maskTerm(x.x, x.t));
  return {key: 'd:' + d.id, u: d.u, s: d.s, soru: `<small>Hangisi bu kavramın tanımıdır?</small><em>${fmt(d.t)}</em>`, dogru: kisalt(d), sec: shuffle([kisalt(d), ...dis.map(kisalt)]), aciklama: `<b>${fmt(d.t)}:</b> ${fmt(d.x)}`};
}
function qEser(r) {
  const cands = nearFirst(ESER.filter(x => norm(x.m) !== norm(r.m)), r.u);
  const dis = pickDistinct(cands, 3, x => norm(x.m), [r]);
  return {key: 'e:' + r.id, u: r.u, s: r.s, soru: `<em>${fmt(r.e)}</em> kimdir?`, dogru: r.m, sec: shuffle([r.m, ...dis.map(x => x.m)]), aciklama: `<b>${fmt(r.e)}</b> → ${fmt(r.m)}`};
}
function qEl(i) {
  const q = SORULAR[i];
  return {key: 'q:' + i, u: q.u, soru: fmt(q.q), dogru: q.a[0], sec: shuffle(q.a), aciklama: fmt(q.x)};
}
const HAVUZ = [
  ...SORULAR.map((q, i) => ({key: 'q:' + i, u: q.u, make: () => qEl(i)})),
  ...TANIM.map(d => ({key: 'd:' + d.id, u: d.u, make: () => qTanim(d)})),
  ...ESER_Q.map(r => ({key: 'e:' + r.id, u: r.u, make: () => qEser(r)}))
];
function weightedPick(list, n) {
  const w = list.map(x => { const s = stats[x.key]; return s ? 1 + s.bad * 2 - s.ok * .5 : 1.5; });
  const out = [], used = new Set();
  while (out.length < Math.min(n, list.length)) {
    let tot = 0; list.forEach((x, i) => { if (!used.has(i)) tot += Math.max(w[i], .2); });
    let rnd = Math.random() * tot;
    for (let i = 0; i < list.length; i++) { if (used.has(i)) continue; rnd -= Math.max(w[i], .2); if (rnd <= 0) { used.add(i); out.push(list[i]); break; } }
  }
  return out;
}

/* ---------- yönlendirme ---------- */
const VIEWS = () => ({home, quiz, match, flash, oralView, review, browse, progress, study, unitView, exam});
let curView = 'home', curArg = null;
const navStack = [{view: 'home', arg: null}];
let pendingFocus = null;
function render(view, arg) {
  curView = view; curArg = arg ?? null;
  window.scrollTo(0, 0);
  VIEWS()[view](arg ?? undefined);
  ozet(false); alt(view === 'quiz' && !!(typeof Q !== 'undefined' && Q && Q.list && Q.list.length));
  if (pendingFocus) { const f = pendingFocus; pendingFocus = null; setTimeout(() => focusHit(f), 30); }
}
function go(view, arg) {
  const d = (history.state && history.state.d) || 0;
  const st = {view, arg: arg === undefined ? null : arg};
  if (curView === 'quiz' && view !== 'quiz') { st.d = d; navStack[d] = st; try { history.replaceState(st, ''); } catch (e) {} }
  else { st.d = d + 1; navStack.length = d + 1; navStack.push(st); try { history.pushState(st, ''); } catch (e) {} }
  render(view, arg);
}
function goUp(view, arg = null) {
  const d = (history.state && history.state.d) || 0, key = JSON.stringify(arg);
  for (let k = d - 1; k >= 0; k--) {
    const e = navStack[k];
    if (e && e.view === view && JSON.stringify(e.arg ?? null) === key) { try { history.go(k - d); return; } catch (er) { break; } }
  }
  go(view, arg ?? undefined);
}
function goBack() {
  if (curView === 'unitView') goUp('study');
  else if (curView === 'quiz' && curArg && curArg.unit !== undefined) goUp('unitView', curArg.unit);
  else goUp('home');
}
window.addEventListener('popstate', e => {
  if ($('#sov').classList.contains('open')) { closeSearch(true); return; }
  const st = e.state || {view: 'home', arg: null};
  if (st.search) { try { history.back(); } catch (er) {} return; }
  render(st.view, st.arg);
});

/* ---------- ana sayfa ---------- */
const modeCard = (v, i, t, d) => `<button class="mode" onclick="go('${v}')"><div class="ico">${i}</div><h3>${t}</h3><p>${d}</p></button>`;
function home() {
  const tot = Object.values(stats).reduce((a, s) => ({ok: a.ok + s.ok, bad: a.bad + s.bad}), {ok: 0, bad: 0});
  const oran = tot.ok + tot.bad ? '%' + Math.round(100 * tot.ok / (tot.ok + tot.bad)) : '—';
  $('#app').innerHTML = `
  <section class="hero">
    <h1>Hadis Anlam ve Yorum</h1>
    <div class="arn"><span lang="ar" dir="rtl">فقه الحديث</span></div>
    <p class="lead">Hadiste metin tenkidinden ihtilâfu’l-hadise, Kur’an bütünlüğü, esbâb-ı vürûd, hakikat–mecaz ve gaybî konulara, hadis tercümesinin esaslarına kadar ünite ünite konu anlatımı, tablolar, kavram kartları ve açıklamalı testler.</p>
    <div class="stats">
      <div class="stat"><b>${UNITELER.length}</b><span>ünite</span></div>
      <div class="stat"><b>${TANIM.length}</b><span>kavram</span></div>
      <div class="stat"><b>${HAVUZ.length}</b><span>soru</span></div>
      <div class="stat"><b>${oran}</b><span>başarı oranın</span></div>
    </div>
  </section>
  <details class="how" ${store.get('howClosed', false) ? '' : 'open'} ontoggle="store.set('howClosed', !this.open)">
    <summary>Nasıl çalışır?</summary>
    <ol class="steps">
      <li><b>Önce “Çalış” ile öğren.</b> Yeşil düğmeden üniteleri sırayla aç. Tablolar karşılaştırmayı, renkli kutular önemli noktaları gösterir. Ünitenin sonundaki <i>Hızlı tekrar</i> kutusunu oku, sonra 5 soruluk mini testi çöz. 4 doğru yaparsan ünite ✓ alır.</li>
      <li><b>Kavramları ezberle.</b> <i>Kavram kartları</i>'nda kartın önünde kavram, arkasında tanımı var. Bilemediğin kartlar sonraki destelerde daha sık gelir.</li>
      <li><b>Pekiştir.</b> <i>Test</i> bütün ünitelerden karışık sorular sorar; her cevaptan sonra açıklama gelir. <i>Kişi eşleştirme</i>'de görüşleri ve ifadeleri ilgili âlimlerle eşleştirirsin.</li>
      <li><b>Sınava hazırlan.</b> <i>Hızlı tekrar</i> bütün ünitelerin özünü tek sayfada verir. <i>Konu tekrarı</i> bir bölüm başlığı gösterir; önce kendin anlat, sonra içeriği aç.${SINAV.length ? " <i>Geçmiş sınav soruları</i>'nda önce kendin cevapla, sonra <b>Cevabı göster</b>'e dokun." : ''}</li>
      <li><b>Takip et.</b> <i>İlerlemem</i> ünite bazında başarını ve en çok karıştırdıklarını gösterir. Üstteki <b>🔍</b> bütün konu anlatımlarında arar.</li>

/* ---------- çalış ---------- */
function unitItems(i) { return HAVUZ.filter(x => x.u === i); }
function study() {

  <h2 style="margin-top:22px">Çalış</h2>

  ${ilkEksik >= 0 ? `<div class="actions" style="justify-content:flex-start"><button class="btn" onclick="go('unitView',${ilkEksik})">Kaldığım yerden devam et →</button></div>` : ''}
  <div class="ulist" style="margin-top:16px">${UNITELER.map((u, i) => { const ok = (uStat[i] || 0) >= GECME;
    const nT = TANIM.filter(d => d.u === i).length;
    return `<button class="unit ${ok ? 'done' : i === ilkEksik ? 'next' : ''}" onclick="go('unitView',${i})"><span class="st">${ok ? '✓' : i + 1}</span><span class="ut"><b>${esc(u.t)}</b><small>${u.s.length} bölüm · ${nT} kavram · ${unitItems(i).length} soru${uStat[i] !== undefined ? ` · en iyi: ${uStat[i]}/5` : ''}</small></span><span style="color:var(--muted)">›</span></button>`; }).join('')}</div>`;
}
function tblHTML(r) {
  const bos = r[0][0] === '';
  const st = r[0].length >= 3, lb = i => esc(plain(r[0][i] || ''));
  return `<div class="tw${st ? ' tws' : ''}"><table class="tbl${bos ? ' cmp' : ''}${st ? ' st' : ''}"><thead><tr>${r[0].map(c => `<th>${fmt(c)}</th>`).join('')}</tr></thead><tbody>${r.slice(1).map(row => `<tr>${row.map((c, i) => i === 0 ? `<th scope="row">${fmt(c)}</th>` : `<td${st && r[0][i] ? ` data-l="${lb(i)}"` : ''}${c === '' || c === '—' ? ' class="bos"' : ''}>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function blockHTML(b) {
  if (b.k === 'h') return `<h4>${fmt(b.x)}</h4>`;
  if (b.k === 'h5') return `<h5>${fmt(b.x)}</h5>`;
  if (b.k === 'not') return `<div class="box bn"><b class="lb">Not</b>${fmt(b.x)}</div>`;
  if (b.k === 'dikkat') return `<div class="box bk"><b class="lb">Dikkat</b>${fmt(b.x)}</div>`;
  if (b.k === 'ek') return `<div class="box bek"><b class="lb">Ek · onay bekliyor</b>${fmt(b.x)}</div>`;
  if (b.k === 'ornek') return `<div class="box bo"><b class="lb">Örnek</b>${fmt(b.x)}</div>`;
  if (b.k === 'sc') { const m1 = b.q.match(/^(Hadis-i Kudsî|Hadis|Ayet|Örnek|Soru): /), m2 = b.x.match(/^(Cevap|Açıklama): /); const q = m1 ? b.q.slice(m1[0].length) : b.q, x = m2 ? b.x.slice(m2[0].length) : b.x; return `<div class="box bs"><b class="lb">${m1 ? m1[1] : 'Soru'}</b><p class="sq">${fmt(q)}</p><p class="sa"><b>${m2 ? m2[1] : 'Cevap'}:</b> ${fmt(x)}</p></div>`; }
  if (b.k === 'ar') return `<div class="arb"><span class="ayet" lang="ar" dir="rtl">${esc(b.a).replace(/\[\[(.+?)\]\]/g, '<span class="ek">$1</span>')}</span>${b.x ? `<span class="meal">${fmt(b.x)}</span>` : ''}</div>`;
  if (b.k === 'tbl') return tblHTML(b.r);
  if (b.k === 'steps') return `<ol class="stp">${b.x.map(x => `<li>${fmt(x)}</li>`).join('')}</ol>`;
  if (b.k === 'd') return `<dl class="def"><dt>${fmt(b.t)}</dt><dd>${fmt(b.x)}</dd></dl>`;
  if (b.k === 'n') return `<p class="num"><span class="nn">${b.n}.</span>${fmt(b.x)}</p>`;
  if (b.k === 'p') return `<p>${fmt(b.x)}</p>`;
  return `<p class="li">${fmt(b.x)}</p>`;
}
function htHTML(i, acik) {
  const u = UNITELER[i];
  if (!u.ht.length) return '';
  return `<details class="ht" ${acik ? 'open' : ''}><summary><span class="hti">☑</span>Hızlı tekrar<small>${u.ht.length} madde · sınavdan önce bir bakış</small></summary><ul>${u.ht.map(h => `<li>${fmt(h.x)}${h.s >= 0 ? ` <button class="htl" onclick="toSection(${i},${h.s})" title="Bölüme git">›</button>` : ''}</li>`).join('')}</ul></details>`;
}
function unitView(i) {
  const u = UNITELER[i], ok = (uStat[i] || 0) >= GECME;
  const kelime = u.s.reduce((t, s) => t + s.b.reduce((a, b) => a + bTxt(b).split(/\s+/).length, 0), 0) + u.ht.length * 15;
  $('#app').innerHTML = `
  <button class="backlink" onclick="goUp('study')">‹ Ünitelere dön</button>
  <div class="bar" style="margin-top:6px"><span class="count">Ünite ${i + 1}/${UNITELER.length} · yaklaşık ${Math.max(2, Math.round(kelime / 180))} dk okuma</span><div class="spacer"></div>${ok ? '<span class="tag" style="margin:0;background:var(--green-soft);color:var(--green)">✓ Tamamlandı</span>' : ''}</div>
  <h2>${esc(u.t)}</h2>
  <p class="intro">${esc(u.intro)}</p>
  ${u.s.length > 3 ? `<div class="toc">${u.s.map((s, k) => `<button onclick="jump('ls-${i}-${k}')">${esc(s.h)}</button>`).join('')}</div>` : ''}
  <div class="lesson">
    ${u.s.map((s, k) => `<section class="ls" id="ls-${i}-${k}"><h3><span class="no">${k + 1}</span>${fmt(s.h)}${bldButton('b:' + i + '-' + k, 'Ünite ' + (i + 1) + ' · ' + u.t, s.h)}</h3>${s.b.map(blockHTML).join('')}</section>`).join('')}
  </div>
  ${htHTML(i, true)}
  <div class="actions" style="justify-content:space-between;margin-top:10px">
    ${i > 0 ? `<button class="btn sec" onclick="go('unitView',${i - 1})">‹ Önceki ünite</button>` : '<span></span>'}
    ${i + 1 < UNITELER.length ? `<button class="btn sec" onclick="go('unitView',${i + 1})">Sonraki ünite ›</button>` : ''}
  </div>
  <div class="sticky-go"><button class="btn" onclick="go('quiz',{unit:${i}})">Okudum, mini teste geç →</button></div>`;

function jump(id) { const el = document.getElementById(id); if (el) { el.scrollIntoView({behavior: 'smooth', block: 'start'}); el.classList.remove('flash-target'); void el.offsetWidth; el.classList.add('flash-target'); } }

/* ---------- test ---------- */
let Q = null;
function quiz(opts = {}) {
  opts = opts || {};
  let kaynak = HAVUZ, adet = opts.adet || 10;
  let ek = [];
  if (opts.unit !== undefined && opts.unit !== null) {
    kaynak = unitItems(opts.unit); adet = 5;
  }
  if (opts.keys) { kaynak = HAVUZ.filter(x => opts.keys.includes(x.key)); adet = opts.keys.length; }
  Q = {list: shuffle([...ek, ...weightedPick(kaynak, adet)]).map(x => x.make()), i: 0, dogru: 0, yanlis: [], unit: opts.unit};
  if (!Q.list.length) { $('#app').innerHTML = '<p class="empty">Bu seçimde soru yok.</p>'; return; }
  renderQ();
}
function renderQ() {
  const q = Q.list[Q.i];
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * Q.i / Q.list.length}%"></i></div><span class="count">${Q.i + 1} / ${Q.list.length}</span></div>
  <div class="card">
    <div class="cardhead"><span class="tag">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].t)}</span>${bldButton(q.key, 'Test · Ünite ' + (q.u + 1) + ' · ' + UNITELER[q.u].t, strip(q.soru) + ' | Doğru cevap: ' + plain(q.dogru))}</div>
    <div class="q${q.long ? ' long' : ''}">${q.soru}</div>
    <div class="opts">${q.sec.map((s, i) => `<button class="opt" data-i="${i}" onclick="answer(this)"><span class="k">${'ABCD'[i]}</span><span>${fmt(s)}</span></button>`).join('')}</div>
    <div class="explain" id="exp"></div>
    <div class="actions"><button class="btn" id="next" disabled onclick="nextQ()">${Q.i + 1 < Q.list.length ? 'Sonraki →' : 'Sonucu gör'}</button></div>
  </div>`;
}
function answer(el) {
  const q = Q.list[Q.i], secilen = q.sec[+el.dataset.i], ok = secilen === q.dogru;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (q.sec[+b.dataset.i] === q.dogru) b.classList.add('ok'); });
  if (!ok) el.classList.add('bad');
  ok ? Q.dogru++ : Q.yanlis.push(q);
  record(q.key, ok);
  const yer = q.s !== undefined ? `<span class="src">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].s[q.s].h)}</span>` : `<span class="src">Ünite ${q.u + 1} · ${esc(UNITELER[q.u].t)}</span>`;
  $('#exp').innerHTML = `<b>${ok ? 'Doğru.' : 'Yanlış.'}</b> ${q.aciklama}${yer}`;
  $('#exp').classList.add('show');
  $('#next').disabled = false; $('#next').focus();
}
function nextQ() { Q.i++; Q.i < Q.list.length ? renderQ() : quizEnd(); }
function wrongList() {
  const satir = q => q.key[0] === 'q'
    ? `<div class="row"><div class="n" style="color:var(--muted)">${q.soru}</div><div class="n"><b>Doğru cevap:</b> ${fmt(q.dogru)}</div><div class="w">${q.aciklama}</div></div>`
    : `<div class="row"><div class="n">${q.aciklama}</div></div>`;
  return Q.yanlis.length ? `<div class="section-title" style="text-align:left">Yanlış yaptıkların</div><div class="list" style="text-align:left">${Q.yanlis.map(satir).join('')}</div>` : '';
}
function quizEnd() {
  alt(false);
  const n = Q.list.length, p = Math.round(100 * Q.dogru / n);
  if (Q.unit !== undefined && Q.unit !== null) {
    const i = Q.unit, gecti = Q.dogru >= GECME;
    uStat[i] = Math.max(uStat[i] || 0, Q.dogru); store.set('units', uStat);
    const sonraki = i + 1 < UNITELER.length ? i + 1 : null;
    $('#app').innerHTML = `
    <div class="card result" style="margin-top:24px">
      <div class="big">${Q.dogru}/${n}</div>
      <p class="lead">${gecti ? '✓ Üniteyi tamamladın.' : `Geçmek için en az ${GECME} doğru gerekiyor. Üniteyi bir kez daha okuyup tekrar dene.`}</p>
      ${wrongList()}
      <div class="actions" style="justify-content:center">
        <button class="btn sec" onclick="go('study')">Ünite listesi</button>
        <button class="btn sec" onclick="go('unitView',${i})">Üniteye dön</button>
        ${gecti && sonraki !== null ? `<button class="btn" onclick="go('unitView',${sonraki})">Sonraki ünite →</button>` : `<button class="btn" onclick="quiz({unit:${i}})">Tekrar dene</button>`}
      </div>
    </div>`;
    return;
  }
  const keys = Q.yanlis.map(q => q.key);
  $('#app').innerHTML = `
  <div class="card result" style="margin-top:24px">
    <div class="big">${Q.dogru}/${n}</div>
    <p class="lead">%${p} başarı · ${p >= 80 ? 'Çok iyi gidiyorsun.' : p >= 50 ? 'Fena değil, yanlışları tekrar et.' : 'Bu konulara biraz daha çalışmak gerekiyor.'}</p>
    ${wrongList()}
    <div class="actions" style="justify-content:center">
      ${keys.length ? `<button class="btn sec" onclick='quiz({keys:${JSON.stringify(keys)}})'>Yanlışları tekrar et</button>` : ''}

    </div>
  </div>`;
}

/* ---------- eşleştirme ---------- */
let M = null;
function match() {
  const list = [], mu = new Set();
  for (const r of shuffle(ESER_Q)) { const k = norm(r.m); if (!mu.has(k)) { mu.add(k); list.push(r); } if (list.length === 5) break; }
  M = {list, left: shuffle(list), right: shuffle(list), sel: null, done: new Set(), hata: 0, t0: Date.now()};
  renderM();
}
function renderM() {
  $('#app').innerHTML = `
  <div class="bar"><div class="progress"><i style="width:${100 * M.done.size / M.list.length}%"></i></div><span class="count">${M.done.size} / ${M.list.length} · ${M.hata} hata</span></div>
  <p class="lead" style="margin-bottom:12px">Soldan bir ifade seç, sonra sağdan ilgili kişiye dokun.</p>
  <div class="match">
    <div class="col"><h4>Görüş / ifade</h4>${M.left.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : M.sel === r.id ? 'sel' : ''}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mSel(${r.id})">${fmt(r.e)}</button>`).join('')}</div>
    <div class="col"><h4>Kişi</h4>${M.right.map(r => `<button class="tile ${M.done.has(r.id) ? 'done' : ''}" id="mr-${r.id}" ${M.done.has(r.id) ? 'disabled' : ''} onclick="mPick(${r.id})">${fmt(r.m)}</button>`).join('')}</div>
  </div>`;
}
function mSel(id) { M.sel = id; renderM(); }
function mPick(id) {
  if (M.sel === null) return;
  if (M.sel === id) { M.done.add(id); record('e:' + id, true); M.sel = null; renderM(); if (M.done.size === M.list.length) mEnd(); }
  else { M.hata++; record('e:' + M.sel, false); const el = $('#mr-' + id); el.classList.add('wrong'); setTimeout(() => { el.classList.remove('wrong'); $('#app .bar .count').textContent = `${M.done.size} / ${M.list.length} · ${M.hata} hata`; }, 320); }
}
function mEnd() {
  const sn = Math.round((Date.now() - M.t0) / 1000);
  $('#app').innerHTML = `<div class="card result" style="margin-top:24px"><div class="big">✓</div><p class="lead">${sn} saniyede, ${M.hata} hatayla bitirdin.</p>
  <div class="list" style="text-align:left;margin-top:18px">${M.list.map(r => `<div class="row"><div class="e">${fmt(r.e)}</div><div class="n">${fmt(r.m)} · <span style="color:var(--muted)">Ünite ${r.u + 1}</span></div></div>`).join('')}</div>
  <div class="actions" style="justify-content:center"><button class="btn" onclick="match()">Yeni tur</button></div></div>`;
}

/* ---------- kavram kartları (Leitner) ---------- */
let F = null;
function flash(u) {
  const fu = (u === undefined || u === null) ? store.get('flashU', -1) : u;
  store.set('flashU', fu);
  const list = fu >= 0 ? TANIM.filter(d => d.u === fu) : TANIM;
  const sirali = shuffle(list).sort((a, b) => (boxes[a.id] || 0) - (boxes[b.id] || 0)).slice(0, 20);

}
function unitSelect(cur, fn) {
  return `<select class="select" onchange="${fn}(+this.value)"><option value="-1">Bütün üniteler</option>${UNITELER.map((u, i) => `<option value="${i}" ${cur === i ? 'selected' : ''}>${i + 1}. ${esc(u.t)}</option>`).join('')}</select>`;
}
function renderF() {
  const d = F.list[F.i], kutu = boxes[d.id] || 0;
  $('#app').innerHTML = `
  <div class="rowctl">${unitSelect(F.u, 'flash')}</div>
  <div class="bar"><div class="progress"><i style="width:${100 * F.i / F.list.length}%"></i></div><span class="count">${F.i + 1} / ${F.list.length}</span></div>
  <div class="flash" onclick="this.classList.toggle('flip')"><div class="flash-in">
    <div class="face"><span class="tag">Ünite ${d.u + 1}</span><div class="t">${fmt(d.t)}</div><div class="s" style="color:var(--muted)">Tanımı nedir?</div><div class="hint">Çevirmek için dokun · kutu ${kutu}/5</div></div>

  </div></div>

  </div>
  <div style="text-align:center;margin-top:10px">${bldButton('d:' + d.id, 'Kavram kartı · Ünite ' + (d.u + 1) + ' · ' + UNITELER[d.u].s[d.s].h, plain(d.t) + ': ' + plain(d.x))}</div>`;
}
function fAns(ok) {

}

/* ---------- konu tekrarı ---------- */
let O = null;
const bKey = b => b.u + '-' + b.s;

  $('#app').innerHTML = `
