racıdır; hadislerin ilim kriterine vurulması genelde isabetli görülür."},{"s":8,"x":"Kesin olarak bilinen tarihî gerçeklere aykırı hadis uydurmadır: “Mushafa bak” rivâyeti (Hz. Peygamber devrinde mushaf yoktu), mi’râcda cennet meyvesi ve Hz. Fâtıma rivâyeti."},{"s":9,"x":"Umûm-u belvâda tek kişinin rivâyeti: bazı hadisçiler ve Hanefîler makbul saymaz. Hanefîlere göre böyle bir rivâyet ya mensuhtur (râvînin haberi yoktur) ya da uydurmadır."},{"s":9,"x":"Hatîb Bağdâdî: büyük ve önemli bir olayı bir kişiden başka nakleden yoksa habere güvenilmez."},{"s":10,"x":"Hanefîlere göre hadisi delil olmaktan düşüren dört tutum: râvînin rivâyetini inkârı, aksine amel/fetvâsı, hadisi yorumlaması ya da bir manayı tercihi, hadisle amel etmemesi (terku’l-amel bi’l-hadîs)."},{"s":11,"x":"Hadislerle çok meşgul olmak sahîhi ayırma kabiliyeti kazandırır. İbnu’l-Kayyim: sahîh hadisleri hazmetmiş olan, senede bakmadan mevzuyu tanır."},{"s":11,"x":"Lâfız ve mana bozukluğu mana ile rivâyetten de doğmuş olabilir."},{"s":12,"x":"Metin tenkidine şiddetle karşı çıkan İbnu’l-Kayyim’e göre metin tenkidine mezheb görüşüne aykırı hadisleri reddetmek için başvurulmaktadır."},{"s":12,"x":"Şevkânî: akla, kesin nasslara ve icmâa aykırı hadis te’vîl edilemiyorsa reddedilir; diğer metin tenkidi kriterlerine karşı çıkar."},{"s":13,"x":"Metin tenkidi zihniyeti müslüman âlimler arasında çok sistemli şekilde mevcuttur ve klasik dönemlerde daha hâkimdir."}]},{"t":"İhtilâfu’l-Hadis: Sistemler ve Cem’ ü Te’lif","intro":"İhtilâfı giderme gereği, Cumhur, Hanefî ve hadisçi sistemleri, ihtilâfı giderme yolları ve bunların ilki olan cem’ ve te’lif: tahsis, takyid, haml.","s":[{"h":"İhtilâfı Giderme Gereği","b":[{"k":"p","x":"İslâm bilginleri tarafından bu sahada da takdire şayan bir çaba yerine getirilmiştir. Ne var ki, sahip oldukları değişik bakış açıları ve görüşler onları, tabiî olarak, farklı şekillerde oluşturulan çözüm sistemleri önermeye yöneltmiştir. Esasen bu farklılık, meselenin özündeki ihtilâf kadar tabiî ve normaldir. Binaenaleyh bize göre tenkid edilmesi gerekli olan davranış, bir probleme değişik çözümler önermek ve getirmek değil, çözüm için gayret sarfetmemektir."},{"k":"p","x":"Hadisler arasındaki ihtilâfların giderilmesi gereğine ve çözüm sistemlerinin farklılık arz edebileceğine ve bunların tabiîliğine böylece işaret ettikten sonra, muteârız hadislerin, çözüm açısından genel durumlarına temas etmek yerinde olacaktır."},{"k":"p","x":"Usul âlimlerinin hemen hepsi, “Muhtelifu’l-hadîs” tarifi içine giren ihtilâflı hadislerin cem’ ve telifi mümkün olanlar, cem’ ve te’lifi mümkün olmayanlar diye iki grup teşkil ettiğini kabul etmektedirler."},{"k":"p","x":"“İhtilâfı giderme yolları” diye genel bir isimlendirme ile takdim ettiğimiz cem’i mümkün olan ve olmayan hadîslerin teâruzunu gidermeyi sağlayacak olan usuller, aslında, “te’vilu muhtelifi’l hadîs” adıyla ifade edilen “te’vil” işleminin uygulama yönlerinden ibârettir."},{"k":"dikkat","x":"Tenkid edilmesi gerekli olan davranış, bir probleme değişik çözümler önermek değil, çözüm için gayret sarfetmemektir."}]},{"h":"İhtilâfı Giderme Sistemleri","b":[{"k":"p","x":"İhtilâfın giderilebilmesi için uygulanacak usûllerin hangi sıra ile işleme konulması gerektiği hususunda üç ayrı grup vardır: Cumhuru ulema, Hanefîler ve Hadîsçiler. Bu üç sıra şöyledir."},{"k":"h","x":"Cumhûr ulemanın sistemi: (CTNT)"},{"k":"li","x":"a. Cem’ ve te’lif"},{"k":"li","x":"b. Tercih"},{"k":"li","x":"c. Nesh"},{"k":"li","x":"d. Tevakkuf (tesâkut)"},{"k":"h","x":"Hanefîlerin sistemi: (NTCT)"},{"k":"li","x":"a. Nesh"},{"k":"li","x":"b. Tercih"},{"k":"li","x":"c. Cem’ ve Te’lif"},{"k":"li","x":"d. Tasâkut (Terk)"},{"k":"h","x":"Hadisçilerin sistemi (CNTT)"},{"k":"li","x":"a. Cem’ ve te’lif"},{"k":"li","x":"b. Nesh"},{"k":"li","x":"c. Tercih"},{"k":"li","x":"d. Tevakkuf"},{"k":"tbl","r":[["Sıra","Cumhûru Ulemaya Göre","Hanefîlere Göre","Hadisçilere Göre"],["**1**","Cem’ ve Te’lif","Nesh","Cem’ ve Te’lif"],["**2**","Tercih","Tercih","Nesh"],["**3**","Nesh","Cem’ ve Te’lif","Tercih"],["**4**","Tevakkuf-Tesâkut","Tesâkut","Tevakkuf"]]},{"k":"p","x":"Sistemlerde en büyük farklılık, Hanefiler ile Hadisçilerinki arasında görülmektedir. Hanefîlerin sistemi, hadisçilerce benimsenmiş olan, hadisin ziyânına mani olmak temel prensibine hayli ters düşmektedir. Cem’ imkânı varken, birinci sırada nesh’den söz etmenin doğru olmayacağı ve nazar-ı itibara alınmayacağı gerekçesiyle Hanefîlerin sistemi kendisi de bir Hanefi olan **Leknevî** (1304/1886) tarafından tenkit edilmiştir. Burada hadis âlimlerinin usulü esas alınmıştır."}]},{"h":"İhtilâfı Giderme Yolları","b":[{"k":"p","x":"Hadisçilerin sistemine göre ihtilâfı giderme yolları ve bunların alt kısımları:"},{"k":"tbl","r":[["Yol","Kısımları"],["**Cem’ ve Te’lif**","Tahsis (hadisin hadisle tahsisi · hadisin Kur’an’la tahsisi · hadisin Kur’an’ı tahsisi · kıyas ve örf ile tahsis) · Takyid · Haml"],["**Nesh**","Sünnetin sünnetle neshi · Hadisin Kur’an’la neshi · Hadisin akıl ile neshi"],["**Tercih**","İsnadla ilgili tercih sebepleri (râvinin halleri; râvinin hadisi tahammül vakti ve şekli) · Metin ile ilgili tercih sebepleri (rivâyet keyfiyeti; vürûd vakti ve şekli; lafızlar ve üslûp) · Hüküm (medlûl) yönünden tercih · Hâricî sebeplerle tercih"],["**Tevakkuf**","Teoride tevakkuf · Pratikte tevakkuf"]]},{"k":"steps","x":["Cem’ ve Te’lif","Nesh","Tercih","Tevakkuf"]},{"k":"p","x":"Bu bölümde, hadislerin birbirleriyle muâraza edebilecek denkliğe sahip oldukları tespit edildikten sonraki çözüm işlemlerini, hadisçilerin sistemindeki sıra ile tetkîk edeceğiz."}]},{"h":"A. Cem’ ve Te’lif","b":[{"k":"d","t":"Cem’","x":"Lügatte, dağınık olanları bir araya getirmektir. Cem’, aynı zamanda, “te’vîl yoluyla iki delîl arasındaki ihtilâfı gidermek, mutlak olarak lafzın delâlet ettiği mânâyi açıklamaktır.”"},{"k":"p","x":"Istılahta ise, “**şer’i deliller arasında i’tilâf ve tevâfuk’u aklî veya naklî olarak beyân etmek; edille-i şer’iyye arasında tenâkuza veya noksanlığa götürücü bir ihtilâfın bulunmadığını ya iki tarafın ya da sadece bir tarafın te’vîl edilmesi suretiyle veyâ muteârızlardan birinin ötekine üstünlüğünü tesbit suretiyle veya herhangi bir sebeple muteârızlardan birinin ötekine takdîmi ya da birinin müteahhir ve nâsih olduğunu isbât suretiyle açıklamaktır.**”"}]},{"h":"Cem’ ve Te’lifin Gerçekleşme Yolları","b":[{"k":"p","x":"Hadisler arasındaki ihtilâfın giderilmesinde cem ve te’lif (bağdaştırma) prensibinin uygulaması tek şekilde olmamaktadır. Kullanılacak metotlar, tamamen fıkıh usûlü metotları olacaktır:"},{"k":"li","x":"a. Tahsîs (“tahsîsu’l-amm”)"},{"k":"li","x":"b. Takyîd (“takyîdu’l-mutlak”)"},{"k":"li","x":"c. Haml (“hamlu’l-hadîs alâ teaddüdi’l-hâdise”)"},{"k":"tbl","r":[["Cem’ ve Te’lif yolu","Kısımları"],["**Tahsis**","Hadisin hadisle tahsisi · Hadisin Kur’an’la tahsisi · Hadisin Kur’an’ı tahsisi · Kıyas ve örf ile tahsis"],["**Takyid**","—"],["**Haml**","—"]]}]},{"h":"a) Tahsîs","b":[{"k":"d","t":"Tahsîs","x":"Bir lafzın kapsamı içinde bulunan manaları, o lafzın kapsamından çıkarmaktır."},{"k":"p","x":"Usülcüler arasında Tahsis konusunda ittifak vardır. Tahsis, müstakil muhassıs ve ğayrı müstakil muhassıs diye isimlendirilen bazı delillerle gerçekleşmektedir."},{"k":"ornek","x":"Mesela; “Üzerine ALLAH’ın adının anılmadığı şeylerden yemeyin” ayetini, “Müslüman, bismillah desin-demesin kestiğini ALLAH adıyla keser” hadisinin tahsis ettiğini Hanefiler kabul etmez ve kasden besmeleyi terkeden kimsenin kestiği yenmez derler. Şafiler ise bu hadisle, ayeti tahsis ederler ve kesilen eti helal sayarlar."},{"k":"not","x":"Bu ihtilaf Hanefilerin, Âmmın delaletini kati, Şafilerin ise Âmmın delaletini zanni kabul ettiklerinden kaynaklanır."},{"k":"p","x":"Tahsis 4 Kısımdır. Hadisin hadisle, Hadisin Kur’anla Tahsisi, Hadisin Kur’an’ı Tahsisi ve Kıyas-Örf ile Tahsis."},{"k":"h","x":"a.a. Hadîsin hadîsle tahsîsi"},{"k":"p","x":"Umûmiyetle hadîsin hadîsle tahsîs’i konusunda hadîsin kavlî, fiilî, takrîrî, mütevâtir ve âhâd olmasının neticeye tesiri yoktur. Bunlar yekdiğerini tahsîs eder."},{"k":"ornek","x":"Örneğin, İbn Huzeyme (311/925), “en üstün amel”i, “ilk vaktinde kılınan namaz” olarak belirleyen hadisi, şiddetli sıcaklarda öğle namazını serinliğe bırakmakla ve zor gelmemesi halinde yatsıyı gece yarısına tehir etmekle ilgili hadislerin âmm olmaktan çıkardığını yani tahsis ettiğini belirtmektedir."},{"k":"h","x":"a.b. Hadîs’in Kur’anla tahsîsi"},{"k":"ornek","x":"Hz Peygamber “Ben insanlarla Lâ ilâhe illallah dedikleri âna kadar savaşmakla emrolundum” buyurmaktadır. Allah Teâlâ da “Kendilerine kitap verilenlerden Allah’a ve âhiret gününe inanmayan, Allah’ın ve resulünün haram kıldığını haram saymayan ve hak dinini din edinmeyen kimselerle, küçülüp boyun eğerek elleriyle cizye verecekleri zamana kadar savaşın” buyurmaktadır. Buna göre gayr-i müslimlerle cizye verdikleri takdirde savaşmamak ayetten dolayı; kelime-i tevhid’i söylediklerinde savaşmamak da hadisten ötürüdür. Bu iki halin dışında ise, onlarla savaş edilecektir."},{"k":"h","x":"a.c. Kur’an’ın hadîsle tahsîsi"},{"k":"ar","a":"وأحل لكم ما وراء ذلكم","x":"Bu ayet, kadının halası veya teyzesi üzerine nikah edilemeyeceğini bildiren hadisle tahsis edilmiştir."},{"k":"h","x":"a.d. Kıyas ve Örf ile tahsis"},{"k":"ornek","x":"Hz. Ebubekir’in zekatı namaza kıyas ederek, zekat vermek istemeyenlerle harb kararı buna örnektir."},{"k":"not","x":"Örf-i kavlînin mutlakı takyîd, ammı tahsis ettiğinde usûlcüler müttefiktirler. Hanefî usûlcüler ve Mâlikîlerin çoğunluğu, örf-i amelînin, yerleşik olmak kaydiyle âmmı tahsis edeceğini de benimserler. Diğer usûlcüler ise, aksi görüştedirler."},{"k":"tbl","r":[["Tahsis kısmı","Örnek"],["**Hadisin hadisle tahsisi**","“İlk vaktinde kılınan namaz” hadisini, öğleyi serinliğe ve yatsıyı gece yarısına tehir hadisleri tahsis eder (İbn Huzeyme)"],["**Hadisin Kur’an’la tahsisi**","“Lâ ilâhe illallah dedikleri âna kadar savaşmakla emrolundum” hadisi, cizye ayetiyle tahsis edilir"],["**Kur’an’ın hadisle tahsisi**","«وأحل لكم ما وراء ذلكم» ayeti, kadının halası veya teyzesi üzerine nikâhı yasaklayan hadisle tahsis edilir"],["**Kıyas ve örf ile tahsis**","Hz. Ebubekir’in zekatı namaza kıyas ederek zekat vermeyenlerle harb kararı"]]}]},{"h":"b) Takyîd","b":[{"k":"d","t":"Takyîd","x":"Mutlak mana ifade eden lafızların bazı manalarını çıkartarak mukayyed lafızlarla açıklanmasıdır."},{"k":"h","x":"Biri mutlak, diğeri mukayyed lafız olursa"},{"k":"sc","q":"“Su temizdir, hiçbirşey onu kirletmez” mutlak hadisi “Su, 2 kulleye ulaşınca pislik tutmaz” ve “Rengi veya tadı değişmedikçe su pis sayılmaz” mutlak hadisleriyle tearuz halindedir.","x":"2 kulle veya daha fazla su vasfı değişmedikçe kirlenmez, 2 kulleden az suyun içine pislik düşerse, vasfı değişsin değişmesin pislenir, 2 kulleden fazla da olsa, vasıfları pislik sebebiyle değişen su pislenir, şeklinde hadislerin arası cem edilmektedir."},{"k":"sc","q":"“Deri tabaklandı mı temizdir” hadisi ile “Sahibi ölü hayvanın derisinden faydalansaydı ya” hadisi","x":"“Tabaklasalar da ondan faydalansalar ya” diye cem etmek gerekir."},{"k":"h","x":"İki mutlak lafız tearuz ederse"},{"k":"sc","q":"“Kureyşe dikkat edin, sözlerini dinleyin yaptıklarını yapmayın”","x":"Sahabenin sözlerini dinleyin, kötü fiil sahiplerinin yaptıklarını yapmayın şeklindedir."},{"k":"sc","q":"“ALLAH, şirk dışında dilediği kimsenin bütün günahlarını bağışlar” ayetinde bir müslümanın ebeden cehennemde kalmayacağına dair icma vardır. Fakat bu ayet ile “Koğuculuk yapan cennete giremez” hadisi tearuz halindedir.","x":"Bu teâruz hadisi “öncekilerden” veya “günahının cezasını çekmeden giremez, sonra çıkar” gibi uygun bir kayıtla takyid edilerek, icmâın hükmüne muhalefeti giderilir."},{"k":"ornek","x":"“Her hür ve köle için sadaka-i fıtr veriniz” hadisi, başka bir hadisteki “Müslümanlardan” sıfatıyla takyid edilir ve Şafilere göre müslüman köle için fıtr verilir. (Hanefiler, buradaki kayıt hükmün sebebinde vaki olduğu için takyid etmez ve tüm köleler için fıtr gerekir derler)"}]},{"h":"c) Haml","b":[{"k":"d","t":"Haml","x":"Müteârız hadislerin farklı vürud şartlarını ortaya koyarak bağdaştırmaktır. Yani hadisleri ait oldukları yere koymaktır."},{"k":"sc","q":"“Hastalık korkusuyla vücudunu dağlattıran Allah’a tevekkül etmemiştir” hadisi ile “Tedavi usullerinden en faydalı olanlar, hacamat, bal şerbeti ve ateşle dağlamaktır.” hadisi arasındaki teâruz","x":"Birincisini hastalıktan önce tedbir olsun diye sağlıklıyken dağlatmaya; ikinci hadisi de hastalıktan sonra tedavi için dağlamaya hamleder."},{"k":"sc","q":"Önünden yiyip aksini nehyettiği ve Rasulullah’ın bunun aksine davrandığıyla ilgili rivayet","x":"İlkini toplum içinde; ötekini tek başına yeme hâline hamleder."},{"k":"sc","q":"“……….yerine bir gün kaza orucu tut” hadisiyle “Hastalık veya bir başka özür olmadan Ramazan orucunu bozan, bütün zamanını oruçla geçirse, yine de ödeyemez” hadisi","x":"Birincisi kazaya; ikincisi ise kaza orucunun zamanında eda edilen oruç gibi olmayacağına hamledilir."}]},{"h":"Cem’ ve Te’lifin İşletilişi","b":[{"k":"p","x":"Üç durum vardır:"},{"k":"li","x":"a. Müteârız hadislerden önceden belli biri üzerinde yapılan tevil ve tasarrufla cem’ yapılmaktadır. Yani teâruz, âmm ve hass arasında ise işlem âmm üzerinde yapılır."},{"k":"li","x":"b. Müteârız taraflarından önceden belli olmayan biri üzerinde icra edilen işlemle cem’ yapılır. Yani, İki taraf da tevil tasarrufu için müsaittir, fakat başka bir delile istinaden bir tarafa yapılacak cem’ tasarrufu yeterli olur."},{"k":"li","x":"c. Müteârız hadislerin ikisine birden yapılacak tasarrufla cem’ mümkün olur. Yani yapılan işlem için her biri bir tarafın zahiri hilâfına hamledilmesinin sıhhatine şahitlik edecek 2 delile gerek vardır."}]},{"h":"Cem’ ve Te’lifin Amelî Neticesi ve Değerlendirilmesi","b":[{"k":"p","x":"Muteârız hadîsleri muhtelif usullerle cem’ ve te’lif etmenin amelî (pratik) neticesi, bu hadîslerden her birini kendine ait yere yerleştirmek ve onların hepsinden birden istifade etmektir. Bu, hadisçilerin “Amel etmek etmemekten evladır” kaidesinin uygulamasıdır."},{"k":"p","x":"Kısaca, cem’ ve te’lif tahdîdi hemen hemen imkânsız olan bir derya enginliğinde uygulama sahası bulunan bir usûldür."}]}],"ht":[{"s":0,"x":"Muhtelifu’l-hadîs iki gruptur: cem’ ve te’lifi mümkün olanlar ve mümkün olmayanlar."},{"s":0,"x":"İhtilâfı giderme yolları, “te’vîlu muhtelifi’l-hadîs” denen te’vîl işleminin uygulama yönleridir."},{"s":1,"x":"Üç sistem: Cumhur CTNT (cem’, tercih, nesh, tevakkuf) · Hanefî NTCT (nesh, tercih, cem’, tesâkut) · Hadisçi CNTT (cem’, nesh, tercih, tevakkuf)."},{"s":1,"x":"En büyük fark Hanefîlerle hadisçiler arasındadır; Hanefî sistemi “hadisin ziyânına mani olmak” prensibine ters düşer ve Hanefî olan Leknevî tarafından tenkit edilmiştir."},{"s":2,"x":"Hadisçilerin sırası: cem’ ve te’lif → nesh → tercih → tevakkuf. Bu işlemler, hadislerin muâraza edebilecek denkliğe sahip olduğu tespit edildikten sonra yapılır."},{"s":3,"x":"Cem’: lügatte dağınık olanları bir araya getirmek; te’vîl yoluyla iki delil arasındaki ihtilâfı gidermek."},{"s":4,"x":"Cem’ ve te’lifin üç yolu fıkıh usûlü metotlarıdır: tahsîs (tahsîsu’l-âmm), takyîd (takyîdu’l-mutlak), haml (hamlu’l-hadîs alâ teaddüdi’l-hâdise)."},{"s":5,"x":"Tahsîs: lafzın kapsamındaki manaları kapsamdan çıkarmak; usûlcüler arasında ittifak vardır."},{"s":5,"x":"Besmelesiz kesim: Hanefîler hadisle ayetin tahsisini kabul etmez (âmmın delaleti kat’î); Şâfiîler tahsis eder (âmmın delaleti zannî)."},{"s":5,"x":"Hadisin hadisle tahsisinde hadisin kavlî, fiilî, takrîrî, mütevâtir ya da âhâd olmasının etkisi yoktur."},{"s":5,"x":"Örf-i kavlî ile tahsis ve takyîde ittifak vardır; örf-i amelî ile tahsisi Hanefîler ve Mâlikîlerin çoğu (yerleşik olmak kaydıyla) kabul eder."},{"s":6,"x":"Takyîd: mutlak lafzın bazı manalarını çıkararak mukayyed lafızlarla açıklamak."},{"s":6,"x":"İki kulle meselesi: 2 kulle ve fazlası vasfı değişmedikçe kirlenmez; 2 kulleden az su pislik düşünce pislenir; vasfı değişen su her durumda pislenir."},{"s":6,"x":"Sadaka-i fıtr: Şâfiîlere göre “Müslümanlardan” kaydıyla takyid edilir; Hanefîler kayıt hükmün sebebinde olduğu için takyid etmez."},{"s":7,"x":"Haml: müteârız hadislerin farklı vürud şartlarını ortaya koyarak bağdaştırmak, hadisleri ait oldukları yere koymak."},{"s":7,"x":"Dağlama hadisleri: biri sağlıklıyken tedbir amaçlı dağlatmaya, öteki hastalıktan sonra tedaviye hamledilir."},{"s":8,"x":"Cem’in işletilişinde üç durum: önceden belli bir taraf üzerinde (âmm-hâs teâruzunda âmm üzerinde), önceden belli olmayan bir taraf üzerinde, iki tarafa birden tasarruf (iki delil gerekir)."},{"s":9,"x":"Cem’ ve te’lifin amelî neticesi: her hadisi kendine ait yere yerleştirip hepsinden istifade etmek; “Amel etmek etmemekten evladır” kaidesi."}]},{"t":"Nesh, Tercih ve Tevakkuf","intro":"Cem’ ve te’lif mümkün olmadığında başvurulan yollar: neshin gerçekleşme şartları, tanıma yolları ve çeşitleri; tercih esasları ve hiyerarşisi; teoride ve pratikte tevakkuf.","s":[{"h":"B. Nesh","b":[{"k":"d","t":"Nesh","x":"Şari’in (Kanun koyucunun), eski bir hükmü yenisiyle değiştirmesidir."},{"k":"p","x":"Cem’ ve Te’lifin mümkün olmadığı durumda çözüm işlemlerinden Nesh gelmektedir. Hadis usulünde Nesh, hem müstakil olarak hem de hadisler arası tearuzu giderme yöntemi olarak iki ayrı yerde anlatılmaktadır. Tearuz olmadan Nesh’den söz etmek mümkün değildir."},{"k":"h","x":"Neshin mânâsı"},{"k":"li","x":"**Ukûbet mânâ ve maksadı taşıyan nesh:** “Yahudilerin yaptıkları zulüm ve ALLAH yolunda alıkoymalarından dolayı helal kılınmış şeyleri haram kıldık” ayetinde olduğu gibi Tahfif’ten Tağlize doğru yapılan nesh."},{"k":"li","x":"**Ukûbet mânâ ve maksadı taşımayan nesh:** “Bundan böyle sizden sabreden yüz kişi olsa, iki yüz kafiri yenerler….” Ayetinde olduğu gibi Tağliz’den Tahfif’e doğru yapılan nesh."},{"k":"tbl","r":[["Neshin mânâsı","Yönü","Örnek"],["**Ukûbet mânâ ve maksadı taşıyan**","Tahfiften tağlize","“Yahudilerin yaptıkları zulüm… dolayı helal kılınmış şeyleri haram kıldık”"],["**Ukûbet mânâ ve maksadı taşımayan**","Tağlizden tahfife","“Sizden sabreden yüz kişi olsa, iki yüz kafiri yenerler…”"]]}]},{"h":"Neshin Gerçekleşme Şartları","b":[{"k":"n","n":1,"x":"Nesh, hitap (Emir, nehy) ile olmalıdır."},{"k":"n","n":2,"x":"Neshedilen hüküm, şeri hüküm olmalı."},{"k":"n","n":3,"x":"Neshedilen hüküm, zaman ile kayıtlı olmamalı."},{"k":"n","n":4,"x":"Nesheden hükmün zamanı, neshedilenden sonra olmalı. (Muttasıl veya Munfasıl olabilir.)"},{"k":"n","n":5,"x":"Nesheden hüküm, neshedilenden munfasıl olursa, iki hadis ile amel etmek (Cem’-Te’lif) mümkün olmamalı. Cem’-Te’lif mümkünse Nesh’ten söz edilemez."},{"k":"dikkat","x":"Cem’ ve te’lif mümkünse nesh’ten söz edilemez."}]},{"h":"Neshi Tanıma Yolları","b":[{"k":"n","n":1,"x":"**Tasrîhu’n-Nebî** (Bizzat Rasulullah’ın açıklaması)"},{"k":"ornek","x":"Örnek: Ben sizi kabir ziyaretinden men etmiştim, artık ziyaret edin."},{"k":"n","n":2,"x":"**Kavlu’s-Sahâbî** (Sahabî açıklamaları ile)"},{"k":"ornek","x":"Örnek: Rasulullah, cenaze geçerken ayağa kalkmamızı emrederdi, sonra kendisi oturdu bize de oturmamızı emretti. (Sahabi açıkça belirtti)"},{"k":"ornek","x":"Örnek: Ateşte kızartılmış yiyeceklerden sonra abdest almayı terketmek Rasulullah’ın iki hareketinin sonuncusu olmuştur. (Sahabi neshi ima etti)"},{"k":"n","n":3,"x":"**Vürud Tarihlerinin bilinmesi ile Nesh** (Sonraki, öncekini nesheder)"},{"k":"ornek","x":"Örnek: Mekke fethi esnasında söylenen “Hacamat yapan ve yaptıranın orucu bozuldu” hadisi, veda haccında Rasulullah’ın oruçlu iken kan aldırdığı hadisi ile nesh olunmuştur."},{"k":"n","n":4,"x":"**Delâletu’l-İcma** (İcma ile neshi tanıma) Ümmetin icma etmesi de neshi tanıma yollarındandır."},{"k":"ornek","x":"Örnek: Dördüncü defa içki içenin öldürüleceği hadisi, öldürmeme konusunda oluşan icma ile neshedilmiştir."},{"k":"tbl","r":[["Tanıma yolu","Örnek"],["**Tasrîhu’n-Nebî**","“Ben sizi kabir ziyaretinden men etmiştim, artık ziyaret edin.”"],["**Kavlu’s-Sahâbî**","Cenaze geçerken ayağa kalkma (açıkça); ateşte kızartılmış yiyecekten sonra abdesti terk (ima)"],["**Vürud tarihi**","Mekke fethindeki “Hacamat yapan ve yaptıranın orucu bozuldu” hadisi, veda haccındaki kan aldırma hadisiyle neshedildi"],["**Delâletu’l-İcma**","Dördüncü defa içki içenin öldürüleceği hadisi, öldürmeme icmâıyla neshedildi"]]}]},{"h":"Neshin Çeşitleri","b":[{"k":"n","n":1,"x":"Hadisin hadisle neshi (Bu da 4 kısımdır.)"},{"k":"n","n":2,"x":"Hadisin Kur’an ile neshi"},{"k":"n","n":3,"x":"Hadisin akıl ile neshi."},{"k":"h","x":"a. Sünnetin sünnetle neshi"},{"k":"p","x":"Ulemâ sünnetteki neshi 4 şekilde grublandırmaktadır:"},{"k":"li","x":"Mütevatir hadisin, mütevatir hadisle neshi"},{"k":"li","x":"Haber-i Vahid’in, Haber-i Vahid ile neshi"},{"k":"li","x":"Haber-i Vahid’in, mütevatir hadisle neshi"},{"k":"li","x":"Mütevatir hadisin, Haber-i Vahid ile neshi"},{"k":"not","x":"İlk üçü ittifakla caizdir. Sonuncusu ise ihtilaflıdır. İbn Hazm ve bazı zahiriler, sonuncuyu da caiz görürler."},{"k":"tbl","r":[["Sünnetin sünnetle neshi","Hükmü"],["Mütevâtirin mütevâtirle neshi","İttifakla caiz"],["Haber-i vâhidin haber-i vâhidle neshi","İttifakla caiz"],["Haber-i vâhidin mütevâtirle neshi","İttifakla caiz"],["Mütevâtirin haber-i vâhidle neshi","İhtilaflı (İbn Hazm ve bazı Zâhirîler caiz görür)"]]},{"k":"h","x":"b. Hadîsin Kur’an ile neshi"},{"k":"ornek","x":"“Rasulullah’ın hayatında, biz namazda iken konuşurduk...” hadisi “Namazları koruyun ve orta namazı da…” ayeti nazil olunca biz sükût ile emrolunduk."},{"k":"not","x":"Nesh’de asıl kaide, Nass’ı neshedecek Nass’ın daha kuvvetli olmasıdır. (Nasih, mensuhtan kuvvetli olmalıdır) Bu yüzden, Kur’an ayetleri mütevatir sünnetle neshedilir görüşü genelde kabul edilmiştir."},{"k":"h","x":"c. Hadîsin akıl ile neshi"},{"k":"p","x":"Mutezileden Nazzama nisbet edilen bu görüş, günümüzde büyük tehlike arzetmektedir. Burada, nesh teriminin, istilâhî mânâsı içinde kullanıldığını kabul etmek oldukça zordur. Belki redd manasında kullanılmış olması daha uygundur."}]},{"h":"Neshin Amelî Neticesi ve Değerlendirilmesi","b":[{"k":"p","x":"Neshin amelî neticesi: Nâsih ile amel edip mensûhu terketmektir."},{"k":"p","x":"Bir ilgâ prensib ve metodu olan nesh, teâruza taraf olup bağdaştırılma imkânı bulunamayan hadislerin hangisinin “en son” olduğunu göstererek hangisiyle artık amel edilemeyeceğini, belli yollarla ve müdellel bir tarzda ortaya koymak demektir. Bu işlem, ukûbet mânâsı taşıyıp taşımamasına göre ya tahfiften tağlize ya da tağlizden tahfife giden bir seyir takib eder."},{"k":"tbl","r":[["Nesh","Kısımları"],["**Neshin mânâsı**","Ukûbet mânâsı ve maksadı taşır · Ukûbet mânâsı ve maksadı taşımaz"],["**Gerçekleşme şartları**","Nesh hitab (emir-nehiy) ile olmalı · Neshin hükmü şer’î bir hüküm olmalı · Mensuh hüküm belli bir zaman kaydı taşımamalı · Nasih zaman bakımından mensuhtan sonra olmalı · Cem ve telif mümkün olmamalı"],["**Tanıma yolları**","Tasrîhu’n-Nebî · Kavlu’s-sahâbî · Vürûd tarihi · İcmâ"],["**Çeşitleri**","Sünneti sünnetle nesh · Hadisin Kur’an’la neshi · Akıl ile nesh"],["**Sonucu**","Nâsih ile amel edilir, mensuh terk edilir."]]}]},{"h":"C. Tercih","b":[{"k":"d","t":"Tercih","x":"Lügatte; meylettirmek, galib getirmek ya da muâdil taraflardan birinin vasfen üstünlüğünü isbat etmek demektir. Istılahta, “teâruz halindeki hadîslerden birinde bulunan ve onu ötekine üstün tutmayı gerektiren bir meziyeti ortaya koymak ve kabullenmek, ötekini de terketmek demektir.”"},{"k":"p","x":"Teâruzun tabiî bir uzantısı ve çözüm yollarından biri olan tercih, takviye imkânı bulunan deliller arasında uygulanabilmektedir. Yani haberler ve kıyâsta geçerli olan tercih, kitab ve icmâ’da söz konusu değildir. Çünkü iki âyetten birinin ötekine tercihi diye bir şey olmaz; âyetler -şâyet muârız iseler- biri ötekini ya tahsis veya nesh etmiştir. İcmâ’da ise, teâruz mümkün değildir."},{"k":"dikkat","x":"Hadîslerden birini ihmâle sebep olan tercih, cem’ ve te’lif imkânı bulunan yerde düşünülmez."}]},{"h":"Tercih Esasları ve Hiyerarşi","b":[{"k":"h","x":"1) İsnâd ile İlgili Tercih Sebepleri"},{"k":"p","x":"Râvînin hâli ve tahammül vakti ve şekli gibi iki ana bölümde sunmak, sebepler arasında belli bir irtibat kurma imkânı sağlayacaktır."},{"k":"h5","x":"a) Râvînin halleri ile ilgili tercih sebepleri"},{"k":"li","x":"a.a) Râvînin adedinin çokluğu (“kesretu’r-ruvât”)."},{"k":"li","x":"a.b) Râvînin zâtî vasıfları. Râvînin erkek, hür, ismi tek ve açık, nesebî meşhûr olması gibi."},{"k":"li","x":"a.c) Râvînin yaş durumu. Rivâyetu’l-kebîr, rivâyetu’s-sağir’e; ekâbir-i sahâbeden olanın rivâyeti diğerlerinin rivâyetine tercih edilir."},{"k":"li","x":"a.d) Râvînin ilmî durumu. Ravînin fakîh olması, Nahv ve Lugat bilmesi, ezberi yerinde olması"},{"k":"li","x":"a.e) Râvînin hafıza durumu."},{"k":"li","x":"a.f) Râvînin fazileti ve şöhreti. Vera’ sahibi, itikadi sağlam, şöhret sahibi ve bid’atcı olmayan râvînin rivâyeti de bu vasıfları taşımayanın hadîsine tercih edilir. Güçlü özelliklerdir."},{"k":"li","x":"a.g) Râvînin adâleti ve güvenilirliği."},{"k":"li","x":"a.h) Râvînin olayla ilgisi. Râvînin, olayın başından geçtiği kişi olması, rivâyet ettiği konuya mübaşir olması tercih sebepleri arasında yer almaktadır."},{"k":"li","x":"a.ı) Ravinin Hz. Peygamber (sav)’e yakınlığı."},{"k":"li","x":"a.i) Râvînin hadîsçilerle irtibatı. Râvînin ehl-i hadîs veya âlimlerden ayrılmaması veya onlarla çokca beraber bulunması da tercih sebeplerindendir."},{"k":"h5","x":"b) Râvînin hadîsi tahammül vakti ve şekli ile ilgili sebepler"},{"k":"p","x":"Rivayette büluğdan sonra, büluğdan önceye tercih edilir. Sema yolu, arz yoluna; bu ikisi yoluyla alanın kitabe, vicade ve münavele yoluyla alana tercihi söz konusudur."},{"k":"steps","x":["Semâ","Arz","Kitâbe, vicâde, münâvele"]},{"k":"h","x":"2) Metin ile İlgili Tercih Sebepleri"},{"k":"p","x":"Tercihte genel olarak önce senede ait özellikler gözönüne alınır. Sonra metin özellikleri incelenir."},{"k":"li","x":"Lafzen rivayet edilen manen rivayet edilene tercih edilir."},{"k":"li","x":"Vürud sebebi bulunuyorsa tercih sebebidir."},{"k":"li","x":"Medeni hadisler, Mekki hadislere tercih edilir."},{"k":"li","x":"Hâs olan lafız, Âmm olana, Tahsis edilmemiş Âmm tahsis edilmiş Âmma tercih edilir."},{"k":"li","x":"Hakikat Mecaza, Nehy Emre, Nehy İbahaya, Mecaz müştereke, mukayyed mutlaka tercih edilir."},{"k":"h","x":"3) Hüküm (medlûl) Yönünden Tercih"},{"k":"p","x":"Aslın hükmünü ve Beraeti asliyyeyi takrir eden rivayet, başka hükme işaret edene tercih edilir."},{"k":"h","x":"4) Harici Sebeplerle Tercih"},{"k":"p","x":"İsnad, metin ve delalette denk olan hadisler için bu tercihlere başvurulur."},{"k":"li","x":"Sırasıyla Kur’an, Sünnet, Kıyas, Ümmetin ameli, Hulefai Raşidinin ameli ve medinelilerin ameline muvafık olan tercih edilir."},{"k":"li","x":"Mürsel veya hatta munkatı tarafından desteklenen hadis tercih edilir."},{"k":"li","x":"Sahabeyi tenkid manası olmayan hadis tercih edilir."},{"k":"li","x":"Buhari ve Müslim’de bulunan hadisler tercih sebebidir."},{"k":"tbl","r":[["Tercih sebepleri","Kısımları"],["**İsnad ile ilgili**","Râviye ait haller (râvinin adedinin çokluğu · zâtî sıfatları · yaş durumu · ilmî durumu · hâfıza durumu · fazileti ve şöhreti · adâleti ve güvenilirliği · olayla ilgisi · Hz. Peygamber’e yakınlığı · hadisçilerle irtibatı) · Tahammül vakti ve şekli ile ilgili"],["**Metin ile ilgili**","Rivâyet keyfiyeti itibâriyle · Vurûd vakti ve şekli ile ilgili · Lafız ve üslupla ilgili tercih sebepleri"],["**Hüküm (medlûl) yönünden**","Aslın hükmünü ve berâet-i asliyyeyi takrir eden rivayet"],["**Hâricî sebepler**","Kur’an, sünnet, kıyas, ümmetin, hulefâ-i râşidînin ve Medinelilerin ameline muvafakat · mürsel/munkatı ile desteklenme · sahabeyi tenkid manası taşımama · Buhârî ve Müslim’de bulunma"]]}]},{"h":"Tercihin Amelî Neticesi ve Değerlendirilmesi","b":[{"k":"p","x":"Tercih’in amelî neticesi: Racih hadis ile amel etmek ve mercuhu terk etmektir."},{"k":"p","x":"Tercih sebepleri, hadislerdeki tearuzu çözüme kavuşturacak kadar geniştir. Bunca sebepten hiçbiri ile tercih edilmeyip tevakkuf gereken tek bir misal dahi verilememiştir."}]},{"h":"D. Tevakkuf","b":[{"k":"d","t":"Tevakkuf (Tahyir, Tesakkut)","x":"Mutearız hadislerin hiçbirisiyle amel etmemek ve bir tercih delili ortaya çıkana kadar beklemektir."},{"k":"p","x":"2 kısımda incelenir: Teoride Tevakkuf ve Pratikte Tevakkuf."},{"k":"h","x":"1- Teoride Tevakkuf"},{"k":"p","x":"Tevakkuf sadece teoriden ibarettir. Çünkü bu aşamaya gelmeden nesh ve tercih ile iş bitirilir. Bu metod ise farazi bir durumdur. Bu sebeple sadece bilgi olarak vardır."},{"k":"h","x":"2- Pratikte Tevakkuf"},{"k":"p","x":"Pratikde tevakkuf hiç yoktur. Söylendiği gibi Tevakkuf sadece teoriden ibarettir. Çünkü bu aşamaya gelmeden nesh ve tercih ile iş bitirilir. Bu metod ise farazi bir durumdur. Bu sebeple sadece bilgi olarak vardır."}]}],"ht":[{"s":0,"x":"Nesh: Şâri’in eski bir hükmü yenisiyle değiştirmesi. Cem’ ve te’lif mümkün değilse gelir; tearuz olmadan nesh olmaz."},{"s":0,"x":"Ukûbet mânâsı taşıyan nesh tahfiften tağlize, taşımayan nesh tağlizden tahfife doğrudur."},{"s":1,"x":"Neshin beş şartı: hitapla olması, neshedilen hükmün şer’î olması ve zamanla kayıtlı olmaması, nâsihin sonra gelmesi, cem’ ve te’lifin mümkün olmaması."},{"s":2,"x":"Neshi tanıma yolları: Tasrîhu’n-Nebî, Kavlu’s-Sahâbî, vürûd tarihi, delâletu’l-icmâ."},{"s":3,"x":"Neshin çeşitleri: hadisin hadisle (4 kısım), Kur’an ile ve akıl ile neshi."},{"s":3,"x":"Sünnetin sünnetle neshinde ilk üçü ittifakla caiz; mütevâtirin haber-i vâhidle neshi ihtilaflı (İbn Hazm ve bazı Zâhirîler caiz görür)."},{"s":3,"x":"Nesihte asıl kaide: nâsih mensuhtan kuvvetli olmalı; Kur’an ayetlerinin mütevâtir sünnetle neshi genelde kabul edilmiştir."},{"s":3,"x":"Hadisin akıl ile neshi Mu’tezileden Nazzâm’a nisbet edilir; burada nesh daha çok redd manasındadır."},{"s":4,"x":"Neshin amelî neticesi: nâsih ile amel edip mensûhu terketmek. Nesh bir ilgâ prensibidir; hangi hadisin “en son” olduğunu gösterir."},{"s":5,"x":"Tercih haberler ve kıyâsta geçerlidir; kitap ve icmâda söz konusu değildir (âyetler birbirini tahsis veya nesh eder, icmâda teâruz olmaz)."},{"s":5,"x":"Cem’ ve te’lif imkânı varsa tercih düşünülmez."},{"s":6,"x":"Tercihte önce senede, sonra metne ait özellikler gözönüne alınır."},{"s":6,"x":"Tahammülde: büluğdan sonraki rivâyet önceye; semâ arza; bu ikisi kitâbe, vicâde ve münâveleye tercih edilir."},{"s":6,"x":"Metinde: lafzen rivâyet manen rivâyete, Medenî Mekkî’ye, hâs âmma, hakikat mecaza, nehy emre, mukayyed mutlaka tercih edilir."},{"s":6,"x":"Hâricî tercih isnad, metin ve delalette denk hadisler içindir; Buhârî ve Müslim’de bulunmak tercih sebebidir."},{"s":7,"x":"Tercihin amelî neticesi: râcih ile amel, mercûhu terk. Tevakkuf gereken tek bir misal dahi verilememiştir."},{"s":8,"x":"Tevakkuf (tahyir, tesâkut): müteârız hadislerin hiçbiriyle amel etmeyip tercih delili çıkana kadar beklemek. Sadece teoride vardır; pratikte hiç yoktur, çünkü iş nesh ve tercihle biter."}]},{"t":"Hadis–Kur’an Bütünlüğü","intro":"Kur’an’ın ışığında sünnetin değerlendirilmesi: Kur’an’a ters düştüğü için reddedilen rivâyetler, Kur’an ışığındaki görüşün önceliği ve hadislerin Kur’an’la çeliştiği iddiasının değerlendirilmesi.","s":[{"h":"Kur’an’ın Işığında Sünnetin Değerlendirilmesi","b":[{"k":"sc","q":"Hadis: Garanik Hadisi: “Bu putlar yüce garaniktir ve onların şefaati umulur.”","x":"Cevap: “Lat ve Uzza’ya ve diğer üçüncüleri Menat’a ne dersiniz? Erkek size de, dişi O’na mı? ......... ALLAH, onlar hakkında hiçbir delil indirmemiştir….” Ayetine ve putları inkâr eden birçok ayete ters olduğu için bu hadis reddedilmiştir. Ayetler putları ayıplarken nasıl olur da öven sözler söylenebilir?"},{"k":"sc","q":"Hadis: Kadınlarla istişare edin, söylediklerine muhalefet edin.","x":"Cevap: “Ana-baba aralarında danışarak ve anlaşarak çocuklarını sütten kesmek isterlerse ikisine de sorumluluk yoktur” ayetine ters olduğu için reddedilmiştir."}]},{"h":"En Doğru Görüş Kur’an Işığında Olandır","b":[{"k":"p","x":"Ayette, yeryüzünde yetişen istisnasız her bitkide zekât verilmesi gerektiği emredilmektedir. Fakihler ise bunu 4 gruba indirip, Yenilebilen + Kurutulabilen + Ölçülebilen + Saklanabilen şeylerle sınırlar. Maliki olan İbn Arabi ve Ebu Hanife ise, yenilen şeylerin hepsinde zekatı farz kabul eder."},{"k":"sc","q":"Hadis: Kızını diri diri toprağa gömen kadın ve gömülen kız cehennemdedir.","x":"Cevap: “Kız çocuğunun hangi suçtan dolayı diri diri gömüldüğü sorulduğu zaman” ayetine ters."},{"k":"sc","q":"Hadis: Benim babam da senin baban da cehennemdedir.","x":"Cevap: Rasulullah’ın ve o kimsenin babası, fetret ehli olduğu için sahih görüşe göre kurtulmuştur. Kur’an’da amcanın baba olarak ifade edilmesinden dolayı, burada kastedilenin amca olduğunu da söyleyebiliriz. Yani bu hadis Ebu Talib hakkında söylemiş olabilir."},{"k":"not","x":"İmam Nevevi: Rasulullah, güzel ahlakından dolayı adamı teselli ederek adamın musibetini paylaşmıştır."},{"k":"tbl","r":[["Rivâyet","Neden ters düşer / nasıl anlaşılır?"],["Garanik hadisi","Putları inkâr eden ayetlere ters; reddedilmiştir"],["Kadınlarla istişare edip muhalefet etmek","Anne-babanın danışarak sütten kesmesine dair ayete ters; reddedilmiştir"],["Gömen kadın ve gömülen kız cehennemde","Gömülen kızın hangi suçtan gömüldüğünün sorulacağı ayetine ters"],["“Benim babam da senin baban da cehennemde”","Babalar fetret ehli olduğu için kurtulmuştur; “baba” ile amca (Ebu Talib) kastedilmiş olabilir"]]}]},{"h":"Hadislerin Kur’an’la Çeliştiği İddiasını Değerlendirme","b":[{"k":"p","x":"Bir hadisin Kur’an’la çeliştiği iddiasında bulunmaktan kaçınmak gerekir. Mutezile’nin yaptığı gibi sahih hadisi red (günahkâr müslümanların cehennemden sonra cennete giremeyeceğini iddia etmek) ölçüyü kaçırmaktır."},{"k":"sc","q":"Hadis: Her Peygamber’in kabul olunmuş bir duası vardır… Ben ise duamı kıyamette ümmetime şefaat üzere geciktirdim. Ve o şefaat, ümmetimden ALLAH’a hiçbirşeyi şirk koşmadan ölenler içindir.","x":"Cevap: Mutezile bu hadisin Kur’an’la çeliştiğini söyler. Halbuki Kur’an’da yasaklanan şefaat, müşriklerin ALLAH dışında taptıkları putların şefaatidir. Ve diğer ayetlerde de şefaatin var olduğu açıkça belirtilmektedir."},{"k":"p","x":"Ancak Kur’an, şefaati 2 şartla ortaya koymuştur:"},{"k":"n","n":1,"x":"Şefaat, ALLAH’ın izninden sonra olacaktır."},{"k":"n","n":2,"x":"Şefaat, tevhid ehli için olacaktır."},{"k":"dikkat","x":"Üzülerek söylememiz gerekir ki asrımızda bazı mutezile yolundan gidenler şefaati kabul etmemekte ve Sahih Sünneti küçük görmektedirler."}]}],"ht":[{"s":0,"x":"Garanik rivâyeti putları inkâr eden ayetlere, “Kadınlarla istişare edin, söylediklerine muhalefet edin” rivâyeti anne-babanın danışarak sütten kesmesine dair ayete ters olduğu için reddedilmiştir."},{"s":1,"x":"Ayet yeryüzünde yetişen her bitkide zekât emreder; fakihler bunu yenilebilen, kurutulabilen, ölçülebilen ve saklanabilen şeylerle sınırlar; İbn Arabî ve Ebû Hanîfe yenilen her şeyde zekâtı farz kabul eder."},{"s":1,"x":"“Benim babam da senin baban da cehennemde” rivâyetinde babalar fetret ehli olarak kurtulmuştur; amca kastedilmiş olabilir. Nevevî: Rasulullah adamı teselli etmiştir."},{"s":2,"x":"Bir hadisin Kur’an’la çeliştiği iddiasından kaçınmak gerekir; Mu’tezile’nin yaptığı gibi sahih hadisi reddetmek ölçüyü kaçırmaktır."},{"s":2,"x":"Kur’an’da yasaklanan şefaat, putların şefaatidir. Kur’an’a göre şefaatin iki şartı: Allah’ın izninden sonra olması ve tevhid ehli için olması."}]},{"t":"Aynı Konudaki Hadisleri Birlikte Değerlendirme","intro":"Sünnet, aynı konudaki hadisler bir araya toplanınca daha doğru anlaşılır: elbiseyi uzatma ve pulluk (mihras) hadisleri örneği.","s":[{"h":"Aynı Konudaki Hadisleri Birlikte Değerlendirme","b":[{"k":"p","x":"Sünnet, aynı konuda gelen hadislerin bir araya toplanmasıyla daha doğru anlaşılabilir."},{"k":"dikkat","x":"Bir konudaki diğer hadislere bakmadan tek bir hadisin zahiriyle yetinmek çok defa hataya düşürür."},{"k":"sc","q":"Hadis: Üç kişi vardır ki ALLAH kıyamet günü onlarla konuşmaz. 1- Verdiğini başa kakmak için verip başa kakan 2- Yalan yeminle malına revaç sağlayan ve 3- Elbisesini uzatan kişi.","x":"Cevap: Bazı kimseler bu hadisten yola çıkarak, kısa elbise giymeyi İslam’ın başlıca alameti ve büyük farzlarından saymaktadırlar. Halbuki buradaki uzatma ifadesi, kibirlilik ile takyid edilmelidir. Çünkü bazı hadislerde Rasulullah, kibirle elbisesini uzatanları kastettiğini belirtmiştir."},{"k":"not","x":"İ. Nevevi ve İ. Hacer de bu görüştedir. Kasıtsız uzatmanın ise, Tenzihen Mekruh olması daha uygundur."},{"k":"sc","q":"Hadis: Bu aletin sokulduğu eve ALLAH mutlaka zelillik sokar (Aletten kasıt Pulluktur, (Mihras))","x":"Cevap: “Bir müslüman ziraat yapar veya ağaç diker de ondan, kuş, insan veya hayvan yerse, onun bu yediği müslüman için sadaka olur” hadisine terstir. Aslında burada yasaklanan Mihras aleti değil, ziraatle meşgul olup da farz olan (Cihat gibi) görevini terk etmesidir. Başka bir görüşe göre ise bu aletin yasak olması, düşmana yakın olan kimse içindir."},{"k":"tbl","r":[["Hadis","Birlikte değerlendirilince"],["Elbisesini uzatan kişi","Uzatma kibirlilik ile takyid edilir; kasıtsız uzatma tenzihen mekruh"],["Pulluğun (mihras) girdiği eve zillet","Yasaklanan alet değil, ziraatle meşgul olup farz görevi (cihat gibi) terk etmektir; ya da düşmana yakın olan kimse içindir"]]}]},{"h":"Sonuç","b":[{"k":"p","x":"Bu iki hadisten anlıyoruz ki bir konuda gelen bütün hadisleri değerlendirmeden amel etmeye kalkarsak hata etmemiz çok fazla olur. Zira hadisler birlikte değerlendirilirse, bazısı bazısını destekler, çelişir, açıklar veya sınırlandırabilir."}]}],"ht":[{"s":0,"x":"Tek bir hadisin zahiriyle yetinmek çok defa hataya düşürür; aynı konudaki hadisler bir araya toplanmalıdır."},{"s":0,"x":"Elbiseyi uzatma hadisi kibirlilikle takyid edilir (Nevevî ve İbn Hacer); kasıtsız uzatma tenzihen mekruhtur."},{"s":0,"x":"Pulluk (mihras) hadisi, ekip-dikmeyi sadaka sayan hadise terstir; kastedilen, ziraatle meşgul olup farz görevi terk etmektir."},{"s":1,"x":"Hadisler birlikte değerlendirilince bazısı bazısını destekler, çelişir, açıklar veya sınırlandırır."}]},{"t":"Esbâb-ı Vürûd: Amaç ve Aracın Ayırt Edilmesi","intro":"Hadislerin bina edildiği sebep ve illetler, sahabe ve tabiunun nassların illet ve bağlamlarına bakması, değişen örf üzerine kurulan nasslar, lafız ile ruh, değişken araç ile sabit amaç.","s":[{"h":"Esbâb-ı Vürûdun Dikkate Alınması","b":[{"k":"p","x":"Hadislerin doğru anlaşılmasının hususlarından birisi de, bina edildikleri sebepler veya belli bir illete bağlı olup olmadıklarıdır. Bu durum hadiste açıkca ifade edilebilir, hadisten çıkartılabilir ya da hadisteki olayın bağlamından anlaşılabilir."},{"k":"sc","q":"Hadis: Sizler dünya işlerinizi daha iyi bilirsiniz.","x":"Cevap: Bu hadis hurma aşılama kıssası ile ilgilidir. Rasulullah, zanna dayanan bir görüşüne işaret etmiş ve aşılama yaptırmamıştı. Halbuki ziraat ehli değildi. Aşılama yapmayan sahabe, hurmalarda kötü sonuç elde edince Rasulullah bu hadisi söylemiştir."},{"k":"sc","q":"Hadis: Ben müşrikler arasında oturan her müslümandan uzağım. Çünkü onlar birbirlerinin ateşlerini görmemektedirler.","x":"Cevap: Mekke’den, Rasulullah’ın yanına hicret etmeleri vacip olan müslümanların, Hassan bölgesine gönderilen birlik tarafından, müşrikler arasında bulundukları için (müslüman olduklarını ifade ederek secde etmelerine rağmen) öldürülmesi sonucu bu hadis söylenmiş ve müşrikler içinde bulunan müslümanların farkedilemeyeceği belirtilmiştir. Dolayısıyla bu hadis, “öldürüldüğü zaman kanlarından beriyim” manasındadır. Çünkü müşriklerin içinde bulunan müslüman, kendini buna arz etmiş olur."},{"k":"sc","q":"Hadis: Bir kadın ancak kocası veya mahremi ile yolculuk yapabilir.","x":"Cevap: Bu yasağın gerekçesi, yolculuğun deve, katır gibi vasıtalarla yapıldığı zamanda ve genelde yerleşim yerinden uzak, ıssız çöllerde olduğundan, kadının kendisine bir zarar gelmesi ya da kötü dedikoduların yayılmaması endişesinden söylenmiştir. Fakat günümüzde uçak gibi araçlar ile yüzlerce kişi güvenli bir şekilde yolculuk yapabilmektedir. Ayrıca “Bir kadının Hîre denilen yerden çıkıp kocası olmadan Beyt’e gelmesi yakındır” hadisi de bu düşüncemizi desteklemektedir. Bazı imamlar güvenilir bir kadın yeter demekte ve bazı imamlar ile Şafilerden Mühezzeb sahibi, kadının tek başına yolculuk yapabileceğini söylemektedir."},{"k":"sc","q":"Hadis: İmamlar Kureyş’tendir.","x":"Cevap: Kureyş’li olma şartı, onlarda bulunan asabiyet ve üstünlük sebebiyledir. Aynı zamanda Kureyş ehli ticaret ile uğraştığı için yönetici vasfı bulunmakta idi. Diğer bölgelerde ise genelde ziraatle uğraşıldığından yöneticilik vasfı daha zayıftı."},{"k":"tbl","r":[["Hadis","Sebep / illet"],["“Sizler dünya işlerinizi daha iyi bilirsiniz.”","Hurma aşılama kıssası"],["“Müşrikler arasında oturan her müslümandan uzağım.”","Müşrikler arasındaki müslümanların farkedilemeyip öldürülmesi"],["“Kadın ancak kocası veya mahremi ile yolculuk yapabilir.”","Issız çöllerde deve ve katırla yolculukta zarar ve dedikodu endişesi"],["“İmamlar Kureyş’tendir.”","Kureyş’teki asabiyet, üstünlük ve ticaretten gelen yönetici vasfı"]]}]},{"h":"Sahabe ve Tabiunun Nassların İllet ve Bağlamlarına Bakma Yöntemleri","b":[{"k":"p","x":"Bu yöntemi ilk uygulayan sahabe ve tabiundur. Onlar, bazı hadislerin Rasulullah döneminde belirli bir durumu ele aldığını gördükleri için sonradan bu durum değişince hadisin zahiri ile ameli terketmişlerdir."},{"k":"ornek","x":"1. Örnek: Nebi Hayber’i fetheden sahabiler arasında paylaştırmış, fakat Hz. Ömer Irak arazisini fetheden müslümanlar arasında paylaştırmamıştır. Çünkü müslümanların maddi durumu artık iyiydi."},{"k":"ornek","x":"2. Örnek: Rasulullah, kayıp develerin toplanmasını yasakladı ve soran kişiye “Ondan sana ne? Onu kendi haline bırak. Çünkü güçlü ayakları ve bünyesinde suyu vardır. Sahibi bulana kadar suyunu içer, ağaçlardan yer.” dedi. Sonra Hz. Osman döneminde kayıp develer çoğalınca, Hz. Osman, develerin toplatılıp ilan edilmesini, sahibi çıkmazsa satılmasını emretti ve sahibi çıkarsa parasının ona iade edilmesini söyledi. Hz. Ali döneminde ise kayıp develere Beytül Mal’dan bakılması ve sahibi çıkınca teslim edilmesi emredildi."},{"k":"not","x":"Sonuç: Halifeler, Rasulullah’ın emrine muhalefet etmedi, asıl maksadına uydu ve develerin zayi olmasını önledi."},{"k":"tbl","r":[["Dönem","Kayıp develer"],["**Rasulullah**","Toplanması yasak; kendi haline bırakılır"],["**Hz. Osman**","Toplatılıp ilan edilir; sahibi çıkmazsa satılır, çıkarsa parası iade edilir"],["**Hz. Ali**","Beytülmal’dan bakılır; sahibi çıkınca teslim edilir"]]}]},{"h":"Nassların Değişen Bir Örf Üzerine Kurulması","b":[{"k":"sc","q":"Hadis: Buğday ile buğday, aynı şekilde arpa, hurma, tuz ölçeği ölçeğine, misli misline, altın ile gümüş ise tartısı tartısına fazlalık alınmaksızın değiştirilir. (Ribevi mallar ile ilgili görüş)","x":"Cevap: Ebu Yusuf: Burada sözü geçen ölçek veya tartı ile ilgili örfe bağlı bir husus olduğunu söyler. Ebu Hanife: Ölçü ve tartı ile fazlalığı haram kılınan mallarda ebediyyen ölçü ve tartı geçerlidir."},{"k":"sc","q":"Örnek: Nakit paraların zekatında gümüşün 200 dirhem (595 gr) altının 20 miskal (85 gr) olarak iki nisab belirlemesi.","x":"Cevap: Rasulullah iki nisab belirlemeyi kastetmiş değildir. Aksine tek bir nisab kastetmiştir. O zaman bir dinar on dirhemdi. Günümüzde gümüşün aşırı derece düşmüş olması arada büyük bir uçurum meydana getirmiştir."},{"k":"sc","q":"Örnek: Rasulullah, hata ile ve kasta benzer (şibh-i amd) öldürmelerde katilin akrabaları olan akilenin diyeti ödemesine hükmettiği hadis. (Akile = Kişiye yardım eden bakımını üstlenen kişi; Rasulullah döneminde erkek akrabalar idi)","x":"Cevap: İbn Hacer: Akile, kişiye yardım eden ve ona destek olan kimselerdir. Rasulullah döneminde kişiye bakan en yakın erkek akrabaları olduğu için bu ödemeyi onlara yüklemişti. Hz. Ömer döneminde bu diyet ödemesi divana yüklenmiştir."},{"k":"p","x":"Birinci görüşü ele alanlar diyetin akrabalara ödetilmesi gerektiğini söylemişlerdir. İkinci görüş ise yer ve zamana göre kişiye kim bakıyorsa, onun ödemesi gerektiğidir. Şeriatte belirlenen yardımcılar mı, yoksa zahiren bakan kimseler mi olduğu konusunda fukaha ihtilaf etmiştir."},{"k":"d","t":"Âkile","x":"Kişiye yardım eden ve ona destek olan kimseler. Rasulullah döneminde kişiye bakan en yakın erkek akrabalardı; Hz. Ömer döneminde diyet ödemesi divana yüklenmiştir."},{"k":"sc","q":"Hadis: Fıtr sadakasının bayram sabah namazından sonra, bayram namazından önce verilmesinin emredilmesi.","x":"Cevap: Sahabe döneminde toplum genişleyip insanlar çoğalınca, fıtr vermek için bayram sabahı yetmiyordu ve bir iki gün önceden veriyorlardı. İşte sahabenin bu davranışı, ince kavrayışlarındandır. Yine Fıtr sadakasının belirli mallardan verilmesi yerine Hanefilerin de dediği gibi günün ihtiyacına göre verilmesi daha uygun olmaktadır."},{"k":"tbl","r":[["Nass","Değişen örf"],["Ribevî mallarda ölçek ve tartı","Ebû Yûsuf: örfe bağlıdır · Ebû Hanîfe: ebediyyen ölçü ve tartı geçerlidir"],["Zekâtta iki nisab (200 dirhem gümüş, 20 miskal altın)","O zaman bir dinar on dirhemdi; tek nisab kastedilmiştir"],["Diyeti âkilenin ödemesi","Rasulullah döneminde erkek akrabalar, Hz. Ömer döneminde divan"],["Fıtr sadakasının bayram sabahı verilmesi","Sahabe döneminde bir iki gün önceden verildi"]]}]},{"h":"Lafız ile Ruh veya Zahir ile Maksatlar Arasında Sünnet","b":[{"k":"p","x":"Sünnete harfiyyen sarılmak, dış görünüşüyle ona sarılmak gibi olsa da bazen sünnetin ruhunu ve ondan kastolunanı yerine getirmek olmayacağı gibi hatta onun tam zıddı bile olabilir."},{"k":"ornek","x":"Mesela; Ebu Hanife’nin fıtr sadakası hakkındaki nakit olarak bedelinin verilmesi görüşüne şiddetle karşı çıkanlar gibi. Karşı çıkanların delilleri ise Rasulullah’ın, hurma, kuru üzüm, buğday, arpa gibi belirlediği bazı gıdaların bulunmasıdır. Bize düşen görüşümüzle sünnete ters düşmemektir."}]},{"h":"Hadisteki Değişken Araç ile Sabit Amacın Birbirinden Ayırt Edilmesi","b":[{"k":"p","x":"Sünneti anlamada hataya düşme sebeplerinden birisi de amaçlarla, bu amaçlara ulaşmada ona yardım eden araçları birbirine karıştırmaktır. Sünneti anlamada derinleşen kişi bilir ki, önemli olan hedeftir. Hedefe ulaşırken araçlar, çevre ve örf gibi etkenlerle değişebilir."},{"k":"sc","q":"Örnek: Hacamat yaptırmayı, buhur kökünü, hind ağacını ve çörek otunu öven hadisler.","x":"Açıklama: Kanaatimce bu hadislerde anlatılanlar, nebevi tıbbın ruhu değildir. Burada asıl amaç, insan sağlığı ve hayatını korumak, vücut sağlamlığını muhafaza etmek vb. şeylerdir. Vesileler ise asırdan asıra, nesilden nesile değişebilir. (Mesela kan aldırmanın sağlığa faydalı olduğu söylenebilir.)"},{"k":"sc","q":"Ayet: Onlara karşı gücünüzün yettiği kadar kuvvet ve cihat için bağlanıp beslenen atlar hazırlayın.","x":"Açıklama: Hiç kimse buradaki kuvvet hazırlamayı sadece “atlar” olarak anlamamıştır. Herkes kendi asrındaki atları (tanklar, zırhlar, silahlar vb.) hazırlama olarak anlamıştır."},{"k":"sc","q":"Hadis: “Atların alınlarına kıyamete kadar sevap, dünyada da ganimet bağlanmıştır” (At yetiştirmenin faziletini anlatıyor bu hadis)","x":"Açıklama: Bu hadisi herkes kendi asrında keşfedilen attan daha üstün araçlar için yorumlamıştır. Tank, top, tüfek, silah gibi aletler bulundurmak gibi."},{"k":"sc","q":"Hadis: “ALLAH yolunda kim bir ok atarsa O’na şu kadar sevap vardır.”","x":"Açıklama: Buradaki ok atma, sonradan icat edilen top, tüfek, füze gibi bütün araçlar için anlaşılmalıdır."},{"k":"sc","q":"Hadis: “Misvak dişleri temizleyici ve Rabbi de hoşnut edicidir.”","x":"Açıklama: Burda kastedilenin, misvakın kendisi olmadığı kanaatindeyim. Misvak, arap yarımadasında diş temizleme için en kolay ulaşılabilen bir araç olduğundan Nebi tarafından zikredilmiştir. Asrımızda diş fırçası ve macunun (özellikle evde ve yemekten sonra) misvağın yerine geçmesi uygundur."},{"k":"sc","q":"Hadis: Tartı Mekke’lilerin tartısıdır. Ölçü de Medine’lilerin ölçüsüdür.","x":"Açıklama: Burada da belirteceğimiz şey, zaman-mekan ve halin değişmesiyle bunların da değişeceğidir. Yani değişmeyen taabbudi bir emir değildir. Basiret sahibi kimse hadisin asıl hedefini anlar ve insanların, en ince birimlere kadar ölçülerini birleştirmesi gerektiği sonucuna ulaşır."},{"k":"sc","q":"Hadis: Ramazan hilalini gördüğünüzde orucunuzu tutun, Şevval hilalini görünce iftar edin… (Ru’yetü Hilal)","x":"Açıklama: Burada amaç, Ramazan ayının tamamını oruçlu geçirmek, ondan bir gün bile kaçırmamaktır. Araç ise Hilalin gözetlenmesidir. Bir başka hadiste “Biz ümmi bir topluluğuz, yazma ve hesap bilmeyiz. Ay bazen şöyle, bazen şöyledir…” Hilalin o dönemde gözle görülmesi, insanlar için en kolay vesile idi. Asrımızda astronomi ilminin gelişmesiyle hilal en ince ayrıntısına kadar gözetlenmektedir. Asrımızda vesile/araç, astronomi ilmi olmalıdır."},{"k":"tbl","r":[["Nass","Sabit amaç","Değişken araç"],["Hacamat, buhur kökü, hind ağacı, çörek otu","İnsan sağlığı ve hayatını korumak","Tedavi vesileleri"],["Kuvvet ve bağlanıp beslenen atlar (ayet)","Kuvvet hazırlamak","Atlar → tanklar, zırhlar, silahlar"],["Atların alınlarına sevap ve ganimet","At yetiştirmenin fazileti","Attan üstün araçlar: tank, top, tüfek"],["Allah yolunda ok atmak","Allah yolunda güç kullanmak","Ok → top, tüfek, füze"],["Misvak","Dişleri temizlemek","Misvak → diş fırçası ve macun"],["Mekkelilerin tartısı, Medinelilerin ölçüsü","Ölçülerin birleştirilmesi","Dönemin tartı ve ölçüsü"],["Ru’yet-i hilâl","Ramazanın tamamını oruçlu geçirmek","Gözle gözetleme → astronomi ilmi"]]}]}],"ht":[{"s":0,"x":"Hadisin sebep ya da illete bağlı olduğu hadiste açıkça ifade edilebilir, hadisten çıkarılabilir ya da olayın bağlamından anlaşılabilir."},{"s":0,"x":"Kadının mahremsiz yolculuk yasağının gerekçesi ıssız çöllerde zarar ve dedikodu endişesidir; bazı imamlar güvenilir bir kadını yeterli görür, Mühezzeb sahibi tek başına yolculuğa cevaz verir."},{"s":0,"x":"“İmamlar Kureyş’tendir” şartı, Kureyş’teki asabiyet ve üstünlük sebebiyledir."},{"s":1,"x":"Nassların illet ve bağlamına bakma yöntemini ilk uygulayanlar sahabe ve tabiundur."},{"s":1,"x":"Hz. Ömer Irak arazisini fethedenler arasında paylaştırmadı; Hz. Osman ve Hz. Ali kayıp develer konusunda Rasulullah’ın asıl maksadına uydu."},{"s":2,"x":"Ribevî mallarda ölçek ve tartı: Ebû Yûsuf’a göre örfe bağlıdır, Ebû Hanîfe’ye göre ebediyyen geçerlidir."},{"s":2,"x":"Zekâtta iki nisab: o dönemde bir dinar on dirhem olduğundan tek nisab kastedilmiştir."},{"s":2,"x":"Âkile: Rasulullah döneminde erkek akrabalardı; Hz. Ömer diyet ödemesini divana yükledi."},{"s":2,"x":"Fıtr sadakasını sahabe bir iki gün önceden verirdi; Hanefîlere göre günün ihtiyacına göre verilmesi uygundur."},{"s":3,"x":"Sünnete harfiyyen sarılmak bazen sünnetin ruhunu yerine getirmemek, hatta onun zıddı olabilir (fıtr sadakasının nakit verilmesi örneği)."},{"s":4,"x":"Sünneti anlamada hataya düşme sebeplerinden biri amaçla aracı karıştırmaktır; önemli olan hedeftir, araçlar çevre ve örfle değişebilir."},{"s":4,"x":"Misvak yerine diş fırçası ve macun; ok yerine top, tüfek, füze; at yerine tank ve zırh."},{"s":4,"x":"Ru’yet-i hilâlde amaç Ramazanın tamamını oruçlu geçirmektir; asrımızda vesile astronomi ilmi olmalıdır."}]},{"t":"Hakikat ve Mecazın Dikkate Alınması","intro":"Hadisi anlamada hakikat ile mecazın ayırt edilmesi, ahkâm hadislerinde mecaz, mecaz kapısının kapanmasının sonuçları, mecazî yorumda aşırılık ve reddedilen mecazî yorumlar.","s":[{"h":"Hadisi Anlamada Hakikat ile Mecazın Ayırt Edilmesi","b":[{"k":"sc","q":"Hadis: Rasulullah, hanımlarına; “Bana en çabuk kavuşacak olanınız kolu en uzun olanınızdır…” buyurdu.","x":"Açıklama: Bunu duyan annelerimiz lafzı gerçek manada anladı. Hatta Hz. Ayşe annemiz hemen ölçmeye başladı. Halbuki burada, hayırda ve iyilikte kolu uzun olan kastedilmektedir. Gerçekten de Zeynep Bint Cahş elleriyle birşeyler yapar ve hayırda bulunurdu. İlk olarak O vefat etti."},{"k":"sc","q":"Ayet: Siyah iplik beyaz iplikten ayrılıncaya kadar yeyin için…","x":"Açıklama: Bu ayeti hakiki manasında anlayan Adiy b. Hatim, iki parça ip alarak yastığın altına koyduğunu söylüyor. Rasulullah’a yaptığını anlatınca “O halde yastığın bir hayli geniş. Bu ancak gecenin siyahlığının, gündüzün beyazlığından ayrılmasıdır” cevabını alıyor."},{"k":"sc","q":"Hadis-i Kudsî: Kulum bana bir karış yaklaşırsa, ben ona bir dirsek yaklaşırım, bir dirsek yaklaşırsa ben ona bir kulaç yaklaşırım. Yürüyerek gelirse, koşarak gelirim.","x":"Açıklama: ALLAH burada, kim kendisine itaat ederse, ona sevap vermekte hızlı davranacağını ifade ediyor. Yürüme ve koşmayı bundan kinaye ediyor."},{"k":"sc","q":"Hadis: Cehennem “Ey rabbim, bir kısmım bir kısmımı yedi...” diye şikâyette bulundu. ALLAH, bir nefes kış, bir nefes yaz ayında olmak üzere cehenneme, iki defa nefes alması için izin verdi. Duyduğumuz sıcağın en şiddetlisi ile soğuğun en şiddetlisi işte budur.","x":"Açıklama: Burada anlatılmak istenen, cehennemde çok sıcak ve çok soğuk azap türlerinin bulunmasıdır."},{"k":"sc","q":"Hadis: Cennetlikler ve cehennemlikler yerlerine gidince, ölüm cennet ile cehennem arasına konulur ve kesilir……….","x":"Açıklama: Ölüm nasıl olur da kesilebilir ki? Ya da ölüm nasıl ölebilir ki? Ölüm mânâlardan bir mânâ ve arazlardan bir arazdır. Bunlar ise soyut şeylerdir. Somut cisimlere veya hayvanlara dönüşemezler ki kesilsinler? Ancak burada ölümün artık gelmeyeceğini anlatmak için mecazi bir ifade kullanılmış olabilir."},{"k":"tbl","r":[["İfade","Kastedilen"],["“Kolu en uzun olanınız”","Hayırda ve iyilikte kolu uzun olan (Zeynep bint Cahş)"],["“Siyah iplik beyaz iplikten ayrılıncaya kadar”","Gecenin siyahlığının gündüzün beyazlığından ayrılması"],["“Yürüyerek gelirse koşarak gelirim”","İtaat edene sevap vermekte hızlı davranmak (kinaye)"],["Cehennemin iki nefesi","Cehennemde çok sıcak ve çok soğuk azap türlerinin bulunması"],["Ölümün kesilmesi","Ölümün artık gelmeyeceği (mecazî ifade)"]]}]},{"h":"Ahkâm Hadislerinde Mecaz","b":[{"k":"p","x":"Mecaz, ahkam hadislerinde de geçer."},{"k":"sc","q":"Hadis: Birinizin, demirden bir iğne ile dürtüklenmesi, kendisine helal olmayan bir kadına dokunmasından daha hayırlıdır.","x":"Açıklama: Buradaki dokunma (Lems) kelimesi, Abdullah İbn Abbas’ın söylediği gibi, Kur’an’daki “El-Lems” “El-Mülamese” kelimeleri ile aynı anlamda olup cinsi birleşmeden birer kinayedir. “Ey iman edenler, mümin kadınları nikahlayıp da henüz onlara dokunmadan (mess) boşarsanız, onları iddet müddetince bekletmeniz gerekmez” ayetinde geçen “El-Mess” kelimesini, Zahiriler de dahil bütün müfessirler cinsi birleşme olarak tefsir etmişlerdir. O halde bu hadiste, şehvetle olmayan ve fitne çıkmasından korkulmayan mücerret bir tokalaşmanın haram olduğuna delalet eden bir şey yoktur."}]},{"h":"Çağdaş Kültürle Yetişen Kimselere Mecaz Kapısının Kapanması","b":[{"k":"p","x":"Çağdaş Kültürle Yetişen Kimselere Mecaz Kapısının kapanması durumunda; yani nassın aslî ve harfî manasında anlaşılması durumunda, bu kimselere sünneti anlamaktan hatta İslam’ı anlamaktan yüz çevirtmektir."},{"k":"sc","q":"Hadis: Humma (sıtma) Hastalığı cehennem ateşindendir, onu su ile soğutunuz.","x":"Açıklama: Burada anlatılmak istenen, bu hastalığın çok ateşli bir hastalık olduğudur. Mesela sıcak bir gün olduğunda “Sanki Cehennemden bir gün” deriz."},{"k":"sc","q":"Hadis: Nil ve Fırat (Nehri) cennettendir.","x":"Açıklama: İbn Hazm: Akıl sahibi kimse bu nehirlerin kaynağının yerden olduğunu bilir. Bu nehirler bereketli olduğu için cennete izafe edilmiştir. Yine “Evim ile Minberimin arası, cennet bahçelerinden bir bahçedir” hadisinde olduğu gibi amaç orasının faziletini belirtmek içindir. Hacerul Esved cennettendir hadisi de böyledir."}]},{"h":"Mecazi Yorumlarda Aşırıya Kaçmaktan Sakınılması","b":[{"k":"sc","q":"Hadis: Kim bir sidre (kiraz) ağacı keserse ALLAH onun başını cehennemden aşağı sarkıtır.","x":"Açıklama: Buradaki sidre ağacını sadece Harem bölgesindeki ağaç diye sınırlandıran bazı kimseler vardır. Bu büyük bir hatadır. Ebu Davud ise; bir yolcunun veya hayvanların gölgelendiği çölde ve sahradaki ağaçların boş yere zalimlik sebebiyle kesilmesi durumda ALLAH onun başını cehennemden aşağı sarkıtır diye açıklamaktadır. (ALLAH en iyisini bilir)"}]},{"h":"Reddedilen Mecazi Yorumlar","b":[{"k":"p","x":"Reddedilen Mecazi Yorumlar da Vardır: Ne ibarede ve ne de metnin akışı içerisinde herhangi bir delil olmadan yapılan batıni yorumlar reddedilir."},{"k":"li","x":"1. Örnek: Sahur yapınız. Çünkü sahurda bereket vardır hadisindeki “Sahur” kelimesini “istiğfar” olarak yorumlamak körü körüne bir zorlamadır. Kur’an’da ve sünnette istiğfara teşvik edilmiştir. Fakat bu hadiste böyle bir mana düşünülmesi çok zordur."},{"k":"li","x":"2. Örnek: Deccal hakkında varid olan hadislerin, batı medeniyeti olarak yorumlanması yine reddedilir. Hadislerde Deccal kör olarak nitelendirilirken, batı medeniyetinin de kör olduğunu söyleyip, insana bir tek gözle baktığını, onun da madde olduğunu iddia ederek Deccal batı medeniyetidir demek biraz zorlama bir yorum olur. Çünkü diğer hadislerde deccal hakkında sabit olan girip-çıkma, propaganda yapma, bozgunculuk çıkarma ve tehdit etme gibi vasıflarına ters düşmektedir. Bu konuda o kadar çok hadis vardır ki tevatür derecesine ulaşmıştır."},{"k":"li","x":"3. Örnek: Hz. İsa’nın ineceği ile ilgili hadisleri (Tevatür derecesine ulaşmasına rağmen) bazı kimselerin, “İsa Mesih’ten kasıt, barış ve [[güvenliği]] simgeleyen bir asırdır” diye yorumlamaları yanlıştır. Bu tür yorumlar “Meryem oğlu İsa adil bir hükümle inecek ve haçı kıracak, domuzu öldürecek ve islamı kabul edecektir” gibi sahih hadislere tamamen ters düşmektedir."},{"k":"not","x":"NOT: İbn Teymiyye, Kur’an, Hadis ve Lafızdaki bütün mecazı kabul etmemektedir. (İbn Teymiye bütün mecazı reddediyor)"},{"k":"tbl","r":[["Reddedilen yorum","Neden reddedilir?"],["Sahur = istiğfar","Hadiste böyle bir mana düşünülmesi çok zordur; körü körüne zorlamadır"],["Deccal = batı medeniyeti","Deccalin tevatür derecesindeki hadislerde sabit vasıflarına ters düşer"],["Hz. İsa’nın inişi = barış asrı","Hz. İsa’nın ineceğine dair sahih hadislere tamamen ters düşer"]]}]}],"ht":[{"s":0,"x":"“Kolu en uzun olanınız”: hayırda kolu uzun olan; ilk vefat eden Zeynep bint Cahş."},{"s":0,"x":"Adiy b. Hâtim ayeti hakiki manada anlayıp yastığının altına iki ip koymuştu; kastedilen gecenin gündüzden ayrılmasıdır."},{"s":0,"x":"Ölüm bir mânâ ve arazdır; “ölümün kesilmesi” ölümün artık gelmeyeceğini anlatan mecazî bir ifade olabilir."},{"s":1,"x":"Ahkâm hadislerinde de mecaz vardır: “dokunma” (lems) İbn Abbas’a göre cinsî birleşmeden kinayedir; hadis mücerret tokalaşmanın haram olduğuna delalet etmez."},{"s":2,"x":"Mecaz kapısının kapanması, çağdaş kültürle yetişenlere sünneti, hatta İslâm’ı anlamaktan yüz çevirtmektir."},{"s":2,"x":"Humma cehennem ateşindendir: hastalığın çok ateşli olduğu anlatılır. Nil ve Fırat cennettendir: bereketleri için cennete izafe edilmiştir (İbn Hazm)."},{"s":3,"x":"Sidre ağacı hadisi: yalnızca Harem bölgesine sınırlamak büyük hatadır; Ebû Dâvûd’a göre yolcuların ve hayvanların gölgelendiği ağaçların boş yere kesilmesidir."},{"s":4,"x":"İbarede ve metnin akışında delil olmadan yapılan bâtınî yorumlar reddedilir: sahur = istiğfar, Deccal = batı medeniyeti, Hz. İsa’nın inişi = barış asrı."},{"s":4,"x":"İbn Teymiyye Kur’an, hadis ve lafızdaki bütün mecazı reddeder."}]},{"t":"Gaybî Olan ve Olmayanın Bilinmesi","intro":"Hadisin anlaşılmasında gayb âlemiyle ilgili hususları gaybî olmayanlardan ayırmak: cennetteki ağaç ve cehennemdeki kâfirin dişi hadisleri.","s":[{"h":"Gaybi Olan ile Gaybi Olmayan Hususları Birbirinden Ayırt Etmek","b":[{"k":"p","x":"Sünnet, gayb alemi ile ilgili konular üzerinde de durmuştur. Mesela melekler, cinler, şeytanlar, arş, kürsi, levhi mahfuz, kabir sorgusu, kabir hayatı, berzah alemi, kıyamet alametleri, büyük şefaat, mizan, hesap, sırat, cennet, cehennem gibi hususlara detaylıca yer vermiştir."},{"k":"sc","q":"Hadis: Şüphesiz cennette öyle bir ağaç vardır ki, süvari onun gölgesinde yüz sene gider de onun gölgesini asla bitiremez.","x":"Açıklama: Bu hadis Buhari ve Müslimin ittifak ettiği bir hadistir. Zahir olan, buradaki yüz senenin dünya senelerinden olmasıdır. Fakat dünyadaki zaman ile ALLAH katındaki zaman oranını ancak ALLAH bilebilir. Hadis sahih olduğu için, dünyanın kanunları ile ahiret kanunlarının bir olmayacağı düşüncesiyle içten gelerek “iman ettik, tasdik ettik” demekten başka bir şey yapamayız."},{"k":"sc","q":"Hadis: Cehennemde, kafirin dişinin uhud dağı kadar büyük, iki omzunun arası çok geniş olduğu hakkındaki hadis.","x":"Açıklama: Başarılı bir davetçi, bilinmesi halinde dünya ve ahiretine fayda sağlamayacak türden bilgiler ve problemlere yol açacak hadislerle meşgul olmaz. Nassın getirdiği şeylere iman ederiz, hakikatını ve nasıl olduğunu sormayız. Çünkü bizim aklımız bu tür şeyleri çoğu zaman almaktan aciz kalır."},{"k":"dikkat","x":"Gaybî konularda nassın getirdiği şeylere iman ederiz; hakikatini ve nasıl olduğunu sormayız. Aklımız bu tür şeyleri çoğu zaman almaktan aciz kalır."}]}],"ht":[{"s":0,"x":"Sünnet gayb âlemine dair konulara (melekler, cinler, arş, kürsî, levh-i mahfuz, kabir, berzah, kıyamet alametleri, şefaat, mizan, hesap, sırat, cennet, cehennem) detaylıca yer vermiştir."},{"s":0,"x":"Cennetteki ağaç hadisi Buhârî ve Müslim’in ittifak ettiği bir hadistir; dünya ile Allah katındaki zaman oranını ancak Allah bilir, “iman ettik, tasdik ettik” denir."},{"s":0,"x":"Başarılı bir davetçi, dünya ve âhirete fayda sağlamayacak ve problemlere yol açacak bilgilerle meşgul olmaz."}]},{"t":"Hadis Tercüme ve Yorumunda Esaslar ve Hatalar","intro":"Hadislerin tercüme ve yorumunda dikkat edilmesi gereken esaslar ve sık rastlanan hatalar: tercümenin önemi, hata oranı, doğru tercüme için dört metod ve mütercimin sorumluluğu.","s":[{"h":"Tercümenin Önemi","b":[{"k":"p","x":"Hadis tercümeleri, hadisleri öğrenmemizin ilk adımı olduğu için bu ilk adımda karşılaşılan hatalı aktarımlar nebevî beyanlardan istifade imkânımızı baştan kesecek, bu hatalı aktarımlar üzerine bina edilen her türlü anlayış ve davranış hatalı olmaktan kurtulamayacaktır. Mânen hadis rivayeti mesabesinde olan tercümenin yanlış olması, Resûl-i Ekrem’e ait olmayan bir sözün O’na nispetine yol açmaktadır. Bu bağlamda, günümüzde çok yoğun bir şekilde sürdürülen tercüme faaliyetlerinin ne derece sağlıklı bilgiler ürettiğinin tetkiki çok büyük önemi hâizdir."},{"k":"dikkat","x":"Tercüme mânen hadis rivayeti mesabesindedir; yanlış tercüme Resûl-i Ekrem’e ait olmayan bir sözün O’na nispetine yol açar."}]},{"h":"Hata Oranı ve Değerlendirme","b":[{"k":"p","x":"Çalışmamızda, son senelerde yapılmış hadis tercümelerinde sık rastlanan hata çeşitleri kapsamlı ve sistematik bir şekilde ele alınmaya çalışılmış, bu hataların mahiyetleri araştırılarak bunlardan kaçınmak için dikkat edilmesi gerekli esaslar tespit edilmiştir. Makalemizde, son senelerde yapılmış pek çok eserde yer alan ciddi tercüme hataları tespit edilmekle beraber tercüme edilmiş tüm hadis kitaplarının, tercümelerin sıhhati açısından, aynı seviyede olduğunu söylemek mümkün değildir. Bu eserlerin baştan sona tetkiki sonucu, hadis akademisyenlerinin yaptığı çevirilerin daha başarılı olduğu görülmektedir."},{"k":"p","x":"Ayrıca, başta belirttiğimiz üzere, yaklaşık yetmiş bin hadis tercümesi içinden yaklaşık iki bin tercüme hatası tespit edilmesi, hata oranının 35 hadiste bir olduğunu göstermektedir. Bu düşük oran da tercüme edilmiş bulunan hadis kitaplarına duyulacak güveni sarsacak bir seviyede değildir. Ancak, söz konusu olan, Müslümanların hayat rehberi konumundaki hadisler olduğu için elbette büyük bir hassasiyet gerektiği kanaatindeyiz. Nitekim bu makale de böyle bir hassasiyetin neticesidir."},{"k":"tbl","r":[["Tespit","Değer"],["İncelenen hadis tercümesi","Yaklaşık yetmiş bin"],["Tespit edilen tercüme hatası","Yaklaşık iki bin"],["Hata oranı","35 hadiste bir"],["Daha başarılı çeviriler","Hadis akademisyenlerinin yaptığı çeviriler"]]}]},{"h":"Daha Sağlıklı Tercüme İçin Teklifler","b":[{"k":"p","x":"Çalışmamız sonucunda hadis tercümeleri hakkında bazı değerlendirmelerde bulunmak ve daha sağlıklı tercümeler yapmak için bazı teklifler sunmak mümkündür. Makalemizde incelenen hadislerin büyük çoğunluğu, çok az zahmetle doğru tercüme edilebilecek durumda iken maalesef gerekli zaman ve ihtimam gösterilmediği için mâna zâyi edilmekte, fahiş hatalar ortaya çıkmaktadır."},{"k":"p","x":"Kelime ve ifadelerin mânaları için **İbnü’l-Esîr**’in en-Nihâye fî ğarîbi’l-hadîs isimli eserine, yine hem bu maksatla hem de cümle yapılarını daha iyi çözmek için basit ta’lik çalışmalarına müracaat edilse, hadislerin büyük çoğunluğunda yanlış tercümelerin önüne geçilebilecektir. Bazı hadislerde daha kapsamlı şerhlere müracaat veya hadisin diğer tariklerini mukayese ihtiyacı olabilmekle beraber yukarıda bahsettiğimiz şekilde asgarî zahmetle muhtemel fahiş hatalar önlenebilecektir."},{"k":"p","x":"Ayrıca, her zaman doğru sonuç vermemekle beraber, hadisin daha önceki muteber tercümeleriyle de mukayese durumunda bir hatanın önüne geçilebilir. Örneğin, www.sunnah.com sitesinde Kütüb-i Sitte kaynaklarının muteber İngilizce tercümeleri mevcut olup hatalı tercüme yok denecek kadar azdır. Türkçede de hatalı bazı çeviriler içermesine rağmen, Mehmet Sofuoğlu’nun Buhârî tercümesi gibi bazı kaynaklarla mukayese yapılarak doğru tercüme için ilk planda bir fikir sahibi olunabilir."}]},{"h":"Doğru Tercüme İçin Dört Metod","b":[{"k":"p","x":"Doğru tercüme yapılması için şu dört metodun, ilgili hadise göre, denenmesi doğru sonuca götürecektir:"},{"k":"li","x":"i) Hadiste geçen bilinmeyen kelime için garîbu’l-hadîs kaynaklarına müracaat etme,"},{"k":"li","x":"ii) hadisin sebeb-i vürûdu ve hadisle ilgili detayları açıklayıcı diğer bilgileri tespit için hadisin farklı tariklerini mukayese etme,"},{"k":"li","x":"iii) hadisin, içinde geçtiği bâbın başlığı ile uyumuna dikkat etme,"},{"k":"li","x":"iv) ihtiyaç halinde hadis şerhlerine müracaat etme."},{"k":"steps","x":["Bilinmeyen kelime için garîbu’l-hadîs kaynakları","Farklı tariklerin mukayesesi (sebeb-i vürûd ve detaylar)","Bâb başlığıyla uyum","Gerekirse hadis şerhleri"]}]},{"h":"Mütercimin Sorumluluğu","b":[{"k":"p","x":"İncelememizde göze çarpan bir diğer husus da, bazı tercümelerde temel hadis kaynaklarına tam vâkıf olunmaması nedeniyle, meşhur bazı hadislerin bile yanlış tercümelerinin yapılabilmesidir. Bu açıdan, mütercimlerin gerek hadis usulü gerekse hadis metinlerine son derece vâkıf olmadan böyle ağır mesuliyet gerektiren bir işe girişmemeleri ve yapılan çalışmalara azâmi ihtimam ve hassasiyet göstermeleri gerekmektedir."},{"k":"p","x":"Teknolojinin çok geliştiği, önceleri çok büyük zaman ve zahmet gerektiren araştırmaların bir klavye tuşuyla gerçekleştirilebildiği zamanımızda, doğru tercümeyi tespit için gerekli tahriçlerin yapılmaması, ilgili şerhlere müracaat edilmemesi, bu hayâtî çalışmaların aceleye getirilmesi İslam dininin ikinci temel kaynağının Müslümanlara doğru / yanlış aktarılması noktasında herhalde çok büyük mesuliyeti mûcibtir. Bu noktada hadis uydurmakla ilgili nebevî uyarı, sahâbenin yanlış aktarırım düşüncesiyle hadis rivayeti hususundaki inanılmaz hassasiyeti (örneğin, Abdullah b. Mesud’un), tercümelerin de hadislerin bir yönüyle mânen rivayeti olduğu akıllarda tutulmalıdır."},{"k":"p","x":"Bu sahada bir boşluğu doldurmasını ümit ettiğimiz bu mütevazi çalışmanın aynı zamanda bundan sonraki, gitgide artan, hadis tercüme ve yorum çalışmalarında konunun hassasiyetine yönelik bir farkındalık oluşturmasını ve daha sağlıklı tercümeler için faydalı olmasını ümit etmekteyiz."}]}],"ht":[{"s":0,"x":"Hadis tercümeleri hadisleri öğrenmenin ilk adımıdır; tercüme mânen hadis rivayeti mesabesindedir."},{"s":1,"x":"Yaklaşık yetmiş bin hadis tercümesinde yaklaşık iki bin hata: 35 hadiste bir. Bu oran güveni sarsacak seviyede değildir; hadis akademisyenlerinin çevirileri daha başarılıdır."},{"s":2,"x":"Kelime ve ifadelerin mânaları için İbnü’l-Esîr’in en-Nihâye fî ğarîbi’l-hadîs’ine ve basit ta’lik çalışmalarına müracaat edilmelidir."},{"s":2,"x":"Önceki muteber tercümelerle mukayese: İngilizcede sunnah.com, Türkçede Mehmet Sofuoğlu’nun Buhârî tercümesi gibi kaynaklar."},{"s":3,"x":"Doğru tercüme için dört metod: garîbu’l-hadîs kaynakları, farklı tariklerin mukayesesi, bâb başlığıyla uyum, gerekirse şerhler."},{"s":4,"x":"Mütercim hadis usulüne ve hadis metinlerine son derece vâkıf olmalıdır; tahriç yapılmaması, şerhlere bakılmaması ve aceleye getirmek büyük mesuliyet doğurur."},{"s":4,"x":"Sahâbenin (ör. Abdullah b. Mes’ûd) yanlış aktarma endişesiyle rivâyetteki hassasiyeti akılda tutulmalıdır."}]},{"t":"Temel Hadis Kaynaklarının Çevirileri Üzerine Bir Kritik","intro":"Hangi eserlerin çevrileceği, bütün bir kitabı çevirmenin riskleri, ideal bir çeviride ihmal edilmemesi gereken on dört husus ve eşdeğerci ile işlevselci çeviri yaklaşımları.","s":[{"h":"Sonuç ve Öneriler","b":[{"k":"p","x":"Bilgi akışının sağlanması açısından bazı kaynakların farklı dillere çevrilmesi bir ihtiyaçtır. Ancak, burada özellikle halkın ihtiyaçlarının gözetilmesi kadar, hangi eserlerin çevrilmesi gerektiğini de iyi tespit etmek gerekir."},{"k":"p","x":"Son yıllarda ülkemizde görülen tercüme furyası ve ortaya çıkan çalışmalar, bu hususta bizleri endişeye sevk etmektedir. Daha henüz temel kaynakların sağlıklı çevirilerine sahip değilken, görüyoruz ki, bazı şerhler dahi çevrilmeye başlandı. Bunun ardında, gerçekten ilme duyulan bir ihtiyaç mı, yoksa başka sebepler mi vardır bilemiyoruz."},{"k":"p","x":"Başka bir husus da, merhum Tayyib Okiç hocamızın işaret ettiği üzere, bütün bir kitabı baştan sona çevirmenin de ciddi riskleri vardır. Özellikle, yeterli şerh veya izah yapılmadan, sadece çeviriyle yetinmenin bazı mahzurları bulunmaktadır. Özellikle, Hanefi bir topluma kazandırılan bir hadis kitabındaki mezhebin görüşüyle uyuşmayan hadisler, okuyucu için sorun olacaktır. Yahut Peygamberimizin şartlarında gayet normal olan bazı konuların yeterli açıklama yapılmadan verilmesi halinde okuyucunun kafası karışacağı muhakkaktır. Dolayısıyla çevirilerde bu tür karmaşayı önleyecek bazı parantezlerin açılması, ya da dipnotların atılması veya kısa da olsa bazı açıklamaların yapılması gerekmektedir."},{"k":"dikkat","x":"Bütün bir kitabı baştan sona, yeterli şerh veya izah yapmadan çevirmenin ciddi riskleri vardır; parantez, dipnot veya kısa açıklamalar gerekir."}]},{"h":"İdeal Bir Çeviride Dikkat Edilecek Hususlar (1–7)","b":[{"k":"p","x":"İdeal bir çeviri yapılırken şu hususlar ihmal edilmemelidir:"},{"k":"n","n":1,"x":"Türkçe sözlüklere başvurulmalı, çevrilen kelimeyi en iyi karşılayan sözcük, ifade veya deyim özenle seçilip kullanılmalıdır. Bu husus, çoğu çevirilerde göz ardı edilmektedir."},{"k":"n","n":2,"x":"Öncelikle hadis, mütercim tarafından doğru bir şekilde anlaşılmalıdır. Bunun için de, o hadisin bağlamı, zamanı ve zemini, illeti, hikmeti, vürûd sebebi iyi bilinmelidir. Bu ise, hadis, sünnet konularında ihtisas düzeyinde ciddi bir birikimi gerektirir."},{"k":"n","n":3,"x":"Çevrilen hadisin farklı kaynaklarda geçen, değişik versiyonları da dikkate alınmalı, rivayetlerimizde sıkça rastlanan hazf, takti’ ve ihtisar gibi hususlar, bu rivayet farklılıklarıyla telafi edilmelidir. Çevrilen metinde gözükmeyen kısımlar, diğer rivayetlerden ödünç alınıp parantez kullanılarak metindeki eksiklikler tamamlanmalıdır."},{"k":"n","n":4,"x":"Hadislerde geçen garip kelimeler için normal Arapça sözlüklere değil, mutlaka Garibü’l-hadis türündeki hadis sözlüklerine başvurulmalıdır. Hatta bunun için el-Halîl b. Ahmed’in Kitabü’l-Ayn’ı gibi en eski Arapça eserlere başvurmak da oldukça yararlı olacaktır. Eldeki CD’ler bu konuda işimizi hayli kolaylaştırmaktadır."},{"k":"n","n":5,"x":"Çevrilen bir kelimenin veya ifadenin birden fazla anlamı varsa, bu anlamlar içinde en doğru olanı tercih edilmelidir. Ancak yerine göre bazen “veya” diyerek, bazen (/) ile bazen de dipnot düşerek diğer anlam ve yorumlara da işaret edilmelidir."},{"k":"n","n":6,"x":"Hadislerin anlaşılmasında, klasik şerhlerimizin verilerinden yararlanılmalıdır. Özellikle CD’ler kullanılmak suretiyle bir anda birkaç şerhte ne tür izahlar yapıldığını görme imkanının olduğu günümüzde, şerhlerimizdeki yorum zenginliği ihmal edilmemelidir."},{"k":"n","n":7,"x":"Hadislerde geçen bazı kavramlar, dilimize de aynen geçmiş olmasına ve günlük dilde ve hayatta da kullanılmasına rağmen, zaman içerisinde bazı kavramlarda birtakım anlam kaymaları, daralmalar veya genişlemeler olabilmektedir. Çeviride, bu kavramların Hz. Peygamber’in dilinde ne anlama geldiği dikkate alınmalı, “kavramın anlamı nasıl olsa bilinmekte” düşüncesiyle Latinize ederek aynen nakletme yanılgısına düşülmemelidir. Bunun en bariz iki örneğini “nasihat” ve “ırz” kavramları oluşturmaktadır ve her ikisi üzerinde de müstakil iki makale yazılmıştır."},{"k":"ar","a":"الدين النصيحة","x":"Bu hadisteki “en-nasiha” kavramının “nasihat” diye çevrilmesi yanılgısı hayli yaygındır. Oysa Arapça’da ve Hz. Peygamber’in dilinde “en-nasiha” “içten-özden bağlılık ve samimiyet” diye çevrilmelidir."},{"k":"p","x":"Aynı yanlışlık “ırz” kavramının aynen yansıtılmasında da yapılmaktadır. Nitekim Buhari’deki bir bab başlığında yer alan şu rivayetin çevirisi bunun açık bir örneğini oluşturmaktadır:"},{"k":"ar","a":"لي الواجد يحل عقوبته وعرضه","x":"“Ödeyecek şeyi bulan kimsenin borç ödemeyi geciktirip uzatması, ona ceza vermeyi ve ırzını helal kılar” Buhari, İstikraz, 13 (bab başlığı)."},{"k":"p","x":"Bu çeviride “ırzını helal kılar” ifadesinin, Türk okuyucusunun zihninde ne tür yanlış çağrışımlar yapacağı dikkate alınmamıştır. Böyle bir ifadenin hem mantık hem de hukuk ve ahlak açısından yanlış sonuçlar doğuracağı da maalesef düşünülmemiştir. Oysa bu hadisin diğer bir versiyonunda Abdullah b. el-Mübarek’in yapmış olduğu açıklama, böyle bir tutumun, alacaklının borçluya ağır ifadeler kullanarak sataşmasına yol vermesi şeklindedir. Buna göre buradaki ırz ifadesiyle borçlunun onur ve haysiyeti kastedilmektedir. Yani, imkanı olduğu halde borcunu ödemeyen kişi, bu tür tariz ve sataşmalara muhatap olacak ve boyun eğecek demektir."},{"k":"tbl","r":[["Kavram","Yanlış çeviri","Doğru anlam"],["en-nasiha («الدين النصيحة»)","nasihat","İçten-özden bağlılık ve samimiyet"],["ırz («لي الواجد يحل عقوبته وعرضه»)","“ırzını helal kılar”","Borçlunun onur ve haysiyeti (Abdullah b. el-Mübarek’in açıklaması)"]]}]},{"h":"İdeal Bir Çeviride Dikkat Edilecek Hususlar (8–13)","b":[{"k":"n","n":8,"x":"Arapça tekid, istisna vb. ifade kalıplarını, Osmanlı medrese geleneğimizde tercüme edildiği gibi, “... yoktur ki, şöyle olmasın”, “... yapamaz, meğer ki şöyle olsun” şeklinde çevrilmesi, günümüzde hem anlamayı zorlaştırmakta hem de okuyucuyu yormaktadır. Bu tür ifadelerin, ayrı kalıplarla çevirmek yerine, daha düz, akıcı ve sade bir şekilde çevrilmesi daha uygun olacaktır."},{"k":"ar","a":"ما من داء إلا في الحبة السوداء شفاء إلا السام","x":"“Hiçbir dert yoktur ki, çörek otunda ona şifa bulunmasın, yalnız ölüm müstesna!” M5768 Müslim, Selam, 89 / A. Davudoğlu, IX. 646. — “Çörek otunda ölüm dışında her derde şifa vardır.” ifadesi, hem daha kısa, hem de daha açık ve anlaşılırdır."},{"k":"n","n":9,"x":"Şart-cevap cümlelerini çevirirken, “Her kim şöyle yaparsa, şöyle olur” yerine, daha düz ve açık çeviri yapmak, anlamayı kolaylaştıracaktır. Örneğin:"},{"k":"ar","a":"من جاء بالحسنة فله عشر أمثالها","x":"“Her kim bir hayırla gelirse, ona bu hayrın on misli vardır.” M6833 Müslim, Zikir, 221 / A. Davudoğlu, XI. 19. — “İyilik getirene, onun on katı verilir.”"},{"k":"n","n":10,"x":"Hadislerde çokça geçen “sizden biriniz, sizden herhangi biriniz” şeklinde çevrilen cümle kalıpları, dilimizde neredeyse hiç kullanılmamaktadır: Bunun yerine Peygamberimizin bununla bütün muhataplarına seslendiğini dikkate alarak doğrudan “Şöyle yapın! Böyle yapmayın!” şeklinde çevirmek de anlaşılmayı kolaylaştıracaktır. Örneğin:"},{"k":"ar","a":"لا يبولن أحدكم في الماء الدائم ثم يغتسل منه","x":"“Sizden biriniz sakın durgun suya abdest bozmasın, (ola ki) biraz sonra ondan gusleder.” D69 Ebû Dâvûd, Taharet, 36 / Komisyon, I. 134. — “Durgun suya işemeyin ki, orada yıkanabilesiniz!” “Kimse durgun suya işemesin! Ola ki, orada yıkanırsınız.”"},{"k":"n","n":11,"x":"Ancak, şayet hadiste, meclis içinde herhangi birini işaret ederek, edeben “sizden biri” şeklinde bir ifade kullanılmışsa, elbette bu o üslupla çevrilmelidir."},{"k":"n","n":12,"x":"Hadislerde geçen teşbih, istiare vb. edebi sanatlar çevrilirken, imkan nispetinde hem doğru çevrilmeli, hem de hadisteki edebi zevk ve ahenk de yansıtılmaya çalışılmalıdır. Özellikle deyimler, harfi olarak çevrilmemeli, o deyimin dilimizdeki karşılığı verilmelidir. Hz. Peygamber’in Hendek Savaşı anlatılırken geçen şu ifadede olduğu gibi:"},{"k":"ar","a":"ثم قام وبطنه معصوب بحجر ولبثنا ثلاثة أيام لا نذوق ذواقا","x":"“Sonra Peygamber karnına (açlıktan) bir taş parçası sarılmış olarak kalktı. Çünkü biz (hendek kazarken) üç gün yiyecek içecek bir şey tatmadan orada kalmıştık.” B4101 Buhari, Megazi, 30 / Sofuoğlu, VIII. 3840."},{"k":"p","x":"Oysa bu metinde geçen «وبطنه معصوب بحجر» ifadesi, Hüzeyl Kabilesi’nin lügatinde bir deyimdir ve aşırı açlıktan kinayedir. Her ne kadar bazı şarihlerimiz de bunu gerçeğe hamlederek çeşitli şekillerde tevil etmişler ise de, burada diğer izahların da dikkate alınması gerekecektir. Diğer rivayetteki ifade de bunu desteklemektedir:"},{"k":"ar","a":"فإني رأيت برسول الله صلى الله عليه وسلم خمصا شديدا","x":"“Çünkü ben Rasulullah’ta şiddetli bir karın boşluğu ve çekikliği gördüm.” B4102 Buhari, Megazi, 30 / Sofuoğlu, VIII. 3844."},{"k":"p","x":"Bu nedenle, yukarıdaki ifadeleri belki şu şekilde çevirmek daha isabetli olacaktır: “Sonra Hz. Peygamber, açlıktan karnı sırtına yapışmış vaziyette kalktı. Tam üç gün hiçbir şey tatmamıştık.” “Çünkü ben Rasulullahın (s) çok aç olduğunu anladım.”"},{"k":"p","x":"Çevirilerde, asıl olan hadisin içerdiği anlamın okuyucuya doğru ve açık bir şekilde aktarılmasıdır. Dolayısıyla metinde olmayan bir manayı veya herhangi bir yorumu çeviriye katmamak gerekir. Ancak, muhtemel bazı yanlış anlaşılmaları yahut metnin içeriğinin daha iyi anlaşılmasını sağlayacak bazı açıklamalar verilecekse, bu ya parantez ya da dipnot düşülmek suretiyle olmalıdır. Zira Arapça bilmeyen bir okuyucudan, asıl metin ile mütercimin yorumunu fark etmesi beklenmemelidir."},{"k":"n","n":13,"x":"Metne sadakat adına da olsa, okuyucunun anlayamayacağı şekilde lafzî/harfi çeviriden sakınılmalıdır. Mana ile rivayet, içeriği yansıtmak kaydıyla nasıl caiz görülmüşse, çeviride de anlamın yansıtılmasını hedefleyen bir yöntem tercih edilmelidir. Metne sadık kalıp anlaşılmamaktansa; lafzen tutmasa da, manayı tutturmak, anlamı okuyucuya ulaştırmak adına daha serbest yapılan bir çeviri yeğdir."},{"k":"tbl","r":[["Kalıp","Ağır çeviri","Sade çeviri"],["Tekid / istisna (8)","“Hiçbir dert yoktur ki, çörek otunda ona şifa bulunmasın, yalnız ölüm müstesna!”","“Çörek otunda ölüm dışında her derde şifa vardır.”"],["Şart-cevap (9)","“Her kim bir hayırla gelirse, ona bu hayrın on misli vardır.”","“İyilik getirene, onun on katı verilir.”"],["“Sizden biriniz” (10)","“Sizden biriniz sakın durgun suya abdest bozmasın…”","“Durgun suya işemeyin ki, orada yıkanabilesiniz!”"],["Deyim (12)","“Karnına bir taş parçası sarılmış olarak kalktı”","“Açlıktan karnı sırtına yapışmış vaziyette kalktı”"]]}]},{"h":"Metin Merkezli Yaklaşım ve Pergel Örneği (14)","b":[{"k":"n","n":14,"x":"Şimdiye kadar yapılan çevirilerde genellikle metin merkezli bir yaklaşım görülmüştür. Mütercim metne bağlı kalmak, metinden uzaklaşmamak için daha çok lafzı yansıtmayı, ibareyi aynen karşılamayı tercih etmişlerdir. Pergelin bir ayağını metnin üzerine sabitleyen mütercim, metinden uzaklaşmamak için diğer ayağını fazla açmamış ve metnin etrafında dönüp durmuştur. Bunu yaparken de okuyucuyu ihmal etmiştir. Bir mütercimin vazifesi, çevirdiği metni nasıl anladıysa, onu kendi dili ile ikinci dile dökmekle bitmemektedir. Bu husus, çevirinin sadece bir aşamasından ibarettir."},{"k":"p","x":"Oysa günümüzde yapılması gereken bundan farklıdır. Pergelin bir aya
